name: Validate SteamDB true-miss runtime resolutions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/steamdb_lookup_contract.json"
      - "config/execution_ownership_contract.json"
      - "data/cache/steamdb_runtime_state.json"
      - "data/cache/steamdb_web_resolutions.json"
      - "scripts/validate_steamdb_runtime_resolutions.py"
      - ".github/workflows/build-steamdb-true-miss-lookups.yml"

permissions:
  contents: write

concurrency:
  group: steamdb-true-miss-lookups
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate GitHub-ingested runtime resolutions against stage-15 scope
        run: python scripts/validate_steamdb_runtime_resolutions.py

      - name: Commit validated lookup ledger
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/steamdb_lookup.validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate SteamDB runtime miss resolutions"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
