name: One-shot pre-AI taste cache reuse diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-pre-ai-taste-cache-reuse.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure safe taste-cache reuse
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import unicodedata
          import urllib.request
          from collections import Counter
          from pathlib import Path

          family = json.loads(Path('data/production/pre_ai/family_graph.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/cache/taste_fit.index.json').read_text(encoding='utf-8'))
          ledger = json.loads(Path('data/cache/taste_fit.ledger_validation.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('config/mailing_policy.json').read_text(encoding='utf-8'))
          mailing = json.loads(Path('data/production/mailing/index.json').read_text(encoding='utf-8'))

          req = urllib.request.Request(
              'https://raw.githubusercontent.com/kentrap2011-hub/stopgame-ratings-data/main/gaming_taste_live.json',
              headers={'User-Agent': 'steam-kz-deals/1.0'},
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              profile_raw = resp.read()
          current_profile_sha = hashlib.sha1(
              f'blob {len(profile_raw)}\0'.encode('ascii') + profile_raw
          ).hexdigest()

          old_policy_sha = ledger['bindings']['policy_blob_sha']
          old_policy_raw = subprocess.check_output(['git', 'cat-file', 'blob', old_policy_sha])
          old_policy = json.loads(old_policy_raw.decode('utf-8'))
          semantic_keys = [
              'taste_profile',
              'taste_deal_separation',
              'personal_filter',
              'false_negative_audit',
              'taste_cache',
          ]
          taste_semantics_equal = all(old_policy.get(k) == policy.get(k) for k in semantic_keys)

          cols = mailing['columns']
          ci = {name: i for i, name in enumerate(cols)}
          feed = {}
          for n in range(1, int(mailing['chunk_count']) + 1):
              p = Path(mailing['chunk_pattern'].replace('NNN', f'{n:03d}'))
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  cells = line.split('\t')
                  key = cells[ci['key']]
                  payload = {
                      'key': key,
                      'appid': str(cells[ci['appid']]),
                      'normalized_title_for_taste': unicodedata.normalize('NFKC', cells[ci['title']]).lower(),
                      'sorted_fit_tags': sorted([] if cells[ci['fit_tags']] == '' else cells[ci['fit_tags']].split('|')),
                      'core_fit_count': int(cells[ci['core_fit_count']]),
                      'release_date': cells[ci['release_date']],
                  }
                  raw = json.dumps(payload, ensure_ascii=False, separators=(',', ':'))
                  feed[key] = {
                      'appid': payload['appid'],
                      'fingerprint': hashlib.sha256(raw.encode('utf-8')).hexdigest(),
                  }

          subjects = [x['taste_subject_key'] for x in family['families']]
          if len(subjects) != len(set(subjects)):
              raise SystemExit('duplicate taste subjects')
          cache = index['entries']
          raw_overlap = [k for k in subjects if k in cache]
          missing = [k for k in subjects if k not in cache]
          appid_matches = []
          fingerprint_matches = []
          stale_fingerprints = []
          verdict_counts = Counter()
          for key in raw_overlap:
              appid, fp, verdict, fit, reason = cache[key]
              verdict_counts[f'{verdict}:{fit}'] += 1
              if feed[key]['appid'] == str(appid):
                  appid_matches.append(key)
              if feed[key]['fingerprint'] == fp:
                  fingerprint_matches.append(key)
              else:
                  stale_fingerprints.append(key)

          current_model = policy['personal_filter']['structured_taste_evaluation']['taste_model_version']
          cache_model = index['taste_model_version']
          cache_profile_sha = index['profile_blob_sha']
          profile_match = current_profile_sha == cache_profile_sha
          model_match = current_model == cache_model
          safe_hits = (
              fingerprint_matches
              if profile_match and model_match and taste_semantics_equal
              else []
          )

          result = {
              'taste_subject_count': len(subjects),
              'taste_cache_entry_count': int(index['index_entry_count']),
              'raw_key_overlap_count': len(raw_overlap),
              'raw_key_miss_count': len(missing),
              'appid_match_count': len(appid_matches),
              'fingerprint_match_count': len(fingerprint_matches),
              'fingerprint_stale_count': len(stale_fingerprints),
              'cache_profile_blob_sha': cache_profile_sha,
              'current_profile_blob_sha': current_profile_sha,
              'profile_binding_matches': profile_match,
              'cache_taste_model_version': cache_model,
              'current_taste_model_version': current_model,
              'taste_model_matches': model_match,
              'ledger_bound_policy_blob_sha': old_policy_sha,
              'current_policy_blob_sha': subprocess.check_output(['git','hash-object','config/mailing_policy.json'], text=True).strip(),
              'taste_semantics_equal_to_ledger_policy': taste_semantics_equal,
              'safe_cache_hit_count': len(safe_hits),
              'ai_required_count': len(subjects) - len(safe_hits),
              'raw_overlap_verdict_counts': dict(sorted(verdict_counts.items())),
              'raw_miss_examples': missing[:20],
              'fingerprint_stale_examples': stale_fingerprints[:20],
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
