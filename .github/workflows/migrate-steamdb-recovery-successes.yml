name: Migrate archived SteamDB recovery successes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/migrate_steamdb_recovery_successes.py"
      - ".github/workflows/migrate-steamdb-recovery-successes.yml"

permissions:
  contents: write

concurrency:
  group: migrate-steamdb-recovery-successes
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import only archived successful observations
        run: python scripts/migrate_steamdb_recovery_successes.py

      - name: Commit cache if recovered facts were added
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/steamdb_history.json
          if git diff --cached --quiet; then
            echo "Recovery successes are already persisted"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Recover archived SteamDB history successes"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
