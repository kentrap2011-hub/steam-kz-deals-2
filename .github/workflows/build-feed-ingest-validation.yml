name: Build compact feed ingest validation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build mailing-optimized feed"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "config/feed_integrity_contract.json"
      - "scripts/build_feed_ingest_validation.py"
      - ".github/workflows/build-feed-ingest-validation.yml"

permissions:
  contents: write

concurrency:
  group: compact-feed-ingest-validation
  cancel-in-progress: true

jobs:
  validate:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mechanically validate exact feed bytes and emit compact proof
        run: python scripts/build_feed_ingest_validation.py

      - name: Commit compact validation artifact
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/feed_ingest.validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh compact feed ingest validation"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
