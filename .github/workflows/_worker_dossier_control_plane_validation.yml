name: Worker dossier control-plane validation

on:
  push:
    branches:
      - worker/taste-steam-review-dossier-control-plane-refresh-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile dossier control-plane entrypoints
        run: |
          python -m py_compile \
            scripts/taste_steam_review_dossier_daily.py \
            scripts/build_taste_steam_review_dossier_work.py \
            scripts/ingest_taste_steam_review_dossiers.py \
            scripts/build_taste_semantic_dossier_input.py \
            scripts/taste_steam_review_dossier_cleanup.py \
            scripts/test_taste_steam_review_dossier_daily_snapshot.py
      - name: Run fixed daily snapshot acceptance tests
        run: python scripts/test_taste_steam_review_dossier_daily_snapshot.py
