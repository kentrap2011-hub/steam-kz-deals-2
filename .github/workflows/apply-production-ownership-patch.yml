name: Apply production ownership reliability patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_production_ownership_patch.py"
      - ".github/workflows/apply-production-ownership-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply ownership patch
        run: python scripts/apply_production_ownership_patch.py
      - name: Run ownership regression test
        run: python scripts/test_production_output_ownership.py
      - name: Sanity-check prepared collector patch
        run: |
          ! grep -F "shutil.rmtree(OUT)" scripts/steam_production.py
          grep -F "reset_steam_collector_outputs(OUT)" scripts/steam_production.py
          grep -F "git add -A --" .github/workflows/steam-test.yml
      - name: Commit code and invariant changes
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            PROJECT_RULES.md \
            scripts/steam_production.py \
            scripts/production_output_ownership.py \
            scripts/test_production_output_ownership.py

          # The GitHub Actions token cannot update workflow files.  The
          # prepared steam-test.yml change is applied separately by the
          # connected GitHub client after this commit succeeds.
          git restore .github/workflows/steam-test.yml

          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi

          git commit -m "Isolate Steam collector production ownership"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
