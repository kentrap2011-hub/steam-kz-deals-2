name: Validate execution ownership

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/execution_ownership_contract.json"
      - "config/daily_execution_contract.json"
      - "config/russian_description_translation_contract.json"
      - "config/russian_description_translation_result_contract.json"
      - "config/russian_description_translation_cache_entry_contract.json"
      - "config/russian_description_manual_semantic_worker_prompt.md"
      - "config/progressive_personalization_contract.json"
      - "scripts/validate_execution_ownership.py"
      - "scripts/validate_russian_description_translation_contract.py"
      - "scripts/russian_description_quality.py"
      - "scripts/russian_description_translation_runtime.py"
      - "scripts/build_russian_description_translation_queue.py"
      - "scripts/ingest_russian_description_translations.py"
      - "scripts/build_visual_feed_v2.py"
      - "scripts/test_russian_description_quality.py"
      - "scripts/test_russian_description_translation_runtime.py"
      - "scripts/test_russian_description_manual_semantic_worker.py"
      - "scripts/test_validate_russian_descriptions_pending_ai.py"
      - "scripts/test_russian_translation_observability.py"
      - "scripts/validate_russian_descriptions.py"
      - "scripts/progressive_personalization.py"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - "web/app.js"
      - "web/index.html"
      - ".github/workflows/validate-execution-ownership.yml"
  push:
    branches: [main]
    paths:
      - "CHAT_CONTEXT.md"
      - "config/execution_ownership_contract.json"
      - "config/daily_execution_contract.json"
      - "config/steamdb_lookup_contract.json"
      - "config/russian_description_translation_contract.json"
      - "config/russian_description_translation_result_contract.json"
      - "config/russian_description_translation_cache_entry_contract.json"
      - "config/russian_description_manual_semantic_worker_prompt.md"
      - "config/progressive_personalization_contract.json"
      - "scripts/validate_execution_ownership.py"
      - "scripts/validate_russian_description_translation_contract.py"
      - "scripts/russian_description_quality.py"
      - "scripts/russian_description_translation_runtime.py"
      - "scripts/build_russian_description_translation_queue.py"
      - "scripts/ingest_russian_description_translations.py"
      - "scripts/build_visual_feed_v2.py"
      - "scripts/test_russian_description_quality.py"
      - "scripts/test_russian_description_translation_runtime.py"
      - "scripts/test_russian_description_manual_semantic_worker.py"
      - "scripts/test_validate_russian_descriptions_pending_ai.py"
      - "scripts/test_russian_translation_observability.py"
      - "scripts/validate_russian_descriptions.py"
      - "scripts/progressive_personalization.py"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - "web/app.js"
      - "web/index.html"
      - ".github/workflows/validate-execution-ownership.yml"

permissions:
  contents: read

concurrency:
  group: validate-execution-ownership
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate component ownership boundaries
        run: python scripts/validate_execution_ownership.py

      - name: Validate Russian description translation contract
        run: python scripts/validate_russian_description_translation_contract.py

      - name: Compile Russian description runtime
        run: |
          python -m py_compile \
            scripts/russian_description_quality.py \
            scripts/russian_description_translation_runtime.py \
            scripts/build_russian_description_translation_queue.py \
            scripts/ingest_russian_description_translations.py \
            scripts/build_visual_feed_v2.py \
            scripts/progressive_personalization.py \
            scripts/validate_russian_descriptions.py \
            scripts/test_russian_description_translation_runtime.py \
            scripts/test_russian_description_manual_semantic_worker.py \
            scripts/test_validate_russian_descriptions_pending_ai.py \
            scripts/test_russian_translation_observability.py

      - name: Run Russian description and Statistics regressions
        run: |
          python scripts/test_russian_description_quality.py
          python scripts/test_russian_description_translation_runtime.py
          python scripts/test_russian_description_manual_semantic_worker.py
          python scripts/test_validate_russian_descriptions_pending_ai.py
          python scripts/test_russian_translation_observability.py
          node web/progressive-personalization-ui.test.js
