name: One-shot StoreBrowse sale-end diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-storebrowse-sale-end.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe StoreBrowse sale-end coverage
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          idx=json.loads(Path('data/production/mailing/index.json').read_text(encoding='utf-8'))
          cols=idx['columns']; ci={n:i for i,n in enumerate(cols)}
          feed={}
          for n in range(1,int(idx['chunk_count'])+1):
              p=Path(idx['chunk_pattern'].replace('NNN',f'{n:03d}'))
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  c=line.split('\t'); key=c[ci['key']]
                  feed[key]={
                      'key':key,
                      'appid':c[ci['appid']],
                      'title':c[ci['title']],
                      'discount_percent':int(float(c[ci['discount_percent']])),
                      'final_kzt':float(c[ci['final_kzt']]),
                  }

          ids=[]
          for x in feed.values():
              if x['key'].startswith('App_') and x['appid']:
                  ids.append({'appid':int(x['appid'])})
              elif x['key'].startswith('Sub_'):
                  ids.append({'packageid':int(x['key'].split('_',1)[1])})

          started=time.monotonic(); items=[]; request_count=0
          for start in range(0,len(ids),100):
              batch=ids[start:start+100]
              payload={
                  'ids':batch,
                  'context':{'language':'english','country_code':'KZ','steam_realm':1},
                  'data_request':{'include_all_purchase_options':True},
              }
              url='https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json='+urllib.parse.quote(json.dumps(payload,separators=(',',':')))
              req=urllib.request.Request(url,headers={'User-Agent':'steam-kz-deals/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=json.loads(r.read().decode('utf-8'))
              request_count+=1
              items.extend((data.get('response') or {}).get('store_items') or [])

          def item_key(si):
              if si.get('appid'): return 'App_'+str(si['appid'])
              if si.get('packageid'): return 'Sub_'+str(si['packageid'])
              if si.get('bundleid'): return 'Bundle_'+str(si['bundleid'])
              return None

          matched={}; option_count=0; active_discount_rows=0; known_end=0; unknown_end=[]; mismatches=[]
          for si in items:
              key=item_key(si)
              if not key or key not in feed: continue
              matched[key]=si
              opts=si.get('purchase_options') or []
              option_count += len(opts)
              # Prefer purchase option whose id corresponds to the requested package for Sub_, otherwise best/first discounted option.
              chosen=None
              if key.startswith('Sub_'):
                  pid=int(key.split('_',1)[1])
                  chosen=next((o for o in opts if o.get('packageid')==pid),None)
              if chosen is None:
                  discounted=[o for o in opts if int(o.get('discount_pct') or 0)>0]
                  chosen=(discounted or opts or [None])[0]
              if not chosen: continue
              active=chosen.get('active_discounts') or []
              end_values=sorted({int(d.get('discount_end_date') or 0) for d in active if int(d.get('discount_end_date') or 0)>0})
              if int(chosen.get('discount_pct') or 0)>0:
                  active_discount_rows+=1
                  if end_values: known_end+=1
                  else: unknown_end.append({'key':key,'title':feed[key]['title'],'discount_percent':feed[key]['discount_percent']})
              api_discount=int(chosen.get('discount_pct') or 0)
              if api_discount and api_discount != feed[key]['discount_percent']:
                  mismatches.append({'key':key,'title':feed[key]['title'],'feed_discount':feed[key]['discount_percent'],'api_discount':api_discount})

          elapsed=time.monotonic()-started
          summary={
              'source_rows':len(feed),
              'requestable_ids':len(ids),
              'requests':request_count,
              'store_items_returned':len(items),
              'matched_rows':len(matched),
              'purchase_options_seen':option_count,
              'active_discount_rows_with_selected_option':active_discount_rows,
              'sale_end_known':known_end,
              'sale_end_unknown':len(unknown_end),
              'sale_end_coverage':round(known_end/active_discount_rows,4) if active_discount_rows else None,
              'discount_mismatch_count':len(mismatches),
              'elapsed_seconds':round(elapsed,3),
              'unknown_end_examples':unknown_end[:20],
              'discount_mismatch_examples':mismatches[:20],
              'observed_at_utc':datetime.now(timezone.utc).isoformat(),
          }
          print('STOREBROWSE_DIAGNOSTIC='+json.dumps(summary,ensure_ascii=False))
          PY
