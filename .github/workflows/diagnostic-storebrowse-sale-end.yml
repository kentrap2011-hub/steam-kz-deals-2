name: One-shot StoreBrowse sale-end diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-storebrowse-sale-end.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe StoreBrowse sale-end coverage
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          idx=json.loads(Path('data/production/mailing/index.json').read_text(encoding='utf-8'))
          cols=idx['columns']; ci={n:i for i,n in enumerate(cols)}
          feed={}
          for n in range(1,int(idx['chunk_count'])+1):
              p=Path(idx['chunk_pattern'].replace('NNN',f'{n:03d}'))
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  c=line.split('\t'); key=c[ci['key']]
                  feed[key]={
                      'key':key,
                      'appid':c[ci['appid']],
                      'title':c[ci['title']],
                      'discount_percent':int(float(c[ci['discount_percent']])),
                      'final_kzt':float(c[ci['final_kzt']]),
                  }

          requested=[]
          for x in feed.values():
              if x['key'].startswith('App_') and x['appid']:
                  requested.append((x['key'],{'appid':int(x['appid'])}))
              elif x['key'].startswith('Sub_'):
                  requested.append((x['key'],{'packageid':int(x['key'].split('_',1)[1])}))

          started=time.monotonic(); paired=[]; request_count=0; identity_errors=[]
          for start in range(0,len(requested),100):
              batch=requested[start:start+100]
              payload={
                  'ids':[x[1] for x in batch],
                  'context':{'language':'english','country_code':'KZ','steam_realm':1},
                  'data_request':{'include_all_purchase_options':True},
              }
              url='https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json='+urllib.parse.quote(json.dumps(payload,separators=(',',':')))
              req=urllib.request.Request(url,headers={'User-Agent':'steam-kz-deals/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=json.loads(r.read().decode('utf-8'))
              request_count+=1
              returned=(data.get('response') or {}).get('store_items') or []
              if len(returned)!=len(batch): raise SystemExit(f'Batch cardinality mismatch requested={len(batch)} returned={len(returned)}')
              for (key,rid),si in zip(batch,returned):
                  if 'appid' in rid:
                      ok=int(si.get('appid') or 0)==rid['appid']
                  else:
                      pid=rid['packageid']
                      ok=(int(si.get('packageid') or 0)==pid) or any(int(o.get('packageid') or 0)==pid for o in (si.get('purchase_options') or []))
                  if not ok: identity_errors.append({'key':key,'rid':rid,'appid':si.get('appid'),'packageid':si.get('packageid')})
                  paired.append((key,si))

          def final_kzt(option):
              value=option.get('final_price_in_cents')
              if value is None: return None
              return float(value)/100.0

          active_rows=0; known_end=0; unknown_end=[]; mismatches=[]; missing=[]; selection_methods={}
          for key,si in paired:
              row=feed[key]; opts=si.get('purchase_options') or []; chosen=None; method=None
              if key.startswith('Sub_'):
                  pid=int(key.split('_',1)[1])
                  chosen=next((o for o in opts if int(o.get('packageid') or 0)==pid),None)
                  method='exact_packageid' if chosen else None
              else:
                  exact=[o for o in opts if int(o.get('discount_pct') or 0)==row['discount_percent'] and final_kzt(o) is not None and abs(final_kzt(o)-row['final_kzt'])<0.011]
                  if exact:
                      chosen=sorted(exact,key=lambda o:(int(o.get('packageid') or 0),str(o.get('purchase_option_name') or '')))[0]; method='exact_feed_price_and_discount'
              if chosen is None:
                  discounted=[o for o in opts if int(o.get('discount_pct') or 0)>0 and final_kzt(o) is not None]
                  if discounted:
                      chosen=min(discounted,key=lambda o:(final_kzt(o),-int(o.get('discount_pct') or 0),int(o.get('packageid') or 0))); method='fallback_lowest_discounted_option'
              if chosen is None:
                  missing.append(key); continue
              selection_methods[method]=selection_methods.get(method,0)+1
              discount=int(chosen.get('discount_pct') or 0); price=final_kzt(chosen)
              active=chosen.get('active_discounts') or []
              ends=sorted({int(d.get('discount_end_date') or 0) for d in active if int(d.get('discount_end_date') or 0)>0})
              if discount>0:
                  active_rows+=1
                  if ends: known_end+=1
                  else: unknown_end.append(key)
              if discount!=row['discount_percent'] or price is None or abs(price-row['final_kzt'])>=0.011:
                  mismatches.append({'key':key,'title':row['title'],'feed_discount':row['discount_percent'],'store_discount':discount,'feed_kzt':row['final_kzt'],'store_kzt':price,'method':method})

          summary={
              'source_rows':len(feed),'requests':request_count,'paired_rows':len(paired),
              'identity_error_count':len(identity_errors),'missing_purchase_option_count':len(missing),
              'active_discount_rows':active_rows,'sale_end_known':known_end,'sale_end_unknown':len(unknown_end),
              'sale_end_coverage':round(known_end/active_rows,4) if active_rows else None,
              'deal_mismatch_count':len(mismatches),'selection_methods':selection_methods,
              'elapsed_seconds':round(time.monotonic()-started,3),'mismatch_examples':mismatches[:20],
              'observed_at_utc':datetime.now(timezone.utc).isoformat(),
          }
          print('STOREBROWSE_DIAGNOSTIC='+json.dumps(summary,ensure_ascii=False))
          if len(paired)!=len(feed) or identity_errors or missing or unknown_end or mismatches:
              raise SystemExit('StoreBrowse exact-deal mapping not fully proven')
          PY
