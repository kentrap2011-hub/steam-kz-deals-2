name: Ingest Progressive PASS 1 item

on:
  push:
    branches: [main]
    paths:
      - "data/ai_inbox/progressive_pass1/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taste-steam-review-dossier-canonical-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Progressive PASS 1 contract and item semantics
        run: python scripts/test_progressive_pass1.py

      - name: Ingest independent PASS 1 item artifacts
        run: python scripts/ingest_progressive_pass1.py

      - name: Recompute Progressive PASS 2 eligibility from accepted PASS 1 state
        run: python scripts/build_progressive_pass2_work.py

      - name: Revalidate PASS 1 state after ingest
        run: python scripts/test_progressive_pass1.py

      - name: Commit PASS 1 state and remaining work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add -A             data/ai_inbox/progressive_pass1             data/cache/progressive_pass1_state.json             data/cache/progressive_pass1_receipts             data/production/pre_ai/progressive_pass1_work.json             data/production/pre_ai/progressive_pass2_work.json
          if git diff --cached --quiet; then
            echo "Progressive PASS 1 state already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Ingest Progressive PASS 1 item"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
