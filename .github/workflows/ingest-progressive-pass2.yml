name: Ingest Progressive PASS 2 item

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progressive-pass2-control-plane
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PASS 2 core
        run: python scripts/test_progressive_pass2.py

      - name: Read activation guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          active=$(python - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('config/progressive_pass2_contract.json').read_text(encoding='utf-8'))
          work=json.loads(Path('data/production/pre_ai/progressive_pass2_work.json').read_text(encoding='utf-8'))
          print('true' if contract.get('active') is True and work.get('pass2_active') is True else 'false')
          PY
          )
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "PASS2_ACTIVE=$active"

      - name: Ingest independent PASS 2 artifacts
        if: steps.guard.outputs.active == 'true'
        run: python scripts/ingest_progressive_pass2.py

      - name: Revalidate PASS 2 state
        if: steps.guard.outputs.active == 'true'
        run: python scripts/test_progressive_pass2.py

      - name: Commit PASS 2 state and remaining work
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add -A             data/ai_inbox/progressive_pass2             data/cache/progressive_pass2_state.json             data/cache/progressive_pass2_execution_receipts             data/cache/progressive_pass2_ingest_receipts             data/production/pre_ai/progressive_pass2_work.json
          if git diff --cached --quiet; then
            echo "Progressive PASS 2 state already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Ingest Progressive PASS 2 item"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
