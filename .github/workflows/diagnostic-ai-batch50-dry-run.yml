name: 50-row AI taste batch dry-run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-ai-batch50-dry-run.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
