      - name: Quality and legacy sanity check
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          doc=json.loads(Path('/tmp/taste_batch50.json').read_text(encoding='utf-8'))
          results=doc['results']
          overlay=json.loads(Path('data/cache/taste_fit.entry_overlay.json').read_text(encoding='utf-8'))
          legacy=json.loads(Path('data/cache/taste_fit.json').read_text(encoding='utf-8'))
          old=legacy.get('entries') or {}
          reasons=Counter(r['reason_code'] for r in results)
          expected={'include_strong':4,'include_moderate':24,'exclude_audited_below':5,'exclude_insufficient':17}
          if dict(reasons)!=expected:
              raise SystemExit(f'Unexpected batch50 distribution: {dict(reasons)}')
          if overlay.get('entry_count')!=27:
              raise SystemExit('Dry-run changed or unexpected overlay baseline')
          if any(r['verdict']=='INCLUDE' and len(r['positive_evidence'])<2 for r in results):
              raise SystemExit('INCLUDE result lacks two explicit positive evidence items')
          overlaps=[]
          for r in results:
              o=old.get(r['key'])
              if o:
                  overlaps.append({'key':r['key'],'new_verdict':r['verdict'],'new_fit':r['fit_level'],'old_verdict':o.get('verdict'),'old_fit':o.get('fit_level'),'old_reason':o.get('reason_code'),'same_verdict':r['verdict']==o.get('verdict'),'same_fit':r['fit_level']==o.get('fit_level')})
          differences=[x for x in overlaps if not x['same_verdict'] or not x['same_fit']]
          print(json.dumps({'batch_count':len(results),'reason_distribution':dict(sorted(reasons.items())),'legacy_overlap_count':len(overlaps),'legacy_same_verdict_count':sum(x['same_verdict'] for x in overlaps),'legacy_same_fit_count':sum(x['same_fit'] for x in overlaps),'legacy_difference_count':len(differences),'legacy_differences':differences,'overlay_entry_count_after_dry_run':overlay['entry_count']},ensure_ascii=False,indent=2))
          print('AI_TASTE_BATCH50_DRY_RUN=PASS')
          PY
