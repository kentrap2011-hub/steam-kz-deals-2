name: Validate giveaway identity

on:
  pull_request:
    paths:
      - 'scripts/giveaway_identity.py'
      - 'scripts/giveaway_identity_itad.py'
      - 'scripts/giveaway_analysis_reuse.py'
      - 'scripts/giveaway_production.py'
      - 'scripts/giveaway_visual_handoff.py'
      - 'scripts/build_final_visual_payload.py'
      - 'scripts/test_giveaway_production.py'
      - 'scripts/test_giveaway_visual_handoff.py'
      - 'config/giveaway_identity_provider.json'
      - 'config/cross_platform_giveaway_contract.json'
      - 'web/giveaway-ui.js'
      - 'web/giveaway-ui.test.js'
      - '.github/workflows/validate-giveaway-identity.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test-only dependencies
        run: pip install requests beautifulsoup4
      - name: Compile giveaway modules
        run: |
          python -m py_compile scripts/giveaway_identity.py scripts/giveaway_identity_itad.py \
            scripts/giveaway_analysis_reuse.py scripts/giveaway_production.py \
            scripts/giveaway_visual_handoff.py scripts/build_final_visual_payload.py \
            scripts/test_giveaway_production.py scripts/test_giveaway_visual_handoff.py
      - name: Test canonical giveaway production and strict ITAD resolver
        run: python scripts/test_giveaway_production.py
      - name: Test source-neutral handoff and semantic reuse
        run: python scripts/test_giveaway_visual_handoff.py
      - name: Test existing IGDB read-only probe compatibility
        run: python scripts/test_giveaway_igdb_identity_probe.py
      - name: One-shot live ITAD exact shop-ID probe for PR 312 only
        if: ${{ github.event.pull_request.number == 312 }}
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          import giveaway_identity_itad as adapter
          from giveaway_http import make_session

          snapshot = json.loads(Path("data/production/giveaways/v1/current.json").read_text())
          config = json.loads(Path("config/giveaway_identity_provider.json").read_text())
          session = make_session()
          http = []
          shop_map_candidates = []
          for method in ("get", "post"):
              original = getattr(session, method)
              def tracked(url, *, _original=original, _method=method, **kwargs):
                  entry = {"method": _method.upper(), "path": urlsplit(url).path}
                  try:
                      response = _original(url, **kwargs)
                      entry["status"] = response.status_code
                      if _method == "get" and urlsplit(url).path == "/service/shops/map/v1" and response.status_code == 200:
                          try:
                              shop_map_candidates.extend([
                                  {"id": row.get("id"), "title": row.get("title")}
                                  for row in response.json() if isinstance(row, dict)
                                  and any(token in str(row.get("title", "")).casefold() for token in ("epic", "gog", "steam"))
                              ])
                          except Exception:
                              pass
                      http.append(entry)
                      return response
                  except Exception as exc:
                      entry["exception_type"] = type(exc).__name__
                      http.append(entry)
                      raise
              setattr(session, method, tracked)

          receipt = {
              "probe": "read_only_pr312_live_itad_exact_id_20261026",
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_snapshot_generated_at_utc": snapshot.get("generated_at_utc"),
              "source_snapshot_status": snapshot.get("snapshot_status"),
              "auth_route": "official_documented_none",
              "api": "https://api.isthereanydeal.com",
              "epic": [],
              "gog": [],
          }
          try:
              shop_ids = adapter.discover_shop_ids(session, config)
              receipt["shop_ids"] = shop_ids
              for game in snapshot.get("games", []):
                  for offer in game.get("offers", []):
                      if offer.get("storefront") != "epic":
                          continue
                      source_id = offer.get("source_product_id")
                      exact_id = source_id.rsplit(":", 1)[-1] if isinstance(source_id, str) and source_id.count(":") == 1 else None
                      if exact_id is None:
                          receipt["epic"].append({"source_product_id":source_id,"reason":"invalid_source_id"})
                          continue
                      uid, appid, reason = adapter.resolve_exact(session, config, shop_ids, "epic", exact_id)
                      receipt["epic"].append({
                          "source_product_id": source_id,
                          "epic_offer_id": exact_id,
                          "itad_uuid": uid,
                          "steam_appid": appid,
                          "reason": reason,
                          "status": "resolved" if appid else "unresolved",
                      })
              # Not canonical: this GOG ID was an earlier documented ITAD
              # product example, NOT a current giveaway or identity authority.
              # Never persist it or infer a GOG production result from it.
              historical_gog_id = "2104548474"
              uid, appid, reason = adapter.resolve_exact(
                  session, config, shop_ids, "gog", historical_gog_id
              )
              receipt["gog"].append({
                  "source": "noncanonical_historical_transport_diagnostic_only",
                  "gog_product_id": historical_gog_id,
                  "itad_uuid": uid,
                  "steam_appid": appid,
                  "reason": reason,
                  "status": "resolved" if appid else "unresolved",
                  "production_authority": False,
              })
          except adapter.ITADUnavailable as exc:
              receipt["blocker"] = str(exc)
          except Exception as exc:
              receipt["blocker"] = type(exc).__name__
          receipt["http"] = http
          receipt["observed_shop_titles"] = shop_map_candidates
          print("ITAD_LIVE_PROBE_RECEIPT=" + json.dumps(receipt, sort_keys=True))
          assert len(http) <= 7, "Live probe exceeded 7 HTTP requests"
          PY
      - name: Test read-only giveaway website rendering
        run: node web/giveaway-ui.test.js
