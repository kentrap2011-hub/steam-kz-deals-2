name: Assemble SteamDB runtime resolutions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/cache/steamdb_runtime_progress.json"
      - "data/cache/steamdb_runtime_batches/**"
      - "data/cache/steamdb_miss_manifest.json"
      - "scripts/assemble_steamdb_runtime_resolutions.py"
      - ".github/workflows/assemble-steamdb-runtime-resolutions.yml"

permissions:
  contents: write

concurrency:
  group: assemble-steamdb-runtime-resolutions
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble only already-fetched runtime evidence
        run: python scripts/assemble_steamdb_runtime_resolutions.py

      - name: Commit complete runtime resolutions if produced
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/steamdb_web_resolutions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish complete SteamDB runtime resolutions"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
