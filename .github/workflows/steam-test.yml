name: Steam KZ production shortlist

on:
  workflow_dispatch:

  schedule:
    # 06:30 по Самаре (02:30 UTC); canonical app-identity production trigger
    - cron: "30 2 * * *"

  push:
    branches: [main]
    paths:
      - ".github/workflows/steam-test.yml"
      - "scripts/steam_production.py"

permissions:
  contents: write

concurrency:
  group: steam-kz-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect full Steam KZ catalog and build production shortlist
        run: python scripts/steam_production.py

      - name: Commit production feed
        shell: bash
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"

          git add -A data/production/

          if git diff --cached --quiet; then
            echo "No production feed changes"
            exit 0
          fi

          git commit -m "Update Steam KZ production shortlist"

          # Пока длинный сборщик работает, main может успеть
          # продвинуться другим commit/workflow.
          # Подтягиваем свежий main, перебазируем наш commit
          # и повторяем push при редкой гонке.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main:refs/remotes/origin/main

            if ! git rebase origin/main; then
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Production feed pushed successfully."
              exit 0
            fi

            echo "main changed again before push; retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts."
          exit 1
