name: Steam KZ production shortlist

on:
  workflow_dispatch:

  # Lightweight deterministic validation only. The production collector job is
  # explicitly disabled for pull_request events below.
  pull_request:
    branches:
      - main
    paths:
      - "scripts/steam_production.py"
      - "scripts/steam_partial_publish.py"
      - "scripts/steam_partial_publish_runner.py"
      - "scripts/discovery_freshness.py"
      - "scripts/build_pre_ai_store_snapshot.py"
      - "scripts/build_pre_ai_taste_projection.py"
      - "scripts/refresh_visual_commercial_fields.py"
      - "scripts/build_final_visual_payload.py"
      - "scripts/test_discovery_freshness.py"
      - "scripts/test_fresh_deal_discovery_refresh.py"
      - "scripts/test_steam_review_fallback.py"
      - "scripts/test_steam_discovery_scope_reduction.py"
      - "scripts/steam_discovery_discount_filter_probe.py"
      - "scripts/test_expired_offer_guard.py"
      - "scripts/test_commercial_refresh.py"
      - "config/mailing_policy.json"
      - "config/mailing_policy.md"
      - ".github/workflows/steam-test.yml"

  # Разработческие изменения collectors/production validation проверяем автоматически.
  # Обычные production/data-коммиты этот тяжёлый workflow не запускают.
  push:
    branches:
      - main
    paths:
      - "scripts/steam_production.py"
      - "scripts/steam_production_cached.py"
      - "scripts/steam_partial_publish.py"
      - "scripts/steam_partial_publish_runner.py"
      - "scripts/test_steam_partial_publish.py"
      - "scripts/test_steam_discovery_scope_reduction.py"
      - "scripts/discovery_freshness.py"
      - "scripts/test_discovery_freshness.py"
      - "scripts/test_fresh_deal_discovery_refresh.py"
      - "scripts/steam_traversal_recovery.py"
      - "scripts/test_steam_traversal_recovery.py"
      - "scripts/production_output_ownership.py"
      - "scripts/test_production_output_ownership.py"
      - "scripts/giveaway_core.py"
      - "scripts/giveaway_http.py"
      - "scripts/giveaway_steam.py"
      - "scripts/giveaway_epic.py"
      - "scripts/giveaway_gog.py"
      - "scripts/giveaway_production.py"
      - "scripts/test_giveaway_production.py"
      - "scripts/giveaway_igdb_identity_probe.py"
      - "scripts/test_giveaway_igdb_identity_probe.py"
      - "config/cross_platform_giveaway_contract.json"
      - "config/mailing_policy.json"
      - "config/mailing_policy.md"
      - ".github/workflows/steam-test.yml"

  schedule:
    # Один суточный коммерческий снимок. 00:10 по Самаре (20:10 UTC предыдущего дня),
    # чтобы полный GitHub-пайплайн успел закончиться до ночной AI-подготовки в 01:00.
    - cron: "10 20 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-kz-production
  cancel-in-progress: false

jobs:
  regression:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required by historical material-freshness regression below.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: pip install requests beautifulsoup4

      - name: Bounded live Steam discount filter probe
        run: python -u scripts/steam_discovery_discount_filter_probe.py

      - name: Compile touched Python modules
        run: |
          python -m py_compile \
            scripts/steam_production.py \
            scripts/steam_partial_publish_runner.py \
            scripts/test_steam_discovery_scope_reduction.py \
            scripts/discovery_freshness.py \
            scripts/build_pre_ai_store_snapshot.py \
            scripts/build_pre_ai_taste_projection.py \
            scripts/refresh_visual_commercial_fields.py \
            scripts/build_final_visual_payload.py \
            scripts/test_discovery_freshness.py \
            scripts/test_fresh_deal_discovery_refresh.py \
            scripts/test_expired_offer_guard.py \
            scripts/test_commercial_refresh.py

      - name: Run fresh discovery regressions
        run: |
          python scripts/test_discovery_freshness.py
          python scripts/test_fresh_deal_discovery_refresh.py
          python scripts/test_steam_review_fallback.py
          python scripts/test_steam_discovery_scope_reduction.py
          python scripts/test_expired_offer_guard.py
          python scripts/test_commercial_refresh.py
          python scripts/test_steam_partial_publish.py
          python scripts/test_production_output_ownership.py
          python scripts/test_pre_ai_deal_contract_guard.py
          python scripts/test_visual_freshness_receipt.py
          python scripts/test_visual_material_freshness_guard.py
          python scripts/test_backlog_disposition_validator.py
          python scripts/validate_backlog_dispositions.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
          python scripts/validate_execution_ownership.py
          python scripts/test_progressive_personalization.py
          python scripts/test_progressive_pass1.py

  collect:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Regression test Steam partial publish
        run: python scripts/test_steam_partial_publish.py

      - name: Regression test bounded Steam discovery scope
        run: python scripts/test_steam_discovery_scope_reduction.py

      - name: Regression test fresh deal discovery lifecycle
        run: |
          python scripts/test_discovery_freshness.py
          python scripts/test_fresh_deal_discovery_refresh.py

      - name: Regression test Steam traversal recovery
        run: python scripts/test_steam_traversal_recovery.py

      - name: Regression test production output ownership
        run: python scripts/test_production_output_ownership.py

      - name: Regression test cross-platform giveaways
        run: python scripts/test_giveaway_production.py

      - name: Regression test giveaway IGDB identity probe
        run: python scripts/test_giveaway_igdb_identity_probe.py

      - name: Collect Steam KZ catalog with partial publish failure isolation
        run: python -u scripts/steam_partial_publish_runner.py

      - name: Verify Steam collector touched only owned production paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^data/production/(manifest\.json|freebies\.tsv|freebies_index\.json|shortlist/)'

          foreign_tracked="$(git diff --name-only -- data/production | grep -Ev "$allowed" || true)"
          foreign_untracked="$(git ls-files --others --exclude-standard -- data/production | grep -Ev "$allowed" || true)"

          if [[ -n "$foreign_tracked" || -n "$foreign_untracked" ]]; then
            echo "Steam collector modified production artifacts owned by another stage."
            printf '%s\n' "$foreign_tracked" "$foreign_untracked"
            exit 1
          fi

      - name: Build canonical Steam Epic GOG KZ giveaways
        run: python scripts/giveaway_production.py

      - name: Validate canonical giveaway artifact contract
        run: python scripts/giveaway_production.py --validate-only

      - name: Verify production writers touched only owned paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^data/production/(manifest\.json|freebies\.tsv|freebies_index\.json|shortlist/|giveaways/)'

          foreign_tracked="$(git diff --name-only -- data/production | grep -Ev "$allowed" || true)"
          foreign_untracked="$(git ls-files --others --exclude-standard -- data/production | grep -Ev "$allowed" || true)"

          if [[ -n "$foreign_tracked" || -n "$foreign_untracked" ]]; then
            echo "Production workflow modified artifacts outside collector/giveaway ownership."
            printf '%s\n' "$foreign_tracked" "$foreign_untracked"
            exit 1
          fi

      - name: Commit production feed, giveaways, failure state and review cache
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"

          # Each producer keeps its own path family. Steam partial-publish owns
          # its durable failure state in addition to the existing review cache.
          git add -A -- \
            data/production/shortlist \
            data/production/manifest.json \
            data/production/freebies.tsv \
            data/production/freebies_index.json \
            data/production/giveaways
          git add data/cache/steam_review_http_cache.json
          git add data/cache/steam_partial_publish_failures.json
          if [[ -d data/cache/steam_partial_publish_failures_quarantine ]]; then
            git add -A -- data/cache/steam_partial_publish_failures_quarantine
          fi

          if git diff --cached --quiet; then
            echo "No production feed changes"
            exit 0
          fi

          git commit -m "Update Steam KZ production and giveaways"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Пока длинный сборщик работает, main может успеть
          # продвинуться другим commit/workflow.
          # Подтягиваем свежий main, перебазируем наш commit
          # и повторяем push при редкой гонке.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main:refs/remotes/origin/main

            if ! git rebase origin/main; then
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Production feed pushed successfully."
              exit 0
            fi

            echo "main changed again before push; retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts."
          exit 1

      - name: Dispatch visual refresh after production update
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-daily-visual-payload.yml --ref main
