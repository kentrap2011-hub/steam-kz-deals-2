name: Build compact deal feed

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - ".github/workflows/build-feed.yml"

  workflow_run:
    workflows:
      - "Update Steam KZ deals"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: steam-kz-feed
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build small feed chunks
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          SOURCE = Path(
              "data/candidates_under_3500.json"
          )

          OUT = Path("data/feed")

          # 100 строк — специально небольшой размер,
          # чтобы ChatGPT/GitHub-коннектор
          # мог читать каждый файл полностью.
          CHUNK_SIZE = 100

          if not SOURCE.exists():
              raise SystemExit(
                  "Source candidates file is missing"
              )

          source = json.loads(
              SOURCE.read_text(
                  encoding="utf-8"
              )
          )

          items = source.get("items", [])
          metadata = source.get(
              "metadata",
              {}
          )

          if not items:
              raise SystemExit(
                  "Candidate list is empty"
              )

          if OUT.exists():
              shutil.rmtree(OUT)

          OUT.mkdir(
              parents=True,
              exist_ok=True,
          )


          def clean(value):
              if value is None:
                  return ""

              return (
                  str(value)
                  .replace("\t", " ")
                  .replace("\r", " ")
                  .replace("\n", " ")
              )


          chunk_count = 0


          for start in range(
              0,
              len(items),
              CHUNK_SIZE,
          ):
              chunk_count += 1

              subset = items[
                  start:start + CHUNK_SIZE
              ]

              rows = []

              for item in subset:
                  price = item.get(
                      "final_kzt"
                  )

                  if isinstance(
                      price,
                      float,
                  ):
                      price = f"{price:g}"

                  values = [
                      item.get("key"),
                      item.get("appid"),
                      item.get(
                          "discount_percent"
                      ),
                      price,
                      item.get("title"),
                  ]

                  rows.append(
                      "\t".join(
                          clean(value)
                          for value in values
                      )
                  )

              filename = (
                  f"chunk_{chunk_count:03d}.tsv"
              )

              (OUT / filename).write_text(
                  "\n".join(rows) + "\n",
                  encoding="utf-8",
              )


          index = {
              "version": 2,

              "format": "tsv",

              "columns": [
                  "key",
                  "appid",
                  "discount_percent",
                  "final_kzt",
                  "title",
              ],

              "country_code": "kz",

              "item_count":
                  len(items),

              "chunk_size":
                  CHUNK_SIZE,

              "chunk_count":
                  chunk_count,

              "chunk_pattern":
                  "data/feed/chunk_NNN.tsv",

              "source_updated_at_utc":
                  metadata.get(
                      "updated_at_utc"
                  ),

              "source_complete":
                  metadata.get(
                      "complete"
                  ),

              "source_coverage_ratio":
                  metadata.get(
                      "coverage_ratio"
                  ),
          }


          (OUT / "index.json").write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )


          print(
              json.dumps(
                  {
                      "items":
                          len(items),

                      "chunk_size":
                          CHUNK_SIZE,

                      "chunk_count":
                          chunk_count,

                      "last_chunk_items":
                          (
                              len(items)
                              % CHUNK_SIZE
                          )
                          or CHUNK_SIZE,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )

          PY

      - name: Commit compact feed
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"

          git add -A data/feed/

          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi

          git commit -m "Rebuild compact Steam deal feed"
          git push
