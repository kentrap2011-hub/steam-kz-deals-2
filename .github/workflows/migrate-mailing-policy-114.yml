name: Migrate mailing policy 1.14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-mailing-policy-114.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch canonical policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pth = Path('config/mailing_policy.json')
          p = json.loads(pth.read_text(encoding='utf-8'))
          p['version'] = '1.14'
          p['purpose'] = 'Personalized daily Steam KZ deal data preparation with stable price-blind taste verdicts, taste-first eligibility, one nightly commercial snapshot, and resumable taste-cache checkpoints.'

          sep = p['taste_deal_separation']
          sep['taste_is_primary_eligibility_filter'] = True
          sep['minimum_taste_fit_cannot_be_rescued_by_discount'] = True
          sep['symbolic_discount_only_early_commercial_exclusion'] = True
          sep['non_symbolic_deal_weakness_changes_priority_or_wait_status_not_taste_fit'] = True

          pf = p['personal_filter']
          reasons = pf['valid_exclusion_reason_codes']
          if 'symbolic_discount_not_worth_mailing_attention' not in reasons:
              reasons.append('symbolic_discount_not_worth_mailing_attention')
          pf['deal_discount_cannot_upgrade_below_moderate_taste'] = True

          pricing = p['pricing']
          pricing['symbolic_discount_max_percent_inclusive'] = 5
          pricing['symbolic_discount_is_early_exclusion'] = True
          pricing['no_absolute_price_exclusion_for_moderate_or_strong_taste'] = True
          pricing['expensive_game_may_remain_if_taste_fit_and_discount_are_meaningful'] = True
          pricing['weak_but_non_symbolic_deal_remains_available_for_wait_or_low_priority'] = True

          ver = p['verification']
          ver['commercial_refresh_frequency'] = 'once_per_day_nightly'
          ver['no_network_refresh_for_morning_delivery'] = True
          ver['known_sale_end_may_be_applied_locally_without_network'] = True

          sorting = p['sorting']
          sorting['taste_is_primary'] = True
          sorting['conceptual_weight_taste'] = 0.6
          sorting['conceptual_weight_deal'] = 0.4
          sorting['do_not_invent_numeric_taste_score_until_separately_agreed'] = True
          sorting['visual_presentation_redesign_deferred'] = True
          sorting['weak_non_symbolic_deal_should_rank_low_or_wait_not_disappear'] = True

          p['presentation_strategy'] = {
              'status': 'deferred_until_data_optimization_complete',
              'do_not_optimize_current_visual_mailing_format_now': True,
              'user_will_define_future_presentation_after_data_pipeline_optimization': True,
              'current_format_may_be_replaced_entirely': True,
          }

          pth.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate migrated policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/mailing_policy.json').read_text(encoding='utf-8'))
          assert p['version']=='1.14'
          assert p['pricing']['symbolic_discount_max_percent_inclusive']==5
          assert p['pricing']['no_absolute_price_exclusion_for_moderate_or_strong_taste'] is True
          assert p['taste_deal_separation']['minimum_taste_fit_cannot_be_rescued_by_discount'] is True
          assert p['presentation_strategy']['status']=='deferred_until_data_optimization_complete'
          print('MAILING_POLICY_114=PASS')
          PY

      - name: Commit canonical policy
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add config/mailing_policy.json
          git diff --cached --check
          git commit -m "Adopt taste-first deal eligibility policy"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
