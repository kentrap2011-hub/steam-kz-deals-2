name: One-shot StoreBrowse metadata equivalence diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-storebrowse-metadata.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare StoreBrowse metadata with existing validated metadata
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path

          idx=json.loads(Path('data/production/mailing/index.json').read_text(encoding='utf-8'))
          cols=idx['columns']; ci={n:i for i,n in enumerate(cols)}
          feed={}
          for n in range(1,int(idx['chunk_count'])+1):
              p=Path(idx['chunk_pattern'].replace('NNN',f'{n:03d}'))
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  c=line.split('\t'); key=c[ci['key']]
                  feed[key]={'appid':c[ci['appid']],'title':c[ci['title']]}

          old=json.loads(Path('data/cache/content_metadata.json').read_text(encoding='utf-8')).get('entries') or {}
          requested=[]
          for key,row in feed.items():
              if key.startswith('App_'):
                  requested.append((key,{'appid':int(row['appid'])}))
              elif key.startswith('Sub_'):
                  requested.append((key,{'packageid':int(key.split('_',1)[1])}))

          all_items={}; requests=0; started=time.monotonic()
          for start in range(0,len(requested),100):
              batch=requested[start:start+100]
              payload={
                'ids':[rid for _,rid in batch],
                'context':{'language':'english','country_code':'KZ','steam_realm':1},
                'data_request':{
                  'include_all_purchase_options':True,
                  'include_basic_info':True,
                  'include_included_items':True,
                },
              }
              url='https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json='+urllib.parse.quote(json.dumps(payload,separators=(',',':')))
              req=urllib.request.Request(url,headers={'User-Agent':'steam-kz-deals/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=json.loads(r.read().decode('utf-8'))
              returned=(data.get('response') or {}).get('store_items') or []
              if len(returned)!=len(batch): raise SystemExit('cardinality mismatch')
              requests+=1
              for (key,rid),si in zip(batch,returned):
                  if 'appid' in rid and int(si.get('appid') or 0)!=rid['appid']:
                      raise SystemExit(f'app identity mismatch {key}')
                  if 'packageid' in rid:
                      pid=rid['packageid']
                      if int(si.get('id') or si.get('packageid') or 0)!=pid and not any(int(o.get('packageid') or 0)==pid for o in (si.get('purchase_options') or [])):
                          raise SystemExit(f'package identity mismatch {key}')
                  all_items[key]=si

          type_map={0:'game',1:'demo',2:'mod',3:'movie',4:'dlc',5:'guide',6:'software',7:'video',8:'series',9:'episode',10:'hardware',11:'music',12:'beta',13:'tool',14:'advertising'}
          comparisons=[]; mismatch=[]; comparable=0
          samples={'app':None,'dlc':None,'sub':None}
          for key,expected in old.items():
              si=all_items.get(key)
              if not si: continue
              if expected.get('entity_kind')=='app':
                  type_num=int(si.get('type') or 0)
                  got_type=type_map.get(type_num,f'unknown:{type_num}')
                  related=si.get('related_items') or {}
                  parent=str(related.get('parent_appid') or '') or None
                  exp_parent=str(expected.get('fullgame_appid') or '') or None
                  ok=(got_type==expected.get('app_type') and (expected.get('app_type')!='dlc' or parent==exp_parent))
                  comparable+=1
                  row={'key':key,'expected_type':expected.get('app_type'),'got_type':got_type,'expected_parent':exp_parent,'got_parent':parent,'ok':ok}
                  comparisons.append(row)
                  if not ok: mismatch.append(row)
                  if got_type=='dlc' and samples['dlc'] is None: samples['dlc']={'key':key,'store_item':si}
                  elif got_type!='dlc' and samples['app'] is None: samples['app']={'key':key,'store_item':si}
              elif expected.get('entity_kind')=='sub':
                  expected_ids=sorted(str(x.get('appid')) for x in (expected.get('package_apps') or []) if x.get('appid') is not None)
                  got_ids=sorted(str(x) for x in (si.get('included_appids') or []))
                  # included_items may carry the same ids if included_appids is absent.
                  if not got_ids:
                      inc=si.get('included_items') or {}
                      got_ids=sorted(str(x.get('appid')) for x in (inc.get('included_apps') or []) if x.get('appid') is not None)
                  ok=(got_ids==expected_ids)
                  comparable+=1
                  row={'key':key,'expected_appids':expected_ids,'got_appids':got_ids,'ok':ok}
                  comparisons.append(row)
                  if not ok: mismatch.append(row)
                  if samples['sub'] is None: samples['sub']={'key':key,'store_item':si}

          summary={
            'source_count':len(feed),'requests':requests,'returned_count':len(all_items),
            'control_entries':len(old),'comparable_control_entries':comparable,
            'mismatch_count':len(mismatch),'match_count':comparable-len(mismatch),
            'match_ratio':round((comparable-len(mismatch))/comparable,4) if comparable else None,
            'elapsed_seconds':round(time.monotonic()-started,3),
            'mismatch_examples':mismatch[:20],
            'sample_shapes':{k:({'key':v['key'],'top_keys':sorted(v['store_item'].keys()),'type':v['store_item'].get('type'),'item_type':v['store_item'].get('item_type'),'related_items':v['store_item'].get('related_items'),'included_appids':v['store_item'].get('included_appids'),'included_items_keys':sorted((v['store_item'].get('included_items') or {}).keys())} if v else None) for k,v in samples.items()},
          }
          print('STOREBROWSE_METADATA_DIAGNOSTIC='+json.dumps(summary,ensure_ascii=False))
          if mismatch:
              raise SystemExit('StoreBrowse metadata differs from validated control')
          PY
