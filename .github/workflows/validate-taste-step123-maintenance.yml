name: Validate Taste Steps 1-3 maintenance guards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "USER_TASTE_PROFILE.md"
      - "config/play_priority_context_contract.json"
      - "scripts/play_priority_context.py"
      - "scripts/test_play_priority_context.py"
      - "scripts/test_taste_evidence_states.py"
      - "scripts/taste_negative_contract.py"
      - "scripts/test_taste_step123_maintenance_guards.py"
      - "scripts/test_taste_steps123_production_acceptance.py"
      - "data/production/pre_ai/chatgpt_payload.json"
      - "data/production/pre_ai/taste_projection.json"
      - "data/production/pre_ai/chatgpt_taste_queue.jsonl"
      - "data/production/visual/current.json"
      - ".github/workflows/validate-taste-step123-maintenance.yml"

permissions:
  contents: write

concurrency:
  group: taste-step123-maintenance-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate role/start behavior and maintenance provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_play_priority_context.py
          python scripts/test_taste_evidence_states.py
          python scripts/test_taste_step123_maintenance_guards.py

      - name: Inspect current production materialization acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_taste_steps123_production_acceptance.py

      - name: Persist deterministic acceptance observability snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/taste_steps123_production_acceptance.json
          if git diff --cached --quiet; then
            echo "Acceptance snapshot unchanged"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update Taste Steps 1-3 production acceptance snapshot"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
