name: Build SteamDB cache classification

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Checkpoint SteamDB history"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - "config/steamdb_cache_classification_contract.json"
      - "data/cache/steamdb_history.json"
      - "data/cache/store_state.validation.json"
      - "data/cache/offer_family.validation.json"
      - ".github/workflows/build-steamdb-cache-classification.yml"

permissions:
  contents: write

concurrency:
  group: steamdb-cache-classification
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify SteamDB cache for current primaries
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          POLICY=Path('config/mailing_policy.json')
          CONTRACT=Path('config/steamdb_cache_classification_contract.json')
          HISTORY=Path('data/cache/steamdb_history.json')
          STORE=Path('data/cache/store_state.validation.json')
          FAMILIES=Path('data/cache/offer_family.validation.json')
          OUT=Path('data/cache/steamdb_cache.validation.json')

          def sha(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()

          def parse_dt(text):
              if not text: return None
              try:
                  return datetime.fromisoformat(str(text).replace('Z','+00:00'))
              except Exception:
                  return None

          policy=json.loads(POLICY.read_text(encoding='utf-8'))
          contract=json.loads(CONTRACT.read_text(encoding='utf-8'))
          hist=json.loads(HISTORY.read_text(encoding='utf-8'))
          store=json.loads(STORE.read_text(encoding='utf-8'))
          fam=json.loads(FAMILIES.read_text(encoding='utf-8'))

          if policy.get('status')!='canonical': raise SystemExit('Policy not canonical')
          if contract.get('contract')!='STEAMDB-CACHE-CLASSIFICATION-V1': raise SystemExit('Unexpected SteamDB classification contract')
          if store.get('status')!='complete': raise SystemExit('Store state incomplete')
          if fam.get('status')!='complete': raise SystemExit('Offer family incomplete')

          entries=hist.get('entries')
          if not isinstance(entries,dict): raise SystemExit('SteamDB entries malformed')
          actual_entry_count=len(entries)
          schema=int(hist.get('schema_version') or 0)
          accepted={1, int(policy['external_cache']['steamdb_history']['writer_schema_version'])}
          if schema not in accepted: raise SystemExit(f'Unsupported SteamDB cache schema {schema}')

          current_by_key={x['primary_key']:x for x in store['current_state']}
          primary_keys=[f['primary_key'] for f in fam['families']]
          if len(primary_keys)!=len(set(primary_keys)): raise SystemExit('Duplicate primary keys')
          if set(primary_keys)!=set(current_by_key): raise SystemExit('Store/family primary key mismatch')

          ttl_days=int(policy['external_cache']['steamdb_history']['negative_cache']['ttl_days'])
          now=datetime.now(timezone.utc)

          confirmed=[]; free=[]; negative=[]; misses=[]; invalid=[]
          for key in sorted(primary_keys):
              current=float(current_by_key[key]['final_kzt'])
              entry=entries.get(key)
              if entry is None:
                  misses.append({'key':key,'reason':'entry_missing','current_kzt':current})
                  continue
              if not isinstance(entry,dict):
                  invalid.append({'key':key,'reason':'entry_not_object'})
                  misses.append({'key':key,'reason':'entry_invalid','current_kzt':current})
                  continue

              if schema==1 or ('historical_min_kzt' in entry and 'status' not in entry):
                  value=entry.get('historical_min_kzt')
                  try:
                      value=float(value)
                  except Exception:
                      misses.append({'key':key,'reason':'entry_invalid','current_kzt':current})
                      invalid.append({'key':key,'reason':'invalid_historical_min'})
                      continue
                  if value==0:
                      free.append({'key':key,'status':'previously_free','checked_at_utc':entry.get('checked_at_utc')})
                  elif value>0:
                      if current < value:
                          misses.append({'key':key,'reason':'current_price_below_cached_min','current_kzt':current,'cached_min_kzt':value})
                      else:
                          confirmed.append({'key':key,'status':'confirmed_min','historical_min_kzt':value,'current_kzt':current,'checked_at_utc':entry.get('checked_at_utc')})
                  else:
                      misses.append({'key':key,'reason':'entry_invalid','current_kzt':current})
                      invalid.append({'key':key,'reason':'negative_historical_min'})
                  continue

              status=entry.get('status')
              if status=='confirmed_min':
                  value=entry.get('historical_min_kzt')
                  try: value=float(value)
                  except Exception: value=None
                  if value is None or value<=0:
                      misses.append({'key':key,'reason':'entry_invalid','current_kzt':current}); invalid.append({'key':key,'reason':'invalid_confirmed_min'}); continue
                  if current<value:
                      misses.append({'key':key,'reason':'current_price_below_cached_min','current_kzt':current,'cached_min_kzt':value})
                  else:
                      confirmed.append({'key':key,'status':'confirmed_min','historical_min_kzt':value,'current_kzt':current,'checked_at_utc':entry.get('checked_at_utc')})
              elif status=='previously_free':
                  free.append({'key':key,'status':'previously_free','checked_at_utc':entry.get('checked_at_utc')})
              elif status=='unavailable_exact_history':
                  checked=parse_dt(entry.get('checked_at_utc'))
                  if checked is not None and now < checked + timedelta(days=ttl_days):
                      negative.append({'key':key,'status':'unavailable_exact_history','checked_at_utc':entry.get('checked_at_utc'),'expires_at_utc':(checked+timedelta(days=ttl_days)).isoformat()})
                  else:
                      misses.append({'key':key,'reason':'negative_ttl_expired','current_kzt':current,'checked_at_utc':entry.get('checked_at_utc')})
              else:
                  misses.append({'key':key,'reason':'entry_invalid','current_kzt':current,'status':status}); invalid.append({'key':key,'reason':'unknown_status','status':status})

          total=len(confirmed)+len(free)+len(negative)+len(misses)
          complete=(total==len(primary_keys) and len({x['key'] for x in confirmed+free+negative+misses})==len(primary_keys))
          result={
              'schema_version':1,
              'purpose':'steamdb_cache_mechanical_classification',
              'status':'complete' if complete else 'invalid',
              'bindings':{
                  'policy_blob_sha':sha('config/mailing_policy.json'),
                  'classification_contract_blob_sha':sha('config/steamdb_cache_classification_contract.json'),
                  'steamdb_cache_blob_sha':sha('data/cache/steamdb_history.json'),
                  'store_state_validation_blob_sha':sha('data/cache/store_state.validation.json'),
                  'offer_family_blob_sha':sha('data/cache/offer_family.validation.json'),
              },
              'cache_schema_version':schema,
              'metadata_entry_count':hist.get('entry_count'),
              'actual_entry_count':actual_entry_count,
              'primary_count':len(primary_keys),
              'confirmed_min_hit_count':len(confirmed),
              'previously_free_hit_count':len(free),
              'negative_cache_hit_count':len(negative),
              'true_lookup_miss_count':len(misses),
              'invalid_cache_entry_count':len(invalid),
              'classified_count':total,
              'steamdb_lookup_count':0,
              'complete_coverage':complete,
              'confirmed_min_hits':confirmed,
              'previously_free_hits':free,
              'negative_cache_hits':negative,
              'true_lookup_misses':misses,
              'invalid_entries':invalid,
          }
          OUT.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:result[k] for k in ['status','actual_entry_count','primary_count','confirmed_min_hit_count','previously_free_hit_count','negative_cache_hit_count','true_lookup_miss_count','steamdb_lookup_count']},ensure_ascii=False,indent=2))
          PY

      - name: Commit classification artifact
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/steamdb_cache.validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild SteamDB cache classification"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
