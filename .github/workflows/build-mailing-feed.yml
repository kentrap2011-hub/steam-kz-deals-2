name: Build mailing-optimized feed

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Steam KZ production shortlist"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "data/production/manifest.json"
      - "data/production/shortlist/**"
      - ".github/workflows/build-mailing-feed.yml"

permissions:
  contents: write

concurrency:
  group: steam-kz-mailing-feed
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build compact mailing chunks, integrity attestation and Store state cache
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          ROOT = Path("data/production")
          SOURCE_INDEX = ROOT / "shortlist/index.json"
          SOURCE_MANIFEST = ROOT / "manifest.json"
          OUT = ROOT / "mailing"
          CACHE_DIR = Path("data/cache")
          STORE_CACHE = CACHE_DIR / "store_state.json"
          CHUNK_SIZE = 150

          def git_blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()

          def descriptor(path: Path, data: bytes, row_count=None):
              result = {
                  "path": path.as_posix(),
                  "git_blob_sha": git_blob_sha(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
              }
              if row_count is not None:
                  result["row_count"] = int(row_count)
              return result

          source_index_bytes = SOURCE_INDEX.read_bytes()
          source_manifest_bytes = SOURCE_MANIFEST.read_bytes()
          index = json.loads(source_index_bytes.decode("utf-8"))
          manifest = json.loads(source_manifest_bytes.decode("utf-8"))

          if index.get("format") != "tsv":
              raise SystemExit("Mailing compactor currently expects TSV source")

          expected_chunks = int(index["chunk_count"])
          expected_rows = int(index["item_count"])
          pattern = index["chunk_pattern"]
          columns = list(index["columns"])
          column_index = {name: i for i, name in enumerate(columns)}

          required = {"key", "appid", "discount_percent", "final_kzt", "title"}
          missing = required - set(columns)
          if missing:
              raise SystemExit(f"Missing required columns: {sorted(missing)}")

          rows = []
          source_files = []
          source_chunk_descriptors = []

          for number in range(1, expected_chunks + 1):
              rel = pattern.replace("NNN", f"{number:03d}")
              path = Path(rel)
              if not path.exists():
                  raise SystemExit(f"Missing source chunk: {rel}")
              data = path.read_bytes()
              text = data.decode("utf-8")
              chunk_rows = [line for line in text.splitlines() if line.strip()]
              rows.extend(chunk_rows)
              source_files.append(rel)
              source_chunk_descriptors.append(descriptor(path, data, len(chunk_rows)))

          if len(rows) != expected_rows:
              raise SystemExit(
                  f"Source row mismatch: actual={len(rows)} expected={expected_rows}"
              )

          parsed_rows = []
          for row in rows:
              cells = row.split("\t")
              if len(cells) != len(columns):
                  raise SystemExit(
                      f"Column mismatch: got={len(cells)} expected={len(columns)} row={row[:120]!r}"
                  )
              parsed_rows.append(cells)

          drop = {"review_positive", "review_count"}
          keep_indices = [i for i, name in enumerate(columns) if name not in drop]
          out_columns = [columns[i] for i in keep_indices]
          compact_rows = [
              "\t".join(cells[i] for i in keep_indices)
              for cells in parsed_rows
          ]

          if len(compact_rows) != expected_rows:
              raise SystemExit(
                  f"Mailing projection row mismatch: actual={len(compact_rows)} expected={expected_rows}"
              )

          if OUT.exists():
              shutil.rmtree(OUT)
          OUT.mkdir(parents=True, exist_ok=True)
          CACHE_DIR.mkdir(parents=True, exist_ok=True)

          chunk_count = 0
          mailing_chunk_descriptors = []
          for start in range(0, len(compact_rows), CHUNK_SIZE):
              chunk_count += 1
              subset = compact_rows[start:start + CHUNK_SIZE]
              path = OUT / f"chunk_{chunk_count:03d}.tsv"
              data = ("\n".join(subset) + "\n").encode("utf-8")
              path.write_bytes(data)
              mailing_chunk_descriptors.append(descriptor(path, data, len(subset)))

          mailing_rows_verified = sum(d["row_count"] for d in mailing_chunk_descriptors)
          if mailing_rows_verified != expected_rows:
              raise SystemExit(
                  f"Mailing descriptor row mismatch: actual={mailing_rows_verified} expected={expected_rows}"
              )

          source_rows_verified = sum(d["row_count"] for d in source_chunk_descriptors)
          if source_rows_verified != expected_rows:
              raise SystemExit(
                  f"Source descriptor row mismatch: actual={source_rows_verified} expected={expected_rows}"
              )

          source_updated_at = index.get("source_updated_at_utc")

          integrity_core = {
              "version": 1,
              "proof_method": "content_addressed_producer_attestation",
              "producer_workflow": ".github/workflows/build-mailing-feed.yml",
              "source_manifest": descriptor(SOURCE_MANIFEST, source_manifest_bytes),
              "source_index": descriptor(SOURCE_INDEX, source_index_bytes),
              "source_chunks": source_chunk_descriptors,
              "mailing_chunks": mailing_chunk_descriptors,
              "source_chunk_count_verified": len(source_chunk_descriptors),
              "mailing_chunk_count_verified": len(mailing_chunk_descriptors),
              "source_rows_verified": source_rows_verified,
              "mailing_rows_verified": mailing_rows_verified,
              "source_to_mailing_row_projection_lossless": len(compact_rows) == len(parsed_rows) == expected_rows,
              "all_source_rows_column_validated": True,
          }
          integrity_bytes = json.dumps(
              integrity_core,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          integrity_core["attestation_digest_sha256"] = hashlib.sha256(integrity_bytes).hexdigest()

          mailing_index = {
              "version": 2,
              "purpose": "chatgpt_mailing_optimized_view",
              "format": "tsv",
              "has_header": False,
              "columns": out_columns,
              "country_code": index.get("country_code"),
              "item_count": len(compact_rows),
              "chunk_size": CHUNK_SIZE,
              "chunk_count": chunk_count,
              "chunk_pattern": "data/production/mailing/chunk_NNN.tsv",
              "source_index_path": "data/production/shortlist/index.json",
              "source_index_version": index.get("version"),
              "source_chunk_count": expected_chunks,
              "source_item_count": expected_rows,
              "source_complete": index.get("source_complete"),
              "source_coverage_ratio": index.get("source_coverage_ratio"),
              "source_updated_at_utc": source_updated_at,
              "needs_tuning": index.get("needs_tuning"),
              "manifest_complete": manifest.get("complete"),
              "manifest_coverage_ratio": manifest.get("coverage_ratio"),
              "manifest_updated_at_utc": manifest.get("updated_at_utc"),
              "manifest_needs_tuning": manifest.get("needs_tuning"),
              "source_files_verified": source_files,
              "integrity_attestation": integrity_core,
          }

          (OUT / "index.json").write_text(
              json.dumps(mailing_index, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          store_entries = {}
          for cells in parsed_rows:
              key = cells[column_index["key"]]
              appid = cells[column_index["appid"]]
              discount_text = cells[column_index["discount_percent"]]
              price_text = cells[column_index["final_kzt"]]
              title = cells[column_index["title"]]

              try:
                  discount = int(float(discount_text))
              except Exception:
                  discount = None

              try:
                  final_kzt = float(price_text)
              except Exception:
                  final_kzt = None

              store_entries[key] = {
                  "key": key,
                  "appid": appid or None,
                  "steam_type": "sub" if key.startswith("Sub_") else "app",
                  "steam_id": key.split("_", 1)[1] if "_" in key else None,
                  "title": title,
                  "discount_percent": discount,
                  "final_kzt": final_kzt,
                  "active_discount": bool(discount and discount > 0 and final_kzt and final_kzt > 0),
              }

          store_cache = {
              "schema_version": 1,
              "purpose": "reusable_current_store_state_for_mailing",
              "source": "validated Steam Store Kazakhstan production snapshot",
              "country_code": "kz",
              "source_updated_at_utc": source_updated_at,
              "source_item_count": expected_rows,
              "entry_count": len(store_entries),
              "source_complete": index.get("source_complete"),
              "source_coverage_ratio": index.get("source_coverage_ratio"),
              "source_needs_tuning": index.get("needs_tuning"),
              "discovery_source": False,
              "entries": store_entries,
          }

          STORE_CACHE.write_text(
              json.dumps(store_cache, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          print(
              f"Mailing feed: {len(compact_rows)} rows, "
              f"{expected_chunks} source chunks -> {chunk_count} mailing chunks; "
              f"content-addressed attestation ready; Store cache={len(store_entries)} entries"
          )
          PY

      - name: Commit mailing feed and Store cache
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add -A data/production/mailing/ data/cache/store_state.json
          if git diff --cached --quiet; then
            echo "No mailing feed/cache changes"
            exit 0
          fi
          git commit -m "Rebuild mailing feed and Store state cache"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main:refs/remotes/origin/main

            if ! git rebase origin/main; then
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Mailing feed/cache pushed successfully."
              exit 0
            fi

            echo "main changed again before push; retrying..."
            sleep $((attempt * 3))
          done

          echo "Push failed after 3 attempts."
          exit 1
