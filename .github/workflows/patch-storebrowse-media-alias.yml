name: Patch StoreBrowse media alias

on:
  push:
    paths:
      - ".github/workflows/patch-storebrowse-media-alias.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and live-test media patch
        run: python scripts/patch_storebrowse_media_alias_once.py

      - name: Validate Python syntax
        run: python -m py_compile scripts/build_visual_feed_v2.py scripts/build_final_visual_payload.py

      - name: Commit fix and remove temporary patch files
        shell: bash
        run: |
          git config user.name 'steam-kz-bot'
          git config user.email 'steam-kz-bot@users.noreply.github.com'
          git rm .github/workflows/patch-storebrowse-media-alias.yml scripts/patch_storebrowse_media_alias_once.py
          git add scripts/build_visual_feed_v2.py scripts/build_final_visual_payload.py BACKLOG.md
          git commit -m 'Fix StoreBrowse media aliases and track coverage'
          git pull --rebase origin main
          git push origin HEAD:main
