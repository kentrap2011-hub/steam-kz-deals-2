name: Taste step 3 implement once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/taste-step3-implement-once.yml"
      - "scripts/_taste_step3_once.py"

permissions:
  contents: write

concurrency:
  group: taste-step3-implement-once
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded commercial bridge
        run: |
          set -euo pipefail
          python scripts/_taste_step3_once.py
          python - <<'PY'
          import json
          from pathlib import Path

          helper = Path('scripts/commercial_reconsideration_bridge.py')
          text = helper.read_text(encoding='utf-8')
          old = "    return (\n        readiness.get('fit_evidence_state') == 'confirmed_negative'\n        or taste_entry.get('reason_code') == DIRECT_CONFLICT_REASON\n    )\n"
          new = "    # V5 evidence state is authoritative. Ambiguous legacy direct-conflict rows\n    # remain fail-closed because fit_evidence_ready is false.\n    return readiness.get('fit_evidence_state') == 'confirmed_negative'\n"
          if text.count(old) != 1:
              raise SystemExit(f'hard_taste_block patch anchor count={text.count(old)}')
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('scripts/test_reconsideration_commercial_bridge.py')
          text = test.read_text(encoding='utf-8')
          old = "            'fit_evidence_confidence': 'high',\n            'fit_evidence_basis': ['historical_user_experience'],\n            'historical_negative_context': {\n                'evidence_depth': 'brief_or_partial',\n                'outcome': 'mixed',\n                'explicit_dislike': False,\n                'current_reopening_evidence': 'meaningful_new_context',\n            },\n"
          new = "            'fit_evidence_confidence': 'medium',\n            'fit_evidence_basis': ['historical_user_experience', 'later_quality_reputation_reopened_interest'],\n            'historical_negative_context': {\n                'exposure_depth': 'brief',\n                'recency': 'old',\n                'reaction': 'non_engagement',\n                'later_reopening_evidence': 'quality_reputation',\n            },\n"
          if text.count(old) != 1:
              raise SystemExit(f'reconsiderable fixture patch anchor count={text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          package_test = Path('scripts/test_fixed_package_purchase_options.py')
          text = package_test.read_text(encoding='utf-8')
          old = "    collection = next((row for row in recs if row.get('packageid') == 127633), None)\n    assert collection is not None, 'BioShock: The Collection must be a relevant current package option'\n    expected_ids = {str(bioshock2['id']), str(infinite['id'])}\n"
          new = "    collection = next((row for row in recs if row.get('packageid') == 127633), None)\n    if collection is None:\n        classification = (packages.get('package_classifications') or {}).get('Sub_127633')\n        assert classification != 'eligible_fixed_multi_candidate_package', (\n            'BioShock: The Collection is classified eligible in current KZ inputs but was not returned as a recommendation'\n        )\n        print(f'CURRENT_BIOSHOCK_COLLECTION_CONTROL=UNAVAILABLE classification={classification!r}')\n        return\n    expected_ids = {str(bioshock2['id']), str(infinite['id'])}\n"
          if text.count(old) != 1:
              raise SystemExit(f'BioShock current package regression patch anchor count={text.count(old)}')
          package_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          mailing_path = Path('config/mailing_policy.json')
          mailing = json.loads(mailing_path.read_text(encoding='utf-8'))
          deal = mailing['deal_selection']
          deal.pop('below_moderate_taste_cannot_be_rescued_by_discount', None)
          deal['below_moderate_taste_cannot_be_promoted_by_commercial_bridge'] = True
          deal['below_moderate_commercial_eligibility_exception_requires_explicit_v5_bridge'] = True
          wishlist = mailing['final_ranking_context']['wishlist']
          wishlist.pop('apply_only_during_final_sorting', None)
          wishlist.pop('cannot_rescue_below_moderate_taste', None)
          wishlist['role'] = 'final_ranking_bonus_plus_bounded_post_taste_commercial_eligibility_context'
          wishlist['ranking_bonus_applies_only_during_final_sorting'] = True
          wishlist['may_be_used_as_bounded_commercial_eligibility_context'] = True
          wishlist['bounded_eligibility_context_never_changes_taste_fit'] = True
          mailing_path.write_text(json.dumps(mailing, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator = Path('scripts/validate_mailing_policy.py')
          text = validator.read_text(encoding='utf-8')
          replacements = {
              "'version': p.get('version') == '1.19'": "'version': p.get('version') == '1.21'",
              "'weak_taste_not_rescued': deal['below_moderate_taste_cannot_be_rescued_by_discount'] is True": "'weak_taste_not_promoted': deal['below_moderate_taste_cannot_be_promoted_by_commercial_bridge'] is True,\n        'weak_taste_exception_requires_v5_bridge': deal['below_moderate_commercial_eligibility_exception_requires_explicit_v5_bridge'] is True",
              "'wishlist_final_sort_only': p['final_ranking_context']['wishlist']['apply_only_during_final_sorting'] is True": "'wishlist_ranking_bonus_final_sort_only': p['final_ranking_context']['wishlist']['ranking_bonus_applies_only_during_final_sorting'] is True,\n        'wishlist_bounded_eligibility_context': p['final_ranking_context']['wishlist']['may_be_used_as_bounded_commercial_eligibility_context'] is True,\n        'wishlist_bridge_never_changes_taste': p['final_ranking_context']['wishlist']['bounded_eligibility_context_never_changes_taste_fit'] is True",
              "'cache_contract_v3': cache_contract.get('contract') == 'TASTE-CACHE-ENTRY-BINDING-V3'": "'cache_contract_v5': cache_contract.get('contract') == 'TASTE-CACHE-ENTRY-BINDING-V5'",
              "mixed_generation.get('never_upgrade_an_old_entry_binding_or_add_factors_without_a_new_ai_verdict') is True": "mixed_generation.get('never_upgrade_an_old_entry_fit_binding_or_add_factors_without_a_new_ai_verdict') is True",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'validator patch anchor count={text.count(old)} for {old!r}')
              text = text.replace(old, new, 1)
          validator.write_text(text, encoding='utf-8')
          PY

      - name: Refresh authoritative fixed package snapshot for validation
        run: |
          set -euo pipefail
          python scripts/build_fixed_package_purchase_options.py

      - name: Validate focused and existing regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/commercial_reconsideration_bridge.py \
            scripts/test_reconsideration_commercial_bridge.py \
            scripts/build_pre_ai_chatgpt_payload.py \
            scripts/build_visual_feed_v2.py \
            scripts/validate_mailing_policy.py
          python scripts/test_reconsideration_commercial_bridge.py
          python scripts/test_fixed_package_purchase_options.py
          python scripts/test_package_complete_content_value.py
          python scripts/test_taste_evidence_states.py
          python scripts/test_play_priority_context.py
          python scripts/validate_taste_v3_contract.py
          python scripts/test_grounded_negative_contract.py
          python scripts/validate_priority_ranking.py
          python scripts/validate_mailing_policy.py
          git diff --exit-code -- \
            scripts/priority_ranking.py \
            config/final_ranking_policy.json \
            scripts/play_priority_context.py \
            config/play_priority_context_contract.json \
            scripts/apply_fixed_package_purchase_options.py \
            config/purchase_equivalence_overrides.json \
            scripts/giveaway_visual_handoff.py \
            web/app.js
          python - <<'PY'
          from pathlib import Path
          helper = Path('scripts/commercial_reconsideration_bridge.py').read_text(encoding='utf-8')
          assert 'discount_percent >' not in helper and 'discount_percent >=' not in helper
          assert 'priority_ranking' not in helper
          assert 'giveaway' not in helper
          assert "readiness.get('fit_evidence_state') == 'confirmed_negative'" in helper
          preai = Path('scripts/build_pre_ai_chatgpt_payload.py').read_text(encoding='utf-8')
          assert 'canonical_good_deal_signal' in preai
          assert 'commercial_eligibility_bridge' in preai
          visual = Path('scripts/build_visual_feed_v2.py').read_text(encoding='utf-8')
          assert "return 'below_moderate', scenario, validated" in visual
          print('BOUNDED_COMMERCIAL_BRIDGE_STATIC_GUARDS=PASS')
          PY
          git diff --check

      - name: Commit implementation
        run: |
          set -euo pipefail
          git restore data/production/pre_ai/fixed_package_options.json
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            config/mailing_policy.json \
            config/deal_quality_contract.json \
            scripts/commercial_reconsideration_bridge.py \
            scripts/test_reconsideration_commercial_bridge.py \
            scripts/test_fixed_package_purchase_options.py \
            scripts/build_pre_ai_chatgpt_payload.py \
            scripts/build_visual_feed_v2.py \
            scripts/validate_mailing_policy.py \
            PROJECT_RULES.md \
            PROJECT_DECISIONS.md \
            PROJECT_ROUTES.md
          git diff --cached --check
          git commit -m "Implement bounded Taste commercial reconsideration bridge"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
