name: Validate buffered Steam review dossier runtime

on:
  pull_request:
    paths:
      - "config/taste_steam_review_dossier_contract.json"
      - "config/taste_steam_review_dossier_schema.json"
      - "config/taste_steam_review_dossier_web_evidence_contract.json"
      - "config/taste_steam_review_dossier_parallel_validation_contract.json"
      - "config/taste_steam_review_dossier_recovery_contract.json"
      - "config/taste_steam_review_dossier_persistence_bridge.json"
      - "config/taste_steam_review_dossier_worker_prompt.md"
      - "config/taste_steam_review_dossier_runtime_prompt.md"
      - "scripts/taste_steam_review_dossier.py"
      - "scripts/taste_steam_review_dossier_strict.py"
      - "scripts/taste_steam_review_dossier_web.py"
      - "scripts/taste_steam_review_dossier_daily.py"
      - "scripts/taste_steam_review_dossier_compact_provenance.py"
      - "scripts/taste_steam_review_dossier_prepublication.py"
      - "scripts/taste_steam_review_dossier_buffered.py"
      - "scripts/taste_steam_review_dossier_group_progress.py"
      - "scripts/taste_steam_review_dossier_parallel_validation.py"
      - "scripts/taste_steam_review_dossier_recovery.py"
      - "scripts/taste_steam_review_dossier_worker_projection.py"
      - "scripts/taste_steam_review_dossier_test_fixture.py"
      - "scripts/taste_package_member_aggregation.py"
      - "scripts/build_pre_ai_chatgpt_payload.py"
      - "scripts/build_taste_steam_review_dossier_work.py"
      - "scripts/ingest_taste_steam_review_dossiers.py"
      - "scripts/ingest_taste_steam_review_dossier_inbox.py"
      - "scripts/build_taste_semantic_dossier_input.py"
      - "scripts/taste_steam_review_dossier_cleanup.py"
      - "scripts/test_taste_steam_review_dossier_daily_snapshot.py"
      - "scripts/test_taste_steam_review_dossier_buffered_submission.py"
      - "scripts/test_taste_steam_review_dossier_same_day_preservation.py"
      - "scripts/test_taste_steam_review_dossier_strict_recovery.py"
      - "scripts/test_taste_steam_review_dossier_prepublication.py"
      - "scripts/test_taste_steam_review_dossier_contract_gaps.py"
      - "scripts/test_taste_steam_review_dossier_parallel_validation.py"
      - "scripts/test_taste_steam_review_dossier_language_binding.py"
      - "scripts/test_taste_steam_review_dossier_semantic_consistency.py"
      - "scripts/test_taste_dossier_transient_author_fallback.py"
      - "scripts/test_taste_dossier_steam_store_review_card_parent.py"
      - "scripts/test_taste_dossier_contract_contradictions_fix.py"
      - "scripts/test_taste_dossier_identity_provenance_generation_fix.py"
      - "scripts/test_taste_dossier_validator_generator_parity_fix.py"
      - "scripts/test_taste_dossier_package_identity_fix.py"
      - "scripts/test_taste_story_dlc_scope.py"
      - ".github/workflows/ingest-taste-steam-review-dossier-checkpoint.yml"
      - ".github/workflows/build-pre-ai-store-snapshot.yml"
      - ".github/workflows/validate-taste-dossier-buffered.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Taste dossier runtime and focused regressions
        run: |
          set -euo pipefail
          python -m py_compile scripts/taste_package_member_aggregation.py scripts/build_pre_ai_chatgpt_payload.py scripts/taste_steam_review_dossier_web.py scripts/taste_steam_review_dossier_strict.py scripts/taste_steam_review_dossier_worker_projection.py scripts/taste_steam_review_dossier_compact_provenance.py scripts/taste_steam_review_dossier_prepublication.py scripts/taste_steam_review_dossier_group_progress.py scripts/taste_steam_review_dossier_parallel_validation.py scripts/test_taste_steam_review_dossier_contract_gaps.py scripts/test_taste_steam_review_dossier_parallel_validation.py scripts/test_taste_steam_review_dossier_language_binding.py scripts/test_taste_steam_review_dossier_semantic_consistency.py scripts/test_taste_dossier_transient_author_fallback.py scripts/test_taste_dossier_steam_store_review_card_parent.py scripts/test_taste_dossier_contract_contradictions_fix.py scripts/test_taste_dossier_identity_provenance_generation_fix.py scripts/test_taste_dossier_validator_generator_parity_fix.py
      - name: Validate execution ownership boundaries
        run: python scripts/validate_execution_ownership.py
      - name: Daily snapshot regression
        run: python scripts/test_taste_steam_review_dossier_daily_snapshot.py
      - name: Buffered submission regression
        run: python scripts/test_taste_steam_review_dossier_buffered_submission.py
      - name: Same-day preservation regression
        run: python scripts/test_taste_steam_review_dossier_same_day_preservation.py
      - name: Strict recovery regression
        run: python scripts/test_taste_steam_review_dossier_strict_recovery.py
      - name: Prepublication parity regression
        run: python scripts/test_taste_steam_review_dossier_prepublication.py
      - name: Contract-gap regression
        run: python scripts/test_taste_steam_review_dossier_contract_gaps.py
      - name: Language binding regression
        run: python scripts/test_taste_steam_review_dossier_language_binding.py
      - name: Semantic consistency regression
        run: python scripts/test_taste_steam_review_dossier_semantic_consistency.py
      - name: Transient author fallback regression
        run: python scripts/test_taste_dossier_transient_author_fallback.py
      - name: Steam Store review-card parent regression
        run: python scripts/test_taste_dossier_steam_store_review_card_parent.py
      - name: Contract contradiction closeout regression
        run: python scripts/test_taste_dossier_contract_contradictions_fix.py
      - name: Identity provenance generation regression
        run: python scripts/test_taste_dossier_identity_provenance_generation_fix.py
      - name: Validator-generator parity regression
        run: python scripts/test_taste_dossier_validator_generator_parity_fix.py
      - name: Package identity regression
        run: python scripts/test_taste_dossier_package_identity_fix.py
      - name: Story DLC semantic scope regression
        run: python scripts/test_taste_story_dlc_scope.py
      - name: Parallel candidate validation and nonblocking per-group regression
        run: python scripts/test_taste_steam_review_dossier_parallel_validation.py
