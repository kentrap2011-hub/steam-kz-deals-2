name: Migrate mailing policy 1.15
# trigger canonical budget migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-mailing-policy-115.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch canonical policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pth=Path('config/mailing_policy.json')
          p=json.loads(pth.read_text(encoding='utf-8'))
          p['version']='1.15'
          pricing=p['pricing']
          pricing['target_rub']=500
          pricing['target_is_hard_cap']=False
          pricing['small_overage_allowed_if_good_value']=True
          pricing['symbolic_discount_max_percent_inclusive']=5
          pricing['symbolic_discount_is_early_exclusion']=True
          pricing['no_absolute_price_exclusion_for_moderate_or_strong_taste']=False
          pricing['absolute_max_rub']=750
          pricing['strong_fit_standard_overage_ceiling_rub']=650
          pricing['moderate_fit_absolute_ceiling_rub']=550
          pricing['exceptional_discount_min_percent_for_high_overage']=75
          pricing['high_overage_requires_strong_taste']=True
          pricing['price_above_absolute_max_is_excluded_regardless_of_discount']=True
          pricing['expensive_game_may_remain_if_taste_fit_and_discount_are_meaningful']=False
          pricing['weak_but_non_symbolic_deal_remains_available_for_wait_or_low_priority']='only_while_within_fit_scaled_budget_ceiling'
          sep=p['taste_deal_separation']
          sep['symbolic_discount_only_early_commercial_exclusion']=False
          sep['budget_ceiling_is_also_early_commercial_exclusion']=True
          sep['minimum_taste_fit_cannot_be_rescued_by_discount']=True
          sep['discount_never_overrides_absolute_budget_ceiling']=True
          p['sorting']['taste_is_primary']=True
          p['sorting']['conceptual_weight_taste']=0.6
          p['sorting']['conceptual_weight_deal']=0.4
          p['sorting']['absolute_budget_ceiling_applied_before_ranking']=True
          pth.write_text(json.dumps(p, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          python - <<'PY'
          import json
          p=json.load(open('config/mailing_policy.json',encoding='utf-8'))
          assert p['version']=='1.15'
          assert p['pricing']['target_rub']==500
          assert p['pricing']['absolute_max_rub']==750
          assert p['pricing']['exceptional_discount_min_percent_for_high_overage']==75
          assert p['pricing']['price_above_absolute_max_is_excluded_regardless_of_discount'] is True
          print('MAILING_POLICY_115=PASS')
          PY
      - name: Commit
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add config/mailing_policy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore 750 RUB absolute budget ceiling"
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          git push origin HEAD:main
