name: Site giveaway freshness recovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-giveaway-freshness-recovery-once.yml"

permissions:
  contents: write

concurrency:
  group: site-giveaway-freshness-recovery-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded recovery fixes
        run: python scripts/site_giveaway_freshness_recovery_once.py

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/steam_traversal_recovery.py \
            scripts/test_steam_traversal_recovery.py \
            scripts/steam_production.py \
            scripts/visual_freshness_receipt.py \
            scripts/test_visual_freshness_receipt.py
          python scripts/test_steam_traversal_recovery.py
          python scripts/test_visual_freshness_receipt.py
          python scripts/test_giveaway_production.py
          python scripts/test_giveaway_visual_handoff.py

      - name: Commit permanent repair and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/site-giveaway-freshness-recovery-once.yml \
            scripts/site_giveaway_freshness_recovery_once.py
          git add \
            scripts/steam_traversal_recovery.py \
            scripts/test_steam_traversal_recovery.py \
            scripts/steam_production.py \
            scripts/visual_freshness_receipt.py \
            scripts/test_visual_freshness_receipt.py \
            .github/workflows/build-daily-visual-payload.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'repair produced no changes'; exit 1; }
          git commit -m "fix: recover giveaway source and freshness classification"
          git push origin HEAD:main
