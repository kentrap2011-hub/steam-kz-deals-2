name: One-shot StoreBrowse taste-field diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-storebrowse-taste-fields.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect same-pass StoreBrowse fields
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          ids = [
              {'appid': 241930},
              {'appid': 1042490},
              {'appid': 1016770},
          ]
          payload = {
              'ids': ids,
              'context': {'language':'english','country_code':'KZ','steam_realm':1},
              'data_request': {
                  'include_all_purchase_options': True,
                  'include_basic_info': True,
                  'include_included_items': True,
              },
          }
          url='https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json=' + urllib.parse.quote(json.dumps(payload,separators=(',',':')))
          req=urllib.request.Request(url,headers={'User-Agent':'steam-kz-deals/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r:
              data=json.loads(r.read().decode('utf-8'))
          items=(data.get('response') or {}).get('store_items') or []
          print('item_count',len(items))
          for item in items:
              print(json.dumps({
                  'id': item.get('id'),
                  'appid': item.get('appid'),
                  'name': item.get('name'),
                  'top_level_keys': sorted(item.keys()),
                  'basic_info': item.get('basic_info'),
              },ensure_ascii=False,indent=2))
          PY
