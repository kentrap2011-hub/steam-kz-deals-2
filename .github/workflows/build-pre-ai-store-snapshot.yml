name: Build pre-AI deterministic payload
# production trigger: first validated taste overlay entry

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build mailing-optimized feed"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "config/content_eligibility_contract.json"
      - "config/offer_family_contract.json"
      - "config/deal_quality_contract.json"
      - "config/mailing_policy.json"
      - "config/taste_fingerprint_contract.json"
      - "config/taste_cache_entry_contract.json"
      - "config/taste_ledger_contract.json"
      - "data/cache/steamdb_history.json"
      - "data/cache/taste_fit.json"
      - "data/cache/taste_fit.entry_overlay.json"
      - "data/cache/taste_fit.entry_index.json"
      - "data/cache/taste_fit.index.json"
      - "data/cache/taste_fit.validation.json"
      - "data/cache/taste_fit.ledger_validation.json"
      - "scripts/taste_cache_common.py"
      - "scripts/build_taste_cache_index.py"
      - "scripts/ingest_taste_results.py"
      - "scripts/build_pre_ai_store_snapshot.py"
      - "scripts/build_pre_ai_fx_snapshot.py"
      - "scripts/build_pre_ai_content_rules.py"
      - "scripts/build_pre_ai_family_graph.py"
      - "scripts/build_pre_ai_taste_projection.py"
      - "scripts/build_pre_ai_history_snapshot.py"
      - "scripts/build_pre_ai_deal_scenarios.py"
      - "scripts/build_pre_ai_chatgpt_payload.py"
      - ".github/workflows/build-pre-ai-store-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: pre-ai-deterministic-payload
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build per-entry taste cache index
        run: python scripts/build_taste_cache_index.py

      - name: Build current Store snapshot and content metadata
        run: python scripts/build_pre_ai_store_snapshot.py

      - name: Build deterministic FX snapshot
        run: python scripts/build_pre_ai_fx_snapshot.py

      - name: Build mechanical content rules
        run: python scripts/build_pre_ai_content_rules.py

      - name: Build purchase-family graph
        run: python scripts/build_pre_ai_family_graph.py

      - name: Build safe taste-cache projection
        run: python scripts/build_pre_ai_taste_projection.py

      - name: Build nonblocking history classification
        run: python scripts/build_pre_ai_history_snapshot.py

      - name: Build strong and moderate deal scenarios
        run: python scripts/build_pre_ai_deal_scenarios.py

      - name: Build split ChatGPT consumer bundle
        run: python scripts/build_pre_ai_chatgpt_payload.py

      - name: Commit atomic pre-AI payload
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            data/cache/taste_fit.entry_index.json \
            data/production/pre_ai/store_snapshot.json \
            data/production/pre_ai/content_metadata.json \
            data/production/pre_ai/fx_snapshot.json \
            data/production/pre_ai/content_rules.json \
            data/production/pre_ai/family_graph.json \
            data/production/pre_ai/taste_projection.json \
            data/production/pre_ai/history_snapshot.json \
            data/production/pre_ai/deal_scenarios.json \
            data/production/pre_ai/chatgpt_payload.json \
            data/production/pre_ai/chatgpt_taste_queue.jsonl \
            data/production/pre_ai/chatgpt_purchase_context.jsonl
          if git diff --cached --quiet; then
            echo "Pre-AI deterministic payload already current"
            exit 0
          fi
          git commit -m "Refresh atomic pre-AI payload"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
