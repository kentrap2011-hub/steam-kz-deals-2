name: Build pre-AI deterministic payload

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build mailing-optimized feed"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "config/content_eligibility_contract.json"
      - "config/offer_family_contract.json"
      - "scripts/build_pre_ai_store_snapshot.py"
      - "scripts/build_pre_ai_content_rules.py"
      - "scripts/build_pre_ai_family_graph.py"
      - ".github/workflows/build-pre-ai-store-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: pre-ai-deterministic-payload
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current Store snapshot and content metadata
        run: python scripts/build_pre_ai_store_snapshot.py

      - name: Build mechanical content rules
        run: python scripts/build_pre_ai_content_rules.py

      - name: Build purchase-family graph
        run: python scripts/build_pre_ai_family_graph.py

      - name: Commit atomic pre-AI payload
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            data/production/pre_ai/store_snapshot.json \
            data/production/pre_ai/content_metadata.json \
            data/production/pre_ai/content_rules.json \
            data/production/pre_ai/family_graph.json
          if git diff --cached --quiet; then
            echo "Pre-AI deterministic payload already current"
            exit 0
          fi
          git commit -m "Refresh atomic pre-AI payload"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
