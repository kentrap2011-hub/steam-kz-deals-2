name: One-shot pre-AI history coverage diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-pre-ai-history-coverage.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure current persistent-history coverage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          family = json.loads(Path('data/production/pre_ai/family_graph.json').read_text(encoding='utf-8'))
          store = json.loads(Path('data/production/pre_ai/store_snapshot.json').read_text(encoding='utf-8'))
          cache = json.loads(Path('data/cache/steamdb_history.json').read_text(encoding='utf-8'))

          families = family.get('families') or []
          store_entries = store.get('entries') or {}
          cache_entries = cache.get('entries') or {}
          primaries = [x['primary_key'] for x in families]
          if len(primaries) != len(set(primaries)):
              raise SystemExit('duplicate primary keys')

          overlap = [k for k in primaries if k in cache_entries]
          misses = [k for k in primaries if k not in cache_entries]
          statuses = Counter(cache_entries[k].get('status') for k in overlap)
          below = []
          equal = []
          above = []
          malformed = []
          for key in overlap:
              hist = cache_entries[key]
              status = hist.get('status')
              if status != 'confirmed_min':
                  continue
              try:
                  old_min = float(hist['historical_min_kzt'])
                  current = float(store_entries[key]['final_kzt'])
              except Exception:
                  malformed.append(key)
                  continue
              if old_min <= 0:
                  malformed.append(key)
              elif current < old_min - 1e-12:
                  below.append({'key': key, 'cached_min_kzt': old_min, 'current_kzt': current})
              elif abs(current - old_min) <= 1e-12:
                  equal.append(key)
              else:
                  above.append(key)

          result = {
              'family_primary_count': len(primaries),
              'persistent_cache_entry_count': len(cache_entries),
              'primary_cache_overlap_count': len(overlap),
              'primary_cache_miss_count': len(misses),
              'overlap_status_counts': dict(sorted(statuses.items())),
              'confirmed_current_below_cached_min_count': len(below),
              'confirmed_current_equal_cached_min_count': len(equal),
              'confirmed_current_above_cached_min_count': len(above),
              'malformed_confirmed_count': len(malformed),
              'current_below_cached_min_examples': below[:20],
              'miss_examples': misses[:20],
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
