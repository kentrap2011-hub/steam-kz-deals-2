name: Taste evidence state implement once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/taste-evidence-state-implement-once.yml"

permissions:
  contents: write

concurrency:
  group: taste-evidence-state-implement-once
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_taste_evidence_implement_once.py')
          text = path.read_text(encoding='utf-8')

          old = "new_annotator = '''def annotate_negative_readiness"
          new = "new_annotator = r'''def annotate_negative_readiness"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one new_annotator patch anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "cache_end = \"            continue\\n\\n        work = ['evaluate_taste_fit', 'evaluate_normalized_taste_factors', NEGATIVE_WORK_CODE]\\n\""
          new = "cache_end = \"        work = ['evaluate_taste_fit', 'evaluate_normalized_taste_factors', NEGATIVE_WORK_CODE]\\n\""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one cache_end patch anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "            continue\n\n        work = ['evaluate_taste_fit', 'evaluate_normalized_taste_factors', NEGATIVE_WORK_CODE]\n'''\nreplace_between('scripts/build_pre_ai_chatgpt_payload.py', cache_start, cache_end, cache_replacement)"
          new = "            continue\n\n'''\nreplace_between('scripts/build_pre_ai_chatgpt_payload.py', cache_start, cache_end, cache_replacement)"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one cache_replacement tail anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python scripts/_taste_evidence_implement_once.py

      - name: Validate contracts and controls
        run: |
          python -m py_compile \
            scripts/taste_evidence_contract.py \
            scripts/taste_negative_contract.py \
            scripts/taste_cache_common.py \
            scripts/ingest_taste_results.py \
            scripts/build_taste_cache_index.py \
            scripts/build_pre_ai_chatgpt_payload.py \
            scripts/refine_visual_ranking.py \
            scripts/build_final_visual_payload.py \
            scripts/build_ranking_lookup.py \
            scripts/validate_taste_v3_contract.py \
            scripts/test_taste_evidence_states.py
          python scripts/test_taste_evidence_states.py
          python scripts/validate_taste_v3_contract.py
          python scripts/test_grounded_negative_contract.py
          python scripts/test_card_explanation_policy.py
          python scripts/build_taste_cache_index.py
          git restore data/cache/taste_fit.entry_index.json
          python scripts/build_pre_ai_chatgpt_payload.py
          python scripts/_taste_evidence_validation_summary_once.py
          git restore \
            data/production/pre_ai/taste_projection.json \
            data/production/pre_ai/chatgpt_payload.json \
            data/production/pre_ai/chatgpt_taste_queue.jsonl \
            data/production/pre_ai/chatgpt_purchase_context.jsonl
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            config/mailing_policy.json \
            config/taste_result_contract.json \
            config/taste_cache_entry_contract.json \
            config/taste_ledger_contract.json \
            scripts/taste_evidence_contract.py \
            scripts/taste_negative_contract.py \
            scripts/taste_cache_common.py \
            scripts/ingest_taste_results.py \
            scripts/build_taste_cache_index.py \
            scripts/build_pre_ai_chatgpt_payload.py \
            scripts/refine_visual_ranking.py \
            scripts/build_final_visual_payload.py \
            scripts/build_ranking_lookup.py \
            scripts/validate_taste_v3_contract.py \
            scripts/test_taste_evidence_states.py \
            PROJECT_ROUTES.md \
            PROJECT_DECISIONS.md
          git diff --cached --check
          git commit -m "Implement Taste evidence state and reconsideration"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Write report and remove one-shot machinery
        run: |
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          python scripts/_taste_evidence_report_once.py
          git rm \
            .github/workflows/taste-evidence-state-implement-once.yml \
            scripts/_taste_evidence_implement_once.py \
            scripts/_taste_evidence_report_once.py \
            scripts/_taste_evidence_validation_summary_once.py
          git add CURRENT_TASK.md reviews/worker_reports/taste-evidence-state-and-confidence-implement-01.md
          git diff --cached --check
          git commit -m "Report Taste evidence state implementation"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "REPORT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
