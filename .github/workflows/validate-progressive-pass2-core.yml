name: Validate Progressive PASS 2 core

on:
  push:
    paths:
      - "config/execution_ownership_contract.json"
      - "config/progressive_personalization_contract.json"
      - "config/progressive_pass1_contract.json"
      - "config/progressive_pass2_contract.json"
      - "config/daily_execution_contract.json"
      - "config/progressive_pass2_result_schema.json"
      - "config/progressive_pass2_execution_receipt_schema.json"
      - "config/progressive_pass2_worker_prompt.md"
      - "scripts/progressive_pass2.py"
      - "scripts/build_progressive_pass2_work.py"
      - "scripts/ingest_progressive_pass1.py"
      - "scripts/ingest_progressive_pass2.py"
      - "scripts/authorize_progressive_pass2_recovery.py"
      - "scripts/progressive_personalization.py"
      - "scripts/progressive_visual_activation_routing.py"
      - "scripts/build_final_visual_payload.py"
      - "scripts/test_progressive_pass2.py"
      - "scripts/test_progressive_pass2_integration.py"
      - "scripts/test_progressive_pass1.py"
      - "scripts/test_progressive_pass1_ingest_activation.py"
      - "scripts/test_progressive_personalization.py"
      - "scripts/test_progressive_unresolved_row_preservation.py"
      - "scripts/test_progressive_visual_activation_routing.py"
      - "data/cache/progressive_pass2_state.json"
      - "data/production/pre_ai/progressive_pass2_work.json"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - "reviews/worker_reports/progressive-pass2-phase-c-core-implement-01.md"
      - ".github/workflows/build-daily-visual-payload.yml"
      - ".github/workflows/build-pre-ai-store-snapshot.yml"
      - ".github/workflows/ingest-progressive-pass1.yml"
      - ".github/workflows/ingest-progressive-pass2.yml"
      - ".github/workflows/authorize-progressive-pass2-recovery.yml"
      - ".github/workflows/ingest-taste-steam-review-dossier-checkpoint.yml"
      - ".github/workflows/validate-progressive-pass2-core.yml"

  pull_request:
    paths:
      - "config/execution_ownership_contract.json"
      - "config/progressive_personalization_contract.json"
      - "config/progressive_pass1_contract.json"
      - "config/progressive_pass2_contract.json"
      - "config/daily_execution_contract.json"
      - "config/progressive_pass2_result_schema.json"
      - "config/progressive_pass2_execution_receipt_schema.json"
      - "config/progressive_pass2_worker_prompt.md"
      - "scripts/progressive_pass2.py"
      - "scripts/build_progressive_pass2_work.py"
      - "scripts/ingest_progressive_pass1.py"
      - "scripts/ingest_progressive_pass2.py"
      - "scripts/authorize_progressive_pass2_recovery.py"
      - "scripts/progressive_personalization.py"
      - "scripts/progressive_visual_activation_routing.py"
      - "scripts/build_final_visual_payload.py"
      - "scripts/test_progressive_pass2.py"
      - "scripts/test_progressive_pass2_integration.py"
      - "scripts/test_progressive_pass1.py"
      - "scripts/test_progressive_pass1_ingest_activation.py"
      - "scripts/test_progressive_personalization.py"
      - "scripts/test_progressive_unresolved_row_preservation.py"
      - "scripts/test_progressive_visual_activation_routing.py"
      - "data/cache/progressive_pass2_state.json"
      - "data/production/pre_ai/progressive_pass2_work.json"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - "reviews/worker_reports/progressive-pass2-phase-c-core-implement-01.md"
      - ".github/workflows/build-daily-visual-payload.yml"
      - ".github/workflows/build-pre-ai-store-snapshot.yml"
      - ".github/workflows/ingest-progressive-pass1.yml"
      - ".github/workflows/ingest-progressive-pass2.yml"
      - ".github/workflows/authorize-progressive-pass2-recovery.yml"
      - ".github/workflows/ingest-taste-steam-review-dossier-checkpoint.yml"
      - ".github/workflows/validate-progressive-pass2-core.yml"
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile PASS 2 Python
        run: |
          python -m py_compile \
            scripts/progressive_pass2.py \
            scripts/build_progressive_pass2_work.py \
            scripts/ingest_progressive_pass1.py \
            scripts/ingest_progressive_pass2.py \
            scripts/authorize_progressive_pass2_recovery.py \
            scripts/test_progressive_pass2.py \
            scripts/test_progressive_pass2_integration.py \
            scripts/test_progressive_pass1_ingest_activation.py \
            scripts/progressive_personalization.py \
            scripts/progressive_visual_activation_routing.py
      - name: PASS 2 core regression
        run: python scripts/test_progressive_pass2.py
      - name: PASS 2 Dossier integration regression
        run: python scripts/test_progressive_pass2_integration.py
      - name: PASS 1 regression
        run: python scripts/test_progressive_pass1.py
      - name: PASS 1 ingest activation regression
        run: python scripts/test_progressive_pass1_ingest_activation.py
      - name: Progressive personalization regression
        run: python scripts/test_progressive_personalization.py
      - name: Current staged projection accounting
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import build_progressive_pass1_work
          import progressive_personalization
          fast=build_progressive_pass1_work.build_work_document()['scope']
          dossier=progressive_personalization._dossier_processing_metrics()
          assert int(fast['fast_total_current_scope']) == (
              int(fast['fast_attempted_count'])
              + int(fast['fast_skipped_due_to_authoritative_deep_count'])
              + int(fast['fast_remaining_count'])
          )
          if dossier['dossier_total_current_scope'] is not None:
              assert int(dossier['dossier_total_current_scope']) == (
                  int(dossier['dossier_accepted_count'])
                  + int(dossier['dossier_pending_count'])
                  + int(dossier['dossier_failed_or_recovery_count'])
              )
          print('PROGRESSIVE_FAST_CURRENT=' + json.dumps(fast, sort_keys=True))
          print('PROGRESSIVE_DOSSIER_CURRENT=' + json.dumps(dossier, sort_keys=True))
          PY

      - name: Unresolved-row preservation regression
        run: python scripts/test_progressive_unresolved_row_preservation.py
      - name: Visual activation routing regression
        run: python scripts/test_progressive_visual_activation_routing.py
      - name: UI provenance regression
        run: node web/progressive-personalization-ui.test.js
      - name: Recompute active production eligibility without consuming attempts
        shell: bash
        run: |
          set -euo pipefail
          cp data/cache/progressive_pass2_state.json /tmp/progressive-pass2-state-before.json
          python scripts/build_progressive_pass2_work.py | tee /tmp/progressive-pass2-work.log
          cmp /tmp/progressive-pass2-state-before.json data/cache/progressive_pass2_state.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import test_progressive_pass2 as core
          contract=json.loads(Path('config/progressive_pass2_contract.json').read_text(encoding='utf-8'))
          work=json.loads(Path('data/production/pre_ai/progressive_pass2_work.json').read_text(encoding='utf-8'))
          state=json.loads(Path('data/cache/progressive_pass2_state.json').read_text(encoding='utf-8'))
          assert contract.get('active') is True
          assert work.get('pass2_active') is True
          scope=work.get('scope') or {}
          core.assert_persisted_projection_invariants(state, scope, work.get('items') or [])
          print(
              'PROGRESSIVE_PASS2_ACTIVE_PROJECTION=PASS '
              + 'target=' + str(scope.get('deep_total_current_coverage_target'))
              + ' waiting=' + str(scope.get('deep_waiting_for_dossier_count'))
              + ' ready=' + str(scope.get('deep_ready_or_pending_count'))
              + ' attempts=' + str(scope.get('deep_first_pass_attempted_count'))
          )
          PY
