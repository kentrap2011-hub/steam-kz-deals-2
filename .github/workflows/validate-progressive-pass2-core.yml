name: Validate Progressive PASS 2 core

on:
  push:
    paths:
      - "config/progressive_personalization_contract.json"
      - "config/progressive_pass2_contract.json"
      - "config/progressive_pass2_result_schema.json"
      - "config/progressive_pass2_execution_receipt_schema.json"
      - "config/progressive_pass2_worker_prompt.md"
      - "scripts/progressive_pass2.py"
      - "scripts/build_progressive_pass2_work.py"
      - "scripts/ingest_progressive_pass2.py"
      - "scripts/progressive_personalization.py"
      - "scripts/progressive_visual_activation_routing.py"
      - "scripts/build_final_visual_payload.py"
      - "scripts/test_progressive_pass2.py"
      - "scripts/test_progressive_pass1.py"
      - "scripts/test_progressive_personalization.py"
      - "scripts/test_progressive_unresolved_row_preservation.py"
      - "scripts/test_progressive_visual_activation_routing.py"
      - "data/cache/progressive_pass2_state.json"
      - "data/production/pre_ai/progressive_pass2_work.json"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - ".github/workflows/ingest-progressive-pass2.yml"
      - ".github/workflows/validate-progressive-pass2-core.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile PASS 2 Python
        run: |
          python -m py_compile             scripts/progressive_pass2.py             scripts/build_progressive_pass2_work.py             scripts/ingest_progressive_pass2.py             scripts/progressive_personalization.py             scripts/progressive_visual_activation_routing.py
      - name: PASS 2 core regression
        run: python scripts/test_progressive_pass2.py
      - name: PASS 1 regression
        run: python scripts/test_progressive_pass1.py
      - name: Progressive personalization regression
        run: python scripts/test_progressive_personalization.py
      - name: Unresolved-row preservation regression
        run: python scripts/test_progressive_unresolved_row_preservation.py
      - name: Visual activation routing regression
        run: python scripts/test_progressive_visual_activation_routing.py
      - name: UI provenance regression
        run: node web/progressive-personalization-ui.test.js
