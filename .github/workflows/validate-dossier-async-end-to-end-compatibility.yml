name: Validate inactive Dossier async end-to-end compatibility

on:
  pull_request:
    paths:
      - "scripts/test_dossier_two_stage_end_to_end_compatibility.py"
      - ".github/workflows/validate-dossier-async-end-to-end-compatibility.yml"
      - "scripts/dossier_two_stage_research_worker.py"
      - "scripts/dossier_two_stage_assembly_semantic_worker.py"
      - "scripts/dossier_two_stage_async_buffer.py"

permissions:
  contents: read

jobs:
  offline-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read-only checkout of PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline schema validator
        run: python -m pip install "jsonschema>=4.21,<5"
      - name: Compile and run cross-helper Research to Assembly proof
        run: |
          python -m py_compile scripts/test_dossier_two_stage_end_to_end_compatibility.py
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_end_to_end_compatibility.py' -v
      - name: Regress existing independent Research and Assembly helpers
        run: |
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_research_worker.py' -v
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_assembly_semantic_worker.py' -v
      - name: Regress frozen GitHub buffer and staging contracts
        run: |
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_contract_schemas.py' -v
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_staging.py' -v
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_async_buffer.py' -v
      - name: Retain one-stage Dossier and downstream identity parity
        run: |
          python -m unittest discover -s scripts -p 'test_taste_dossier_github_date_derivation.py' -v
          python scripts/test_dossier_deep_release_year_identity_compatibility.py
          python scripts/validate_execution_ownership.py
