name: Taste step 3 final fix valid once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/taste-step3-final-fix-valid-once.yml"

permissions:
  contents: write

concurrency:
  group: taste-step3-final-fix-valid-once
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded fixes
        run: python scripts/_taste_step3_final_fix_once.py

      - name: Run deterministic regressions
        run: |
          set -euo pipefail
          python -m py_compile scripts/commercial_reconsideration_bridge.py scripts/refine_visual_ranking.py scripts/build_final_visual_payload.py scripts/build_pre_ai_chatgpt_payload.py scripts/build_visual_feed_v2.py scripts/test_reconsideration_commercial_bridge.py
          python scripts/test_reconsideration_commercial_bridge.py
          python scripts/test_fixed_package_purchase_options.py
          python scripts/test_package_complete_content_value.py
          python scripts/test_taste_evidence_states.py
          python scripts/test_play_priority_context.py
          python scripts/validate_taste_v3_contract.py
          python scripts/test_grounded_negative_contract.py
          python scripts/test_card_explanation_policy.py
          python scripts/validate_priority_ranking.py
          python scripts/validate_mailing_policy.py
          git diff --exit-code 0fddfd3fc58373645bb648348dd5dc013b347eea -- scripts/priority_ranking.py config/final_ranking_policy.json scripts/play_priority_context.py config/play_priority_context_contract.json scripts/apply_fixed_package_purchase_options.py config/purchase_equivalence_overrides.json scripts/giveaway_visual_handoff.py config/taste_result_contract.json config/taste_cache_entry_contract.json scripts/taste_evidence_contract.py scripts/ingest_taste_results.py web/app.js .github/workflows/build-daily-visual-payload.yml
          python - <<'PY'
          import json
          from pathlib import Path
          helper=Path('scripts/commercial_reconsideration_bridge.py').read_text(encoding='utf-8')
          assert 'discount_percent >' not in helper and 'discount_percent >=' not in helper
          assert 'PACKAGE_PRIORITY_BUCKET' not in helper
          assert 'weak_taste_can_never_be_rescued_by_discount' not in Path('config/deal_quality_contract.json').read_text(encoding='utf-8')
          assert 'legacy_exclude_direct_conflict_reason_alone_is_not_v5_confirmation' in Path('scripts/build_pre_ai_chatgpt_payload.py').read_text(encoding='utf-8')
          deal=json.loads(Path('config/deal_quality_contract.json').read_text(encoding='utf-8'))
          assert deal['final_ranking_principles']['qualitative_priority_buckets']['moderate']['МОЖНО БРАТЬ'] == 5
          print('TASTE_STEP3_STATIC_BOUNDARY_GUARDS=PASS')
          PY
          git diff --check

      - name: Run current production regeneration as far as dependencies permit
        run: |
          set -euo pipefail
          python scripts/build_fixed_package_purchase_options.py
          python scripts/build_pre_ai_chatgpt_payload.py
          python scripts/build_visual_feed_v2.py
          set +e
          python scripts/build_final_visual_payload.py > /tmp/taste_step3_final.log 2>&1
          FINAL_RC=$?
          set -e
          echo "$FINAL_RC" > /tmp/taste_step3_final.rc
          cat /tmp/taste_step3_final.log
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text(encoding='utf-8'))
          context=[json.loads(x) for x in Path('data/production/pre_ai/chatgpt_purchase_context.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          visual=json.loads(Path('web/data/current.json').read_text(encoding='utf-8'))
          counts={}
          for row in context:
              kind=((row.get('commercial_eligibility_bridge') or {}).get('kind'))
              if kind:
                  counts[kind]=counts.get(kind,0)+1
          assert counts == (manifest.get('commercial_eligibility_bridge_counts') or {})
          pkg=manifest.get('fixed_package_bridge_evidence') or {}
          if not counts:
              assert int(pkg.get('reconsiderable_candidate_count') or 0) == 0
              assert int(pkg.get('strict_savings_candidate_count') or 0) == 0
          visible_counts={}
          for game in visual.get('items') or []:
              marker=game.get('commercial_eligibility_bridge') or {}
              kind=marker.get('kind')
              if kind:
                  visible_counts[kind]=visible_counts.get(kind,0)+1
                  assert game.get('fit') == 'below_moderate'
                  assert game.get('eligibility_override') == kind
          final_log=Path('/tmp/taste_step3_final.log').read_text(encoding='utf-8')
          final_rc=int(Path('/tmp/taste_step3_final.rc').read_text(encoding='utf-8').strip())
          if manifest.get('status') == 'complete':
              assert final_rc == 0, (final_rc, final_log)
              final_result='COMPLETE_PRODUCER_EXIT_0'
          else:
              assert final_rc != 0, (final_rc, final_log)
              assert 'ChatGPT production payload is not complete' in final_log
              final_result='EXPECTED_FAIL_CLOSED_DEGRADED_PAYLOAD'
          print(json.dumps({
              'status':'PASS',
              'manifest_status':manifest.get('status'),
              'source_family_count':manifest.get('source_family_count'),
              'ai_queue_count':manifest.get('ai_queue_count'),
              'ready_without_ai_count':manifest.get('ready_without_ai_count'),
              'evidence_backfill_queue_count':(manifest.get('negative_analysis') or {}).get('evidence_backfill_queue_count'),
              'complete_family_partition':manifest.get('complete_family_partition'),
              'sale_end_coverage':manifest.get('sale_end_coverage'),
              'commercial_eligibility_bridge_counts':counts,
              'fixed_package_bridge_evidence':pkg,
              'intermediate_visual_status':visual.get('status'),
              'intermediate_visual_item_count':visual.get('item_count'),
              'intermediate_visible_bridge_counts':visible_counts,
              'canonical_final_producer_exit_code':final_rc,
              'canonical_final_producer_result':final_result,
          },ensure_ascii=False,indent=2))
          print('TASTE_STEP3_CURRENT_PRODUCTION_REGEN=PASS')
          PY

      - name: Restore generated artifacts, rebase, revalidate, and commit fixes
        run: |
          set -euo pipefail
          git restore data/production/pre_ai/fixed_package_options.json data/production/pre_ai/taste_projection.json data/production/pre_ai/chatgpt_payload.json data/production/pre_ai/chatgpt_taste_queue.jsonl data/production/pre_ai/chatgpt_purchase_context.jsonl web/data/current.json
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add config/deal_quality_contract.json scripts/commercial_reconsideration_bridge.py scripts/refine_visual_ranking.py scripts/build_final_visual_payload.py scripts/build_pre_ai_chatgpt_payload.py scripts/test_reconsideration_commercial_bridge.py PROJECT_RULES.md PROJECT_DECISIONS.md PROJECT_ROUTES.md
          git diff --cached --check
          git commit -m "Close Taste step 3 final refinement gap"
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          python scripts/test_reconsideration_commercial_bridge.py
          python scripts/validate_priority_ranking.py
          python scripts/validate_mailing_policy.py
          git push origin HEAD:main
          echo "FIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "TASTE_STEP3_FINAL_FIX=PASS" >> "$GITHUB_STEP_SUMMARY"
