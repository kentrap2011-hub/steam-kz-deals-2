name: Build final taste ledger validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - "config/taste_ledger_contract.json"
      - "data/cache/taste_fit.index.json"
      - "data/cache/taste_fit.validation.json"
      - ".github/workflows/build-taste-ledger-validation.yml"

permissions:
  contents: write

concurrency:
  group: final-taste-ledger-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate canonical final taste ledger
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          POLICY = Path('config/mailing_policy.json')
          CONTRACT = Path('config/taste_ledger_contract.json')
          TASTE_INDEX = Path('data/cache/taste_fit.index.json')
          TASTE_VALIDATION = Path('data/cache/taste_fit.validation.json')
          OUT = Path('data/cache/taste_fit.ledger_validation.json')

          def blob_sha(path: str) -> str:
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()

          policy = json.loads(POLICY.read_text(encoding='utf-8'))
          contract = json.loads(CONTRACT.read_text(encoding='utf-8'))
          taste = json.loads(TASTE_INDEX.read_text(encoding='utf-8'))
          validation = json.loads(TASTE_VALIDATION.read_text(encoding='utf-8'))

          if policy.get('status') != 'canonical':
              raise SystemExit('Policy is not canonical')
          if contract.get('contract') != 'FINAL-TASTE-LEDGER-V1':
              raise SystemExit('Unexpected taste ledger contract')
          if validation.get('status') != 'complete' or not validation.get('complete_coverage'):
              raise SystemExit('Full fingerprint validation is not complete')

          allowed_decisions = set(policy['decision_ledger']['allowed_decisions'])
          valid_exclusion_codes = set(policy['personal_filter']['valid_exclusion_reason_codes'])
          mapping = contract['cache_reason_code_semantics']
          entries = taste.get('entries')
          if not isinstance(entries, dict):
              raise SystemExit('Taste index entries are not an object')
          if taste.get('index_entry_count') != len(entries):
              raise SystemExit('Taste index actual count mismatch')

          processed = 0
          included = 0
          excluded = 0
          ambiguous = []
          invalid_reason = []
          invalid_fit = []
          unknown_code = []
          canonical_reason_counts = Counter()
          ledger_rows = []

          for key, value in entries.items():
              processed += 1
              if not isinstance(value, list) or len(value) != 5:
                  ambiguous.append({'key': key, 'reason': 'invalid_compact_entry_shape'})
                  continue

              appid, fingerprint, verdict, fit_level, cache_reason_code = value
              spec = mapping.get(cache_reason_code)
              if spec is None:
                  unknown_code.append({'key': key, 'cache_reason_code': cache_reason_code})
                  continue

              if verdict not in allowed_decisions or verdict != spec['decision']:
                  ambiguous.append({
                      'key': key,
                      'reason': 'verdict_mapping_mismatch',
                      'verdict': verdict,
                      'cache_reason_code': cache_reason_code
                  })
                  continue

              required_fit = spec.get('required_fit_level')
              if not fit_level or (required_fit is not None and fit_level != required_fit):
                  invalid_fit.append({
                      'key': key,
                      'fit_level': fit_level,
                      'required_fit_level': required_fit,
                      'cache_reason_code': cache_reason_code
                  })
                  continue

              canonical_reason = spec.get('canonical_exclusion_reason_code')
              if verdict == 'INCLUDE':
                  if canonical_reason is not None:
                      invalid_reason.append({
                          'key': key,
                          'reason': 'include_has_exclusion_reason',
                          'canonical_reason': canonical_reason
                      })
                      continue
                  included += 1
              else:
                  if canonical_reason not in valid_exclusion_codes:
                      invalid_reason.append({
                          'key': key,
                          'reason': 'invalid_canonical_exclusion_reason',
                          'canonical_reason': canonical_reason,
                          'cache_reason_code': cache_reason_code
                      })
                      continue
                  excluded += 1
                  canonical_reason_counts[canonical_reason] += 1

              ledger_rows.append([
                  key,
                  verdict,
                  fit_level,
                  canonical_reason,
                  cache_reason_code,
                  fingerprint
              ])

          expected = int(validation['feed_candidate_count'])
          if processed != expected:
              raise SystemExit(f'Ledger processed count mismatch: {processed} != {expected}')

          problem_count = len(ambiguous) + len(invalid_reason) + len(invalid_fit) + len(unknown_code)
          complete_ledger = (
              processed == expected
              and included + excluded == processed
              and problem_count == 0
          )

          ledger_digest = hashlib.sha256(
              json.dumps(ledger_rows, ensure_ascii=False, separators=(',',':')).encode('utf-8')
          ).hexdigest()

          result = {
              'schema_version': 1,
              'purpose': 'canonical_final_price_blind_taste_ledger_validation',
              'status': 'complete' if complete_ledger else 'invalid',
              'bindings': {
                  'policy_blob_sha': blob_sha('config/mailing_policy.json'),
                  'ledger_contract_blob_sha': blob_sha('config/taste_ledger_contract.json'),
                  'taste_index_blob_sha': blob_sha('data/cache/taste_fit.index.json'),
                  'taste_validation_blob_sha': blob_sha('data/cache/taste_fit.validation.json'),
                  'profile_blob_sha': taste.get('profile_blob_sha'),
                  'taste_model_version': taste.get('taste_model_version')
              },
              'processed_count': processed,
              'included_count': included,
              'excluded_count': excluded,
              'ambiguous_count': len(ambiguous),
              'invalid_reason_count': len(invalid_reason) + len(unknown_code),
              'invalid_fit_count': len(invalid_fit),
              'complete_ledger': complete_ledger,
              'canonical_exclusion_reason_counts': dict(sorted(canonical_reason_counts.items())),
              'ledger_digest_sha256': ledger_digest,
              'problems': {
                  'ambiguous': ambiguous,
                  'invalid_reason': invalid_reason,
                  'invalid_fit': invalid_fit,
                  'unknown_cache_reason_code': unknown_code
              }
          }

          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))

          if not complete_ledger:
              raise SystemExit('Final taste ledger validation failed')
          PY

      - name: Commit ledger validation artifact
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/taste_fit.ledger_validation.json
          if git diff --cached --quiet; then
            echo "Taste ledger validation artifact already current"
            exit 0
          fi
          git commit -m "Rebuild final taste ledger validation"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
