name: Ingest Steam review dossier checkpoint

on:
  push:
    paths:
      - "data/ai_inbox/taste_steam_review_dossiers/*.json"

permissions:
  contents: write

concurrency:
  group: ingest-taste-steam-review-dossier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve exactly one newly-created dossier submission
        id: submission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import PurePosixPath

          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          prefix = PurePosixPath('data/ai_inbox/taste_steam_review_dossiers')
          head = event.get('head_commit') or {}
          added = [PurePosixPath(p) for p in (head.get('added') or []) if PurePosixPath(p).parent == prefix and p.endswith('.json')]
          modified = [PurePosixPath(p) for p in (head.get('modified') or []) if PurePosixPath(p).parent == prefix]
          removed = [PurePosixPath(p) for p in (head.get('removed') or []) if PurePosixPath(p).parent == prefix]
          touched = added + modified + removed

          canonical_cleanup = (
              head.get('message') == 'Ingest Steam review dossier checkpoint'
              and not added
              and not modified
              and len(removed) == 1
          )
          if canonical_cleanup:
              print('skip=true')
              print('path=')
          elif len(added) == 1 and len(touched) == 1:
              print('skip=false')
              print(f'path={added[0].as_posix()}')
          else:
              raise SystemExit(
                  'expected exactly one create-only dossier submission or one canonical cleanup; '
                  f'added={list(map(str, added))}, modified={list(map(str, modified))}, removed={list(map(str, removed))}'
              )
          PY

      - name: Validate and ingest exact checkpoint through canonical persistence
        if: steps.submission.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python scripts/ingest_taste_steam_review_dossier_inbox.py "${{ steps.submission.outputs.path }}"

      - name: Commit dossier artifacts and same-snapshot progress atomically
        if: steps.submission.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            data/cache/taste_steam_review_dossiers \
            data/production/pre_ai/taste_steam_review_dossier_work.json \
            data/ai_inbox/taste_steam_review_dossiers
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No canonical dossier state changes produced" >&2
            exit 1
          fi
          git commit -m "Ingest Steam review dossier checkpoint"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
