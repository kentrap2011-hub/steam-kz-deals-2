name: Ingest Steam review dossier checkpoint

on:
  push:
    branches: [main]
    paths:
      - "data/ai_inbox/taste_steam_review_dossiers/*.json"

permissions:
  contents: write

# Shared with daily pre-AI preparation: both can write the canonical dossier work manifest
# and synchronize its compact worker projection.
concurrency:
  group: taste-steam-review-dossier-canonical-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The triggering commit is only a wake-up signal. Always read current
          # main repository state when this serialized writer actually starts.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drain maximal valid contiguous dossier prefix from current repository state
        run: |
          set -euo pipefail
          python scripts/ingest_taste_steam_review_dossier_inbox.py

      - name: Commit dossier artifacts canonical progress and worker projection atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            data/cache/taste_steam_review_dossiers \
            data/production/pre_ai/taste_steam_review_dossier_work.json \
            data/production/pre_ai/taste_steam_review_dossier_worker_index.json \
            data/ai_inbox/taste_steam_review_dossiers
          git add -A data/production/pre_ai/taste_steam_review_dossier_worker_groups
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No contiguous canonical dossier state changes available"
            exit 0
          fi
          git commit -m "Drain Steam review dossier buffer"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
