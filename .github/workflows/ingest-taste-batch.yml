name: Ingest context-bound taste batch

on:
  push:
    branches: [main]
    paths:
      - "data/ai_inbox/taste/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-ai-deterministic-payload
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate singleton Taste producer fence regression
        run: python scripts/validate_taste_producer_fence.py

      - name: Enforce active producer on canonical Taste inbox
        run: python scripts/taste_producer_fence.py data/ai_inbox/taste

      - name: Validate normalized taste factor contract
        run: python scripts/validate_taste_v3_contract.py

      - name: Validate taste inbox transactional proof regression
        run: python scripts/validate_taste_inbox_transactional_proof.py

      - name: Validate, ingest and rebuild taste consumers atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/process_taste_inbox.py

      - name: Commit processed taste batch and synchronized consumer state
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add -A \
            data/ai_inbox/taste \
            data/cache/taste_fit.entry_overlay.json \
            data/cache/taste_fit.entry_index.json \
            data/cache/taste_ingest_receipts \
            data/production/pre_ai/taste_projection.json \
            data/production/pre_ai/chatgpt_payload.json \
            data/production/pre_ai/chatgpt_taste_queue.jsonl \
            data/production/pre_ai/chatgpt_purchase_context.jsonl
          if [ -e data/production/pre_ai/taste_active_work_unit.json ] || \
             git ls-files --error-unmatch data/production/pre_ai/taste_active_work_unit.json >/dev/null 2>&1; then
            git add -A data/production/pre_ai/taste_active_work_unit.json
          fi
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          test -n "$changed"
          git commit -m "Ingest context-bound taste batch"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1