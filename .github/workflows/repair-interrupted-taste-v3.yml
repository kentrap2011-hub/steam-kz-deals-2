name: Repair interrupted Taste V3 submission

on:
  push:
    branches: [main]
    paths:
      - "CURRENT_TASK.md"

permissions:
  contents: write

concurrency:
  group: pre-ai-deterministic-payload
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair exact known App_1261040 fingerprint typo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          submission_path = Path('data/ai_inbox/taste/2026-08-31T0630Z-001.json')
          queue_path = Path('data/production/pre_ai/chatgpt_taste_queue.jsonl')
          key = 'App_1261040'

          submission = json.loads(submission_path.read_text(encoding='utf-8'))
          queue_rows = [json.loads(line) for line in queue_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          queue_by_key = {row['taste_subject_key']: row for row in queue_rows}
          expected = queue_by_key[key]['taste_fingerprint']

          matches = [row for row in submission['results'] if row.get('key') == key]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one {key} result, found {len(matches)}')
          row = matches[0]
          current = row.get('taste_fingerprint')
          if current == expected:
              print('Fingerprint already repaired; no content change needed')
          elif current == expected + 'a':
              row['taste_fingerprint'] = expected
              submission_path.write_text(json.dumps(submission, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              print(f'Repaired {key}: {current} -> {expected}')
          else:
              raise SystemExit(f'Unexpected {key} fingerprint: current={current!r} expected={expected!r}')
          PY

      - name: Validate repaired batch against current V3 queue
        run: |
          python scripts/validate_taste_v3_contract.py
          python scripts/ingest_taste_results.py --input data/ai_inbox/taste/2026-08-31T0630Z-001.json --dry-run

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/ai_inbox/taste/2026-08-31T0630Z-001.json
          git rm .github/workflows/repair-interrupted-taste-v3.yml
          git diff --cached --check
          git commit -m "Repair interrupted Taste V3 submission"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
