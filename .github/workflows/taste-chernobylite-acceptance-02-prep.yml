name: Chernobylite acceptance 02 read-only preflight

on:
  push:
    branches:
      - worker/taste-chernobylite-acceptance-02-prep
    paths:
      - .github/workflows/taste-chernobylite-acceptance-02-prep.yml

permissions:
  contents: read

jobs:
  prepare-one:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact current main read-only
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Establish current-main provenance and clean tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$HEAD_SHA" = "$MAIN_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PREP_MAIN_SHA=$MAIN_SHA"

      - name: Focused fixed-route tests
        run: python -m unittest tests.test_taste_current_main_canary -v

      - name: Prepare exactly one current-live Chernobylite tuple
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/taste-current-main-canary"
          python scripts/build_taste_current_main_canary.py --appid 1016800 --output-dir "$OUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'taste-current-main-canary'
          tup=json.loads((out/'prepared_semantic_tuple.json').read_text(encoding='utf-8'))
          proof=json.loads((out/'canary_proof.json').read_text(encoding='utf-8'))
          q=tup['queue_row']
          print('ACCEPTANCE_TUPLE_SUMMARY='+json.dumps({
            'main_sha': proof['current_main']['resolved_origin_main_sha'],
            'appid': tup['appid'],
            'taste_subject_key': tup['taste_subject_key'],
            'queue_cardinality': tup['queue_cardinality'],
            'profile_binding': tup['profile_binding'],
            'taste_model_version': tup['taste_model_version'],
            'taste_semantics_sha256': tup['taste_semantics_sha256'],
            'taste_fingerprint': tup['taste_fingerprint'],
            'candidate_context_sha256': tup['candidate_context_sha256'],
            'source_mailing_updated_at_utc': proof['current_main']['source_mailing_updated_at_utc'],
            'queue_row_keys': sorted(q.keys()),
            'queue_row': q,
            'candidate_context': proof['candidate_context'],
            'safety': proof['safety'],
          }, sort_keys=True))
          if tup['queue_cardinality'] != 1 or tup['taste_subject_key'] != 'App_1016800' or str(tup['appid']) != '1016800':
            raise SystemExit('wrong bounded tuple')
          PY

      - name: Prove repository untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable prepared tuple proof
        uses: actions/upload-artifact@v4
        with:
          name: taste-chernobylite-acceptance-02-prep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/taste-current-main-canary/main_provenance.json
            ${{ runner.temp }}/taste-current-main-canary/frozen_profile/profile_binding.json
            ${{ runner.temp }}/taste-current-main-canary/frozen_profile/gaming_taste_live.json
            ${{ runner.temp }}/taste-current-main-canary/prepared_semantic_tuple.json
            ${{ runner.temp }}/taste-current-main-canary/taste_projection.one.json
            ${{ runner.temp }}/taste-current-main-canary/chatgpt_payload.one.json
            ${{ runner.temp }}/taste-current-main-canary/chatgpt_taste_queue.one.jsonl
            ${{ runner.temp }}/taste-current-main-canary/canary_proof.json
          if-no-files-found: error
          retention-days: 7
