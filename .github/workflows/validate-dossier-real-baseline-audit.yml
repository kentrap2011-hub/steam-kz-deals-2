name: Validate Dossier real baseline eligibility (PR only)

on:
  pull_request:
    paths:
      - "scripts/dossier_shadow_real_baseline_audit.py"
      - "scripts/test_dossier_shadow_real_baseline_audit.py"
      - "reviews/worker_reports/dossier-shadow-real-baseline-eligibility-audit-01.md"
      - ".github/workflows/validate-dossier-real-baseline-audit.yml"

permissions:
  contents: read

jobs:
  real-history-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing strict V2 dependency
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Compile read-only wrapper and isolated adversarial tests
        run: |
          python -m py_compile scripts/dossier_shadow_real_baseline_audit.py scripts/test_dossier_shadow_real_baseline_audit.py
          python -m unittest discover -s scripts -p 'test_dossier_shadow_real_baseline_audit.py' -v
          python -m unittest discover -s scripts -p 'test_dossier_shadow_pilot_preflight.py' -v
      - name: Strict preflight for every accepted group in pinned real history
        run: |
          python scripts/dossier_shadow_real_baseline_audit.py \
            --target-head 95a4bf4990a60082ecb3302da5bc7f23b618d93e \
            --expected-work-blob ef40fc186aabc79dfd24c72864dbe43817a56039 \
            --expected-audit-blob 8dbf4437d7ba439942f58a6f36d89d6a7ddeec7b \
            --expected-accepted 20 \
            --min-preflight-ready 6 \
            --out "$RUNNER_TEMP/dossier-shadow-real-baseline-audit.json"
      - name: Upload safe metadata-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-shadow-real-baseline-read-only-diagnostic
          path: ${{ runner.temp }}/dossier-shadow-real-baseline-audit.json
          if-no-files-found: ignore
          retention-days: 7
