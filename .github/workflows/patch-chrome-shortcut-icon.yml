name: Patch Chrome shortcut icon

on:
  push:
    paths:
      - '.github/workflows/patch-chrome-shortcut-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add manifest and shortcut icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET

          index_path = Path('web/index.html')
          index = index_path.read_text(encoding='utf-8')
          needle = '  <title>Игры со скидками</title>\n  <link rel="stylesheet" href="styles.css">'
          replacement = '''  <title>Игры со скидками</title>
            <meta name="application-name" content="Игры со скидками">
            <link rel="icon" href="icon.svg" type="image/svg+xml">
            <link rel="manifest" href="manifest.webmanifest">
            <link rel="stylesheet" href="styles.css">'''
          if needle not in index:
              raise SystemExit('index head marker not found')
          index = index.replace(needle, replacement, 1)
          index_path.write_text(index, encoding='utf-8')

          manifest = {
              'name': 'Игры со скидками',
              'short_name': 'Скидки Steam',
              'description': 'Персональная лента скидок Steam',
              'lang': 'ru',
              'start_url': './',
              'scope': './',
              'display': 'standalone',
              'background_color': '#0e1117',
              'theme_color': '#0e1117',
              'icons': [
                  {'src': 'icon.svg', 'sizes': 'any', 'type': 'image/svg+xml', 'purpose': 'any'},
                  {'src': 'icon-maskable.svg', 'sizes': 'any', 'type': 'image/svg+xml', 'purpose': 'maskable'},
              ],
          }
          Path('web/manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          icon = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Игры со скидками">
            <rect width="512" height="512" rx="112" fill="#0e1117"/>
            <circle cx="256" cy="256" r="154" fill="#202631" stroke="#79a7ff" stroke-width="16"/>
            <path d="M170 224c18-35 48-54 86-54s68 19 86 54l31 78c13 34-9 70-45 70-20 0-37-10-49-27l-15-21h-16l-15 21c-12 17-29 27-49 27-36 0-58-36-45-70z" fill="none" stroke="#f5f7fa" stroke-width="20" stroke-linejoin="round"/>
            <path d="M192 252v58M163 281h58" stroke="#f5f7fa" stroke-width="18" stroke-linecap="round"/>
            <circle cx="319" cy="265" r="11" fill="#79a7ff"/>
            <circle cx="345" cy="292" r="11" fill="#79a7ff"/>
            <path d="M256 205v82" stroke="#79a7ff" stroke-width="18" stroke-linecap="round"/>
            <path d="m229 261 27 28 27-28" fill="none" stroke="#79a7ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          '''
          maskable = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Игры со скидками">
            <rect width="512" height="512" fill="#0e1117"/>
            <circle cx="256" cy="256" r="145" fill="#202631" stroke="#79a7ff" stroke-width="15"/>
            <path d="M177 228c17-32 44-49 79-49s62 17 79 49l27 69c12 30-8 61-40 61-18 0-33-9-44-24l-13-18h-18l-13 18c-11 15-26 24-44 24-32 0-52-31-40-61z" fill="none" stroke="#f5f7fa" stroke-width="18" stroke-linejoin="round"/>
            <path d="M196 252v52M170 278h52" stroke="#f5f7fa" stroke-width="16" stroke-linecap="round"/>
            <circle cx="316" cy="264" r="10" fill="#79a7ff"/>
            <circle cx="339" cy="289" r="10" fill="#79a7ff"/>
            <path d="M256 210v73" stroke="#79a7ff" stroke-width="16" stroke-linecap="round"/>
            <path d="m232 259 24 25 24-25" fill="none" stroke="#79a7ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          '''
          Path('web/icon.svg').write_text(icon, encoding='utf-8')
          Path('web/icon-maskable.svg').write_text(maskable, encoding='utf-8')

          backlog_path = Path('BACKLOG.md')
          backlog = backlog_path.read_text(encoding='utf-8')
          title = 'UI: красивый ярлык страницы при сохранении через Google Chrome'
          pattern = rf'(\n### {re.escape(title)}\n)(.*?)(?=\n### |\Z)'
          match = re.search(pattern, backlog, flags=re.S)
          if not match:
              raise SystemExit('Chrome shortcut backlog section not found')
          body = match.group(2)
          body = re.sub(r'\*\*Статус:\*\*.*?\n', '**Статус:** implemented_pending_real_chrome_check  \n', body, count=1)
          pending = '\nРеализация:\n- добавлены `web/manifest.webmanifest`, `web/icon.svg` и `web/icon-maskable.svg`;\n- `web/index.html` подключает manifest и SVG favicon;\n- manifest содержит отдельные `any` и `maskable` icon purposes;\n- техническая проверка JSON/SVG выполняется в one-shot patch workflow;\n- остаётся только пользовательская проверка: удалить старый ярлык (если был), заново добавить страницу на главный экран через Chrome и подтвердить внешний вид иконки.\n'
          if 'Реализация:' not in body:
              body = body.rstrip() + '\n' + pending
          backlog = backlog[:match.start()] + match.group(1) + body + backlog[match.end():]
          backlog_path.write_text(backlog, encoding='utf-8')

          json.loads(Path('web/manifest.webmanifest').read_text(encoding='utf-8'))
          ET.parse('web/icon.svg')
          ET.parse('web/icon-maskable.svg')
          assert 'rel="manifest" href="manifest.webmanifest"' in index
          assert 'rel="icon" href="icon.svg"' in index
          PY

      - name: Validate assets
        shell: bash
        run: |
          python -m json.tool web/manifest.webmanifest >/dev/null
          grep -q 'purpose.*maskable' web/manifest.webmanifest
          grep -q 'manifest.webmanifest' web/index.html
          grep -q 'icon.svg' web/index.html

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'steam-kz-bot'
          git config user.email 'steam-kz-bot@users.noreply.github.com'
          git rm .github/workflows/patch-chrome-shortcut-icon.yml
          git add web/index.html web/manifest.webmanifest web/icon.svg web/icon-maskable.svg BACKLOG.md
          git commit -m 'Add Chrome shortcut icons and manifest'
          git pull --rebase origin main
          git push origin HEAD:main
