name: Apply StoreBrowse identity fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-storebrowse-identity-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch StoreBrowse app identity invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_pre_ai_store_snapshot.py')
          text = path.read_text(encoding='utf-8')
          old = """            if 'appid' in rid:\n                identity_ok = int(store_item.get('appid') or 0) == rid['appid']\n"""
          new = """            if 'appid' in rid:\n                # StoreItem.id identifies the requested store entity. StoreItem.appid can\n                # point at underlying content for legacy/collection store pages.\n                identity_ok = (\n                    int(store_item.get('item_type') or 0) == 0\n                    and int(store_item.get('id') or 0) == rid['appid']\n                )\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old identity check, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/build_pre_ai_store_snapshot.py
      - name: Commit fix
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add scripts/build_pre_ai_store_snapshot.py
          git commit -m "Use StoreBrowse item ID for app identity"
          git pull --rebase origin main
          git push origin HEAD:main
