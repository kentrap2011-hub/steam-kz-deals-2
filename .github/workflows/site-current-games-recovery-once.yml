name: Site current games recovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-current-games-recovery-once.yml"

permissions:
  contents: write

concurrency:
  group: site-current-games-recovery-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded normalize readiness gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/normalize_visual_media_urls.py')
          text = path.read_text(encoding='utf-8')

          old_import = "import grounded_negative_visual\n"
          new_import = "import grounded_negative_visual\nimport build_daily_visual_payload as readiness_builder\n"
          if text.count(old_import) != 1:
              raise SystemExit(f'expected grounded import once, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          marker = "\ndef main():\n"
          helper = '''\ndef apply_grounded_negative_if_ready():\n    source_key, _payload = readiness_builder.current_production_readiness()\n    if source_key is None:\n        return False, {\n            'mapped_finding_count': 0,\n            'visible_item_count': 0,\n        }, 'pending_ai_queue'\n    changed, stats = grounded_negative_visual.apply_to_current_visual()\n    return changed, stats, 'applied'\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected main marker once, found {text.count(marker)}')
          text = text.replace(marker, helper + 'def main():\n', 1)

          old_call = "    grounded_changed, grounded_stats = grounded_negative_visual.apply_to_current_visual()\n"
          new_call = "    grounded_changed, grounded_stats, grounded_mode = apply_grounded_negative_if_ready()\n"
          if text.count(old_call) != 1:
              raise SystemExit(f'expected grounded call once, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          old_print = "        f'ALIASES_REFRESHED={aliases_refreshed} '\n        f'GROUNDED_NEGATIVE_CHANGED={str(grounded_changed).lower()} '\n"
          new_print = "        f'ALIASES_REFRESHED={aliases_refreshed} '\n        f'GROUNDED_NEGATIVE_MODE={grounded_mode} '\n        f'GROUNDED_NEGATIVE_CHANGED={str(grounded_changed).lower()} '\n"
          if text.count(old_print) != 1:
              raise SystemExit(f'expected output block once, found {text.count(old_print)}')
          text = text.replace(old_print, new_print, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add focused normalize regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/test_visual_normalize_pending_ai_gate.py <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parent))
          import normalize_visual_media_urls as normalizer


          original_readiness = normalizer.readiness_builder.current_production_readiness
          original_apply = normalizer.grounded_negative_visual.apply_to_current_visual
          try:
              calls = []
              normalizer.readiness_builder.current_production_readiness = lambda: (None, {'status': 'degraded'})
              normalizer.grounded_negative_visual.apply_to_current_visual = lambda: calls.append('grounded')
              changed, stats, mode = normalizer.apply_grounded_negative_if_ready()
              assert changed is False
              assert mode == 'pending_ai_queue'
              assert calls == []
              assert stats['mapped_finding_count'] == 0

              normalizer.readiness_builder.current_production_readiness = lambda: ('cycle-key', {'status': 'complete'})
              normalizer.grounded_negative_visual.apply_to_current_visual = lambda: (
                  True,
                  {'mapped_finding_count': 3, 'visible_item_count': 2},
              )
              changed, stats, mode = normalizer.apply_grounded_negative_if_ready()
              assert changed is True
              assert mode == 'applied'
              assert stats['mapped_finding_count'] == 3
          finally:
              normalizer.readiness_builder.current_production_readiness = original_readiness
              normalizer.grounded_negative_visual.apply_to_current_visual = original_apply

          print('visual normalize pending-AI gate regression: ok')
          PY

      - name: Run focused and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/normalize_visual_media_urls.py scripts/test_visual_normalize_pending_ai_gate.py
          python scripts/test_visual_degraded_refresh_readiness.py
          python scripts/test_visual_normalize_pending_ai_gate.py
          python scripts/test_giveaway_visual_handoff.py
          python scripts/test_card_explanation_policy.py

      - name: Commit permanent repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/site-current-games-recovery-once.yml
          git add scripts/normalize_visual_media_urls.py scripts/test_visual_normalize_pending_ai_gate.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'repair produced no changes'; exit 1; }
          git commit -m "fix: keep semantic finalizer out of pending-AI visual refresh"
          git push origin HEAD:main
