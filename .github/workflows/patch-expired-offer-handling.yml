name: Patch expired offer handling

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-expired-offer-handling.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch current-offer expiry semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # 1) Store snapshot: classify every source candidate using fresh StoreBrowse,
          # keep only currently active paid discounts in entries, but keep metadata for all.
          path = Path('scripts/build_pre_ai_store_snapshot.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "        raise SystemExit(f'No exact package purchase option for {key}')\n",
              "        return None, 'no_exact_package_purchase_option'\n",
          )
          text = text.replace(
              "    raise SystemExit(f'No active discounted purchase option for {key}')\n",
              "    return None, 'no_active_discounted_purchase_option'\n",
          )
          start = text.index('    for key, store_item in paired:\n')
          end = text.index('    control = compare_with_control(metadata_entries)\n', start)
          new_loop = '''    inactive_entries = {}\n    observed_epoch = int(observed.timestamp())\n\n    for key, store_item in paired:\n        row = feed[key]\n\n        # Content identity/metadata remains complete even when the paid offer has ended.\n        meta = metadata_entry(key, row, store_item)\n        metadata_entries[key] = meta\n        label = meta.get('app_type') if meta.get('entity_kind') == 'app' else 'package'\n        type_counts[label or 'unknown'] = type_counts.get(label or 'unknown', 0) + 1\n\n        option, selection_method = choose_option(key, row, store_item)\n        selection_counts[selection_method] = selection_counts.get(selection_method, 0) + 1\n        if option is None:\n            inactive_entries[key] = {\n                'key': key,\n                'appid': row['appid'] or None,\n                'title': row['title'],\n                'reason': selection_method,\n                'source_discount_percent': row['source_discount_percent'],\n                'source_final_kzt': row['source_final_kzt'],\n            }\n            continue\n\n        discount = int(option.get('discount_pct') or 0)\n        current = final_kzt(option)\n        original = original_kzt(option)\n        if discount <= 0 or current is None or current <= 0:\n            inactive_entries[key] = {\n                'key': key,\n                'appid': row['appid'] or None,\n                'title': row['title'],\n                'reason': 'observed_option_is_not_an_active_paid_discount',\n                'observed_discount_percent': discount,\n                'observed_final_kzt': current,\n                'source_discount_percent': row['source_discount_percent'],\n                'source_final_kzt': row['source_final_kzt'],\n            }\n            continue\n        if original is None or original < current:\n            raise SystemExit(f'Invalid original price for current discounted option {key}')\n\n        end_values = sorted({\n            int(d.get('discount_end_date') or 0)\n            for d in (option.get('active_discounts') or [])\n            if int(d.get('discount_end_date') or 0) > 0\n        })\n        # A live endpoint can briefly expose a just-expired option. Never carry it\n        # forward merely because discount_pct has not yet refreshed.\n        if end_values and min(end_values) <= observed_epoch:\n            inactive_entries[key] = {\n                'key': key,\n                'appid': row['appid'] or None,\n                'title': row['title'],\n                'reason': 'known_discount_end_not_after_store_observation',\n                'observed_discount_percent': discount,\n                'observed_final_kzt': current,\n                'observed_discount_end_epoch': min(end_values),\n                'source_discount_percent': row['source_discount_percent'],\n                'source_final_kzt': row['source_final_kzt'],\n            }\n            continue\n\n        if end_values:\n            # If stacked active discounts exist, the earliest ending component can change the current final price.\n            end_epoch = min(end_values)\n            end_utc = datetime.fromtimestamp(end_epoch, tz=timezone.utc)\n            end_local = end_utc.astimezone(DISPLAY_TZ)\n        else:\n            sale_end_unknown.append(key)\n            end_epoch = None\n            end_utc = None\n            end_local = None\n\n        deal_changed = (\n            discount != row['source_discount_percent']\n            or abs(current - row['source_final_kzt']) >= 0.011\n        )\n        if deal_changed:\n            changed.append(key)\n\n        store_entries[key] = {\n            'key': key,\n            'appid': row['appid'] or None,\n            'title': row['title'],\n            'purchase_packageid': int(option.get('packageid') or 0) or None,\n            'purchase_option_name': option.get('purchase_option_name'),\n            'selection_method': selection_method,\n            'discount_percent': discount,\n            'final_kzt': current,\n            'original_kzt': original,\n            'discount_end_epoch': end_epoch,\n            'discount_end_utc': end_utc.isoformat() if end_utc else None,\n            'discount_end_europe_berlin': end_local.isoformat() if end_local else None,\n            'discount_end_date_europe_berlin': end_local.date().isoformat() if end_local else None,\n            'source_discount_percent': row['source_discount_percent'],\n            'source_final_kzt': row['source_final_kzt'],\n            'changed_since_discovery_snapshot': deal_changed,\n        }\n\n    if len(store_entries) + len(inactive_entries) != len(feed):\n        raise SystemExit(\n            'Pre-AI Store classification incomplete: '\n            f'active={len(store_entries)} inactive={len(inactive_entries)} source={len(feed)}'\n        )\n    if len(metadata_entries) != len(feed):\n        raise SystemExit(\n            'Pre-AI metadata snapshot incomplete: '\n            f'metadata={len(metadata_entries)} source={len(feed)}'\n        )\n\n'''
          text = text[:start] + new_loop + text[end:]

          store_start = text.index('    store_out = {\n')
          metadata_start = text.index('    metadata_out = {\n', store_start)
          new_store = '''    sale_end_known_count = len(store_entries) - len(sale_end_unknown)\n    sale_end_coverage = (sale_end_known_count / len(store_entries)) if store_entries else 1.0\n    store_out = {\n        'schema_version': 3,\n        'purpose': 'pre_ai_current_store_snapshot',\n        'status': 'complete',\n        'authoritative_for': ['current_active_paid_offer_state', 'current_price_kzt', 'discount_percent', 'discount_end'],\n        'discovery_source_path': 'data/production/mailing/index.json',\n        'discovery_source_updated_at_utc': index.get('source_updated_at_utc'),\n        'observed_at_utc': observed.isoformat(),\n        'display_timezone': 'Europe/Berlin',\n        'source_item_count': len(feed),\n        'classified_source_candidate_count': len(store_entries) + len(inactive_entries),\n        'classification_complete': len(store_entries) + len(inactive_entries) == len(feed),\n        'entry_count': len(store_entries),\n        'active_paid_discount_count': len(store_entries),\n        'inactive_source_candidate_count': len(inactive_entries),\n        'inactive_source_candidate_keys': sorted(inactive_entries),\n        'inactive_entries': inactive_entries,\n        'request_count': request_count,\n        'batch_size': BATCH_SIZE,\n        'sale_end_known_count': sale_end_known_count,\n        'sale_end_unknown_count': len(sale_end_unknown),\n        'sale_end_unknown_keys': sorted(sale_end_unknown),\n        'sale_end_coverage_ratio': round(sale_end_coverage, 4),\n        'changed_since_discovery_count': len(changed),\n        'changed_since_discovery_keys': sorted(changed),\n        'selection_method_counts': selection_counts,\n        'shared_storebrowse_pass_includes_content_metadata': True,\n        'expired_or_inactive_source_candidates_are_not_current_entries': True,\n        'elapsed_seconds_shared_pass': elapsed,\n        'entries': store_entries,\n    }\n'''
          text = text[:store_start] + new_store + text[metadata_start:]

          print_start = text.index("    print(json.dumps({\n        'status': 'complete',", metadata_start)
          print_end = text.index("\n\n\nif __name__ == '__main__':", print_start)
          new_print = '''    print(json.dumps({\n        'status': 'complete',\n        'source': len(feed),\n        'classified': len(store_entries) + len(inactive_entries),\n        'active_paid_discounts': len(store_entries),\n        'inactive_source_candidates': len(inactive_entries),\n        'metadata_entries': len(metadata_entries),\n        'requests_shared': request_count,\n        'sale_end_coverage': round(sale_end_coverage, 4),\n        'sale_end_unknown': len(sale_end_unknown),\n        'changed_since_discovery': len(changed),\n        'metadata_types': type_counts,\n        'control_comparison': control,\n        'elapsed_seconds_shared_pass': elapsed,\n    }, ensure_ascii=False, indent=2))'''
          text = text[:print_start] + new_print + text[print_end:]
          path.write_text(text, encoding='utf-8')

          # 2) Family graph: only currently active paid offers may enter purchase families.
          path = Path('scripts/build_pre_ai_family_graph.py')
          text = path.read_text(encoding='utf-8')
          old = """    available = {\n        key for key in old_keys\n        if key in feed and key in rules and rules[key].get('mechanical_action') != 'exclude_before_ai_output'\n    }\n"""
          new = """    available = {\n        key for key in old_keys\n        if key in feed and key in store and key in rules and rules[key].get('mechanical_action') != 'exclude_before_ai_output'\n    }\n"""
          if old not in text:
              raise SystemExit('family graph control block not found')
          text = text.replace(old, new)

          old = """    if set(feed) != set(store) or set(feed) != set(meta) or set(feed) != set(rules):\n        raise SystemExit('Pre-AI prerequisite keysets differ')\n\n    allowed = {\n        key for key, rule in rules.items()\n        if rule.get('mechanical_action') in {'keep_for_ai', 'keep_for_ai_then_resolve_condition'}\n    }\n    excluded = set(feed) - allowed\n    families = resolve(allowed, feed, store, meta, rules, contract)\n"""
          new = """    if set(feed) != set(meta) or set(feed) != set(rules):\n        raise SystemExit('Pre-AI metadata/rules keysets differ from mailing feed')\n    if not set(store) <= set(feed):\n        raise SystemExit('Pre-AI Store snapshot contains keys outside mailing feed')\n    inactive_entries = store_doc.get('inactive_entries') or {}\n    if set(inactive_entries) != (set(feed) - set(store)):\n        raise SystemExit('Pre-AI Store active/inactive partition mismatch')\n    if store_doc.get('classification_complete') is not True or int(store_doc.get('classified_source_candidate_count') or -1) != len(feed):\n        raise SystemExit('Pre-AI Store source-candidate classification incomplete')\n\n    mechanically_allowed = {\n        key for key, rule in rules.items()\n        if rule.get('mechanical_action') in {'keep_for_ai', 'keep_for_ai_then_resolve_condition'}\n    }\n    allowed = mechanically_allowed & set(store)\n    inactive_eligible = mechanically_allowed - set(store)\n    mechanically_excluded = set(feed) - mechanically_allowed\n    excluded = set(feed) - allowed\n    families = resolve(allowed, feed, store, meta, rules, contract)\n"""
          if old not in text:
              raise SystemExit('family graph main keyset block not found')
          text = text.replace(old, new)

          old = """        'mechanically_excluded_count': len(excluded),\n        'family_candidate_item_count': len(allowed),\n"""
          new = """        'mechanically_excluded_count': len(mechanically_excluded),\n        'inactive_paid_offer_count': len(inactive_eligible),\n        'inactive_paid_offer_keys': sorted(inactive_eligible),\n        'excluded_before_family_total_count': len(excluded),\n        'family_candidate_item_count': len(allowed),\n"""
          if old not in text:
              raise SystemExit('family graph output count block not found')
          text = text.replace(old, new)

          old = """        'mechanically_excluded': out['mechanically_excluded_count'],\n        'family_candidates': out['family_candidate_item_count'],\n"""
          new = """        'mechanically_excluded': out['mechanically_excluded_count'],\n        'inactive_paid_offers': out['inactive_paid_offer_count'],\n        'excluded_before_family_total': out['excluded_before_family_total_count'],\n        'family_candidates': out['family_candidate_item_count'],\n"""
          if old not in text:
              raise SystemExit('family graph print count block not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # 3) Consumer contract: a known end time is a hard runtime freshness guard.
          path = Path('scripts/build_pre_ai_chatgpt_payload.py')
          text = path.read_text(encoding='utf-8')
          needle = "            'missing_sale_end_does_not_exclude_candidate': True,\n"
          if needle not in text:
              raise SystemExit('consumer contract sale-end block not found')
          text = text.replace(
              needle,
              needle + "            'known_sale_end_at_or_before_consumer_time_is_inactive': True,\n            'current_offer_state_must_not_be_reused_past_known_sale_end': True,\n",
          )
          path.write_text(text, encoding='utf-8')

          # 4) Canonical policy: make taste-cache/deal-state separation explicit.
          p = Path('config/mailing_policy.json')
          policy = json.loads(p.read_text(encoding='utf-8'))
          policy['version'] = '1.13'
          policy['taste_cache']['commercial_state_not_stored_in_taste_cache'] = True
          policy['taste_cache']['sale_expiry_does_not_invalidate_taste_verdict'] = True
          policy['verification']['known_sale_end_at_or_before_consumer_time_means_inactive'] = True
          policy['verification']['current_offer_state_must_not_be_reused_past_known_sale_end'] = True
          policy['verification']['expired_offer_action'] = 'exclude_current_offer_but_keep_valid_price_blind_taste_cache_entry'
          p.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 5) Locked policy validator follows the new canonical version/invariants.
          p = Path('.github/workflows/validate-mailing-policy.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('"version": p.get("version") == "1.12",', '"version": p.get("version") == "1.13",')
          needle = '              "cache_v2": tc["taste_model_version"] == "taste-v2",\n'
          if needle not in text:
              raise SystemExit('policy validator cache block not found')
          text = text.replace(
              needle,
              needle + '              "taste_cache_has_no_commercial_state": tc["commercial_state_not_stored_in_taste_cache"] is True,\n              "sale_expiry_keeps_taste_verdict": tc["sale_expiry_does_not_invalidate_taste_verdict"] is True,\n              "known_end_runtime_guard": p["verification"]["known_sale_end_at_or_before_consumer_time_means_inactive"] is True,\n              "no_offer_reuse_past_end": p["verification"]["current_offer_state_must_not_be_reused_past_known_sale_end"] is True,\n'
          )
          p.write_text(text, encoding='utf-8')

          # 6) Human project rules preserve the same distinction for future chats.
          p = Path('PROJECT_RULES.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Роль ChatGPT\n'
          addition = '''## Срок жизни скидки и кэша\n\nВкусовая оценка игры и текущее состояние скидки — разные данные. Вкусовую оценку можно хранить и переиспользовать после окончания акции, потому что она не содержит цену, процент скидки или срок акции.\n\nТекущее предложение нельзя считать активным после известного времени окончания скидки. Перед попаданием в текущую рассылку предложение должно быть подтверждено свежим состоянием магазина, а если известная дата/время окончания уже прошли к моменту формирования пользовательского результата — предложение исключается из текущего выпуска без удаления валидной вкусовой оценки.\n\nЕсли скидка появится снова, можно переиспользовать сохранённую вкусовую оценку, но цена, процент скидки и срок акции должны браться заново из текущего состояния магазина.\n\n'''
          if addition not in text:
              if marker not in text:
                  raise SystemExit('PROJECT_RULES insertion marker not found')
              text = text.replace(marker, addition + marker)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Syntax and policy checks
        run: |
          python -m py_compile scripts/build_pre_ai_store_snapshot.py scripts/build_pre_ai_family_graph.py scripts/build_pre_ai_chatgpt_payload.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/mailing_policy.json').read_text(encoding='utf-8'))
          assert p['version']=='1.13'
          assert p['taste_cache']['commercial_state_not_stored_in_taste_cache'] is True
          assert p['verification']['known_sale_end_at_or_before_consumer_time_means_inactive'] is True
          print('EXPIRED_OFFER_POLICY_PATCH=PASS')
          PY

      - name: Commit patch
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add scripts/build_pre_ai_store_snapshot.py scripts/build_pre_ai_family_graph.py scripts/build_pre_ai_chatgpt_payload.py config/mailing_policy.json .github/workflows/validate-mailing-policy.yml PROJECT_RULES.md
          git diff --cached --check
          git commit -m "Expire stale offers without discarding taste cache"
          git push origin HEAD:main
