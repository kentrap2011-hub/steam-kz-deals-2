name: Validate inactive Research Notes V2 and autonomous Assembly

on:
  pull_request:
    paths:
      - "config/dossier_notes_v2_fresh6_preparation_contract.json"
      - "scripts/dossier_notes_v2_fresh6_preflight.py"
      - "scripts/test_dossier_notes_v2_fresh6_preflight.py"
      - "config/dossier_notes_v2_batch_policy.json"
      - "config/dossier_notes_v2_batches/*.json"
      - "scripts/dossier_notes_v2_batch_preflight.py"
      - "scripts/dossier_notes_v2_batch_route.py"
      - "scripts/dossier_notes_v2_batch_issuer.py"
      - "scripts/dossier_notes_v2_assembly_replay_seed.py"
      - "scripts/dossier_notes_v2_generic_replay.py"
      - "scripts/test_dossier_notes_v2_generic_replay.py"
      - "scripts/dossier_notes_v2_writer_preflight.py"
      - "scripts/test_dossier_notes_v2_writer_preflight.py"
      - "config/dossier_notes_v2_generic_replay_policy.json"
      - "config/dossier_notes_v2_generic_replay_request.schema.json"
      - "config/dossier_notes_v2_generic_assembly_replay_runbook.md"
      - "config/dossier_notes_v2_generic_assembly_replay_manual_one_shot_prompt.md"
      - ".github/workflows/issue-dossier-notes-v2-generic-assembly-replay.yml"
      - "scripts/test_dossier_notes_v2_assembly_replay_seed.py"
      - ".github/workflows/issue-dossier-notes-v2-assembly-rerun-on-owner-push.yml"
      - "scripts/dossier_notes_v2_batch_pilot.py"
      - "scripts/dossier_notes_v2_research_receipt_ingest.py"
      - "scripts/test_dossier_notes_v2_research_receipt_ingest.py"
      - "scripts/test_dossier_notes_v2_owner_push.py"
      - ".github/workflows/issue-dossier-notes-v2-on-owner-push.yml"
      - ".github/workflows/ingest-dossier-notes-v2-research-on-owner-push.yml"
      - ".github/workflows/ingest-dossier-notes-v2-research.yml"
      - "scripts/dossier_notes_v2_connector_transport.mjs"
      - "scripts/test_dossier_notes_v2_connector_transport.mjs"
      - "config/dossier_notes_v2_connector_transport_manual_runbook.md"
      - "scripts/test_dossier_notes_v2_batch_route.py"
      - ".github/workflows/issue-dossier-notes-v2-batch.yml"
      - ".github/workflows/authorize-dossier-notes-v2-batch.yml"
      - "config/dossier_notes_v2_batch_research_manual_one_shot_prompt.md"
      - "config/dossier_notes_v2_batch_assembly_manual_one_shot_prompt.md"
      - "config/dossier_research_notes_v2_contract.json"
      - "config/dossier_notes_v2_pinned_original_research_buffer_v1.json"
      - "config/dossier_research_notes_v2.schema.json"
      - "config/dossier_autonomous_assembly_result_v2.schema.json"
      - "config/dossier_notes_v2_item_receipt.schema.json"
      - "config/dossier_two_stage_interfaces_contract.json"
      - "scripts/dossier_research_notes_v2.py"
      - "config/dossier_notes_v2_lean_final.schema.json"
      - "scripts/dossier_notes_v2_lean_final.py"
      - "scripts/test_dossier_notes_v2_lean_final.py"
      - "scripts/dossier_notes_v2_deep_compat.py"
      - "scripts/test_dossier_notes_v2_deep_compat.py"
      - "config/dossier_lean_canonical_dual_format_contract.json"
      - "scripts/dossier_lean_canonical_dual.py"
      - "scripts/test_dossier_lean_canonical_dual.py"
      - "scripts/taste_steam_review_dossier_web.py"
      - "scripts/progressive_pass2.py"
      - "scripts/dossier_two_stage_versioned.py"
      - "scripts/test_dossier_research_notes_v2.py"
      - "scripts/dossier_notes_v2_per_item_receipts.py"
      - "scripts/dossier_notes_v2_original18_pilot.py"
      - "scripts/dossier_shadow_research_trial_publish.py"
      - "scripts/dossier_shadow_research_feasibility.py"
      - "scripts/taste_steam_review_dossier_buffered.py"
      - ".github/workflows/publish-dossier-shadow-research-freeze.yml"
      - ".github/workflows/authorize-dossier-shadow-research-feasibility.yml"
      - ".github/workflows/ingest-taste-steam-review-dossier-checkpoint.yml"
      - "scripts/test_dossier_notes_v2_per_item_receipts.py"
      - ".github/workflows/validate-dossier-research-notes-v2.yml"

permissions:
  contents: read

jobs:
  synthetic-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # offline fresh6 scope guard verifies pinned historical main Git blobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline validator dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Tokenless GitHub Connector transport and CAS adversarial regressions
        run: node --test scripts/test_dossier_notes_v2_connector_transport.mjs
      - name: Adversarial synthetic Notes V2 and assembly
        run: python scripts/test_dossier_research_notes_v2.py -v
      - name: Lean-final sandbox format, temporal and identity guards
        run: |
          python -m py_compile scripts/dossier_notes_v2_lean_final.py scripts/test_dossier_notes_v2_lean_final.py
          python scripts/test_dossier_notes_v2_lean_final.py -v
      - name: Lean dossier isolated Deep compatibility and old V2 regression
        run: |
          python -m py_compile scripts/dossier_notes_v2_deep_compat.py scripts/test_dossier_notes_v2_deep_compat.py scripts/progressive_pass2.py
          python scripts/test_dossier_notes_v2_deep_compat.py -v
      - name: Disabled canonical Lean writer-to-Deep offline Git integration and old V2 regression
        run: |
          python -m py_compile scripts/dossier_lean_canonical_dual.py scripts/test_dossier_lean_canonical_dual.py scripts/taste_steam_review_dossier_web.py
          python scripts/test_dossier_lean_canonical_dual.py -v
      - name: Exact six Lean sandbox-only writer and atomic post-commit readback regressions
        run: |
          python -m py_compile scripts/dossier_notes_v2_isolated_lean_readback.py scripts/test_dossier_notes_v2_isolated_lean_acceptance.py scripts/dossier_lean_canonical_dual.py scripts/taste_steam_review_dossier_buffered.py
          python scripts/test_dossier_notes_v2_isolated_lean_acceptance.py -v
      - name: Prepared fresh6 scope and no-authority adversarial tests (no semantic execution)
        run: |
          python scripts/test_dossier_notes_v2_fresh6_preflight.py -v
          python scripts/dossier_notes_v2_fresh6_preflight.py --check
      - name: Reusable Git-issuer, second cohort, item writer and adversarial tests
        run: python scripts/test_dossier_notes_v2_batch_route.py -v
      - name: One-write Research then independent GitHub-owned receipt regression
        run: python scripts/test_dossier_notes_v2_research_receipt_ingest.py -v
      - name: Strict owner push, one-use rerun and automatic Research receipts regression
        run: python scripts/test_dossier_notes_v2_owner_push.py -v
      - name: Exact frozen six Research replay, one-use issuer and new receipt regression
        run: python scripts/test_dossier_notes_v2_assembly_replay_seed.py -v
      - name: Generic two-run Research replay and owner request offline regressions
        run: python scripts/test_dossier_notes_v2_generic_replay.py -v
      - name: Real writer command route generic-vs-legacy offline owner/receipt regressions
        run: python scripts/test_dossier_notes_v2_writer_preflight.py -v
      - name: Inactive V2 per-item Git receipt regression (14 tests)
        run: python scripts/test_dossier_notes_v2_per_item_receipts.py -v
      - name: Existing strict V2 isolated writer transaction regression
        run: python scripts/test_dossier_two_stage_final_acceptance.py NotesV2IndividualReadinessTests.test_v2_github_writer_hookup_single_transaction -v
      - name: Lean sandbox cannot bypass the canonical strict writer
        run: python scripts/test_dossier_two_stage_final_acceptance.py NotesV2IndividualReadinessTests.test_v2_lean_candidate_is_local_ready_but_non_sandbox_writer_cannot_publish -v
      - name: Syntax and PR activation guard
        run: |
          python -m py_compile scripts/dossier_notes_v2_research_receipt_ingest.py scripts/test_dossier_notes_v2_research_receipt_ingest.py scripts/test_dossier_notes_v2_owner_push.py
          python -m py_compile scripts/dossier_notes_v2_assembly_replay_seed.py scripts/test_dossier_notes_v2_assembly_replay_seed.py scripts/dossier_notes_v2_generic_replay.py scripts/test_dossier_notes_v2_generic_replay.py scripts/dossier_notes_v2_writer_preflight.py scripts/test_dossier_notes_v2_writer_preflight.py
          python -m py_compile scripts/dossier_notes_v2_batch_preflight.py scripts/dossier_notes_v2_batch_route.py scripts/dossier_notes_v2_batch_issuer.py scripts/dossier_notes_v2_batch_pilot.py scripts/test_dossier_notes_v2_batch_route.py
          python -m py_compile scripts/dossier_notes_v2_fresh6_preflight.py scripts/test_dossier_notes_v2_fresh6_preflight.py scripts/dossier_research_notes_v2.py scripts/dossier_two_stage_versioned.py scripts/dossier_notes_v2_per_item_receipts.py scripts/dossier_notes_v2_original18_pilot.py scripts/taste_steam_review_dossier_buffered.py scripts/dossier_shadow_research_trial_publish.py scripts/dossier_shadow_research_feasibility.py
          python - <<'PY'
          import json
          for name in ('dossier_notes_v2_batch_policy.json','dossier_notes_v2_fresh6_preparation_contract.json','dossier_research_notes_v2_contract.json','dossier_research_notes_v2.schema.json','dossier_autonomous_assembly_result_v2.schema.json','dossier_notes_v2_item_receipt.schema.json'):
              with open('config/'+name,encoding='utf-8') as f: json.load(f)
          with open('config/dossier_notes_v2_batches/dossier-notes-v2-fresh6-20261111-first.json', encoding='utf-8') as f: batch=json.load(f)
          assert batch['manifest_issued'] is False and batch['production_enabled'] is False
          with open('config/dossier_notes_v2_batches/dossier-notes-v2-fresh6-20261114-rerun1.json', encoding='utf-8') as f: rerun=json.load(f)
          assert rerun['manifest_issued'] is False and rerun['production_enabled'] is False
          assert rerun['provenance'] == batch['provenance']
          assert [c['appid'] for c in rerun['candidates']] == [c['appid'] for c in batch['candidates']]
          assert rerun['trial_id'] != batch['trial_id']
          with open('config/dossier_notes_v2_batches/dossier-notes-v2-fresh6-assembly-rerun2-20261117.json', encoding='utf-8') as f: replay=json.load(f)
          assert replay['manifest_issued'] is False and replay['production_enabled'] is False
          assert replay['provenance'] == rerun['provenance']
          assert [c['appid'] for c in replay['candidates']] == [c['appid'] for c in rerun['candidates']]
          assert replay['replay_source']['trial_id'] == rerun['trial_id']
          c=json.load(open('config/dossier_research_notes_v2_contract.json'))
          assert c['active'] is False and c['authorized_for_semantic_execution'] is False
          assert c['authorized_for_canonical_ingest'] is False and c['production_enabled'] is False
          PY
