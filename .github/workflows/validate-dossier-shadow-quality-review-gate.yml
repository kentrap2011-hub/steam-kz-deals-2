name: Validate inactive Dossier shadow quality review gate (PR only)

on:
  pull_request:
    paths:
      - "scripts/dossier_shadow_quality_review_gate.py"
      - "scripts/test_dossier_shadow_quality_review_gate.py"
      - "reviews/dossier_shadow_quality_review_form.md"
      - "reviews/worker_reports/dossier-shadow-quality-review-gate-01.md"
      - ".github/workflows/validate-dossier-shadow-quality-review-gate.yml"

permissions:
  contents: read

jobs:
  synthetic-isolated-review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing strict V2 dependency
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Compile bounded offline utilities
        run: python -m py_compile scripts/dossier_shadow_quality_review_gate.py scripts/test_dossier_shadow_quality_review_gate.py
      - name: Run isolated source-safe review/adjudicator tests
        run: python -m unittest discover -s scripts -p 'test_dossier_shadow_quality_review_gate.py' -v
      - name: Reuse existing full-history strict writer receipt tests
        run: python -m unittest discover -s scripts -p 'test_dossier_shadow_pilot_preflight.py' -v
      - name: Reuse existing strict three-game shadow comparison tests
        run: python -m unittest discover -s scripts -p 'test_dossier_two_stage_shadow_quality.py' -v
