name: One-shot pre-AI overlay integrity patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-pre-ai-overlay-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind pre-AI integrity to overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_pre_ai_taste_projection.py')
          text = p.read_text(encoding='utf-8')
          changes = [
              (
                  "TASTE_CACHE = Path('data/cache/taste_fit.json')\nOUT = Path('data/production/pre_ai/taste_projection.json')",
                  "TASTE_CACHE = Path('data/cache/taste_fit.json')\nTASTE_OVERLAY = Path('data/cache/taste_fit.entry_overlay.json')\nOUT = Path('data/production/pre_ai/taste_projection.json')"
              ),
              (
                  "    index_source = taste_index.get('source_cache') or {}\n    source_cache_blob_ok = index_source.get('blob_sha') == git_hash_object(TASTE_CACHE)\n    source_attestation_ok = all([\n        index_source.get('entry_count_matches_len_entries') is True,\n        index_source.get('required_entry_fields_complete') is True,\n        index_source.get('entry_count_actual') == len(index_entries),\n    ])",
                  "    index_source = taste_index.get('source_cache') or {}\n    index_overlay = taste_index.get('source_overlay') or {}\n    source_cache_blob_ok = index_source.get('blob_sha') == git_hash_object(TASTE_CACHE)\n    source_overlay_blob_ok = index_overlay.get('blob_sha') == git_hash_object(TASTE_OVERLAY)\n    source_attestation_ok = all([\n        index_source.get('entry_count_matches_len_entries') is True,\n        index_source.get('required_entry_fields_complete') is True,\n        index_overlay.get('entry_count_matches_len_entries') is True,\n        index_overlay.get('required_entry_fields_complete') is True,\n        taste_index.get('merge_policy') == 'overlay_exact_key_wins',\n    ])"
              ),
              (
                  "        source_cache_blob_ok,\n        source_attestation_ok,",
                  "        source_cache_blob_ok,\n        source_overlay_blob_ok,\n        source_attestation_ok,"
              ),
              (
                  "            'index_source_cache_blob_matches': source_cache_blob_ok,\n            'index_source_attestation_ok': source_attestation_ok,",
                  "            'index_source_cache_blob_matches': source_cache_blob_ok,\n            'index_source_overlay_blob_matches': source_overlay_blob_ok,\n            'index_source_attestation_ok': source_attestation_ok,"
              ),
          ]
          for old, new in changes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Patch fragment count={count}: {old[:80]!r}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          print('OVERLAY_INTEGRITY_PATCH=PASS')
          PY
      - name: Targeted empty-overlay equivalence test
        run: |
          python scripts/build_taste_cache_index.py
          python scripts/build_pre_ai_taste_projection.py | tee /tmp/taste.log
          python scripts/build_pre_ai_chatgpt_payload.py | tee /tmp/payload.log
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path('data/cache/taste_fit.entry_index.json').read_text())
          taste=json.loads(Path('data/production/pre_ai/taste_projection.json').read_text())
          manifest=json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text())
          assert idx['source_overlay']['entry_count_actual'] == 0
          assert idx['index_entry_count'] == 583
          assert taste['cache_binding']['index_schema_version'] == 2
          assert taste['cache_binding']['index_integrity_ok'] is True
          assert taste['cache_binding']['index_source_overlay_blob_matches'] is True
          assert taste['safe_cache_hit_count'] == 0
          assert taste['ai_required_count'] == 619
          assert manifest['ai_queue_count'] == 557
          assert manifest['deterministically_excluded_without_ai_count'] == 62
          assert manifest['mandatory_sale_end_coverage'] == 1.0
          print('EMPTY_OVERLAY_EQUIVALENCE=PASS')
          PY
      - name: Commit source patch only
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add scripts/build_pre_ai_taste_projection.py
          git diff --cached --check
          git commit -m "Bind pre-AI taste index to incremental overlay"
          git push origin HEAD:main
