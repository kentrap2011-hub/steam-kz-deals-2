name: One-shot taste description fallback production patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-taste-description-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch taste projection source only
        run: python scripts/patch_taste_description_fallback_once.py

      - name: Rebuild context-aware taste projection and consumer
        run: |
          python scripts/build_taste_cache_index.py
          python scripts/build_pre_ai_taste_projection.py
          python scripts/build_pre_ai_chatgpt_payload.py

      - name: Prove full semantic-context coverage without regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          TARGET = 'App_1042490'
          EXPECTED_CONTEXT = 'e8bf2cef4e4b24b583016b2594a4961f2e275edf56e8b847210a65692998b74f'
          SEQUENTIAL_CONTROL_SECONDS = 6.039

          projection = json.loads(Path('data/production/pre_ai/taste_projection.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text(encoding='utf-8'))
          queue = [json.loads(line) for line in Path('data/production/pre_ai/chatgpt_taste_queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          context = projection['candidate_context']
          target = projection['entries'][TARGET]

          forbidden = ['price','discount_percent','reviews','wishlist','history','deal_if_strong','deal_if_moderate']
          checks = {
              'direct_585': context['direct_storebrowse_description_known_count'] == 585,
              'appdetails_requested_31': context['appdetails_fallback_requested_count'] == 31,
              'appdetails_success_31': context['appdetails_fallback_success_count'] == 31,
              'appdetails_failures_0': context['appdetails_fallback_failure_count'] == 0,
              'bundle_fallback_3': context['bundle_description_fallback_count'] == 3,
              'all_619_have_context': context['description_known_count'] == 619 and context['description_missing_count'] == 0 and context['description_coverage'] == 1.0,
              'concurrent_faster_than_sequential_control': context['appdetails_fallback_wall_seconds'] < SEQUENTIAL_CONTROL_SECONDS,
              'call_of_sea_context_unchanged': target['candidate_context_sha256'] == EXPECTED_CONTEXT,
              'call_of_sea_still_cache_hit': target['status'] == 'cache_hit',
              'safe_hit_unchanged': projection['safe_cache_hit_count'] == 1,
              'ai_required_unchanged': projection['ai_required_count'] == 618,
              'queue_unchanged': manifest['ai_queue_count'] == 556 and len(queue) == 556,
              'ready_unchanged': manifest['ready_without_ai_count'] == 1,
              'excludes_unchanged': manifest['deterministically_excluded_without_ai_count'] == 62,
              'sale_end_unchanged': manifest['mandatory_sale_end_coverage'] == 1.0,
              'queue_all_have_description': all(bool(row.get('short_description')) for row in queue),
              'queue_still_price_blind': all(not any(field in row for field in forbidden) for row in queue),
          }
          failed = [name for name, ok in checks.items() if not ok]
          print(json.dumps({
              'checks': checks,
              'candidate_context': context,
              'safe_cache_hit_count': projection['safe_cache_hit_count'],
              'ai_required_count': projection['ai_required_count'],
              'ai_queue_count': manifest['ai_queue_count'],
              'ready_without_ai_count': manifest['ready_without_ai_count'],
          }, ensure_ascii=False, indent=2))
          if failed:
              raise SystemExit(f'Taste description fallback targeted proof failed: {failed}')
          print('TASTE_DESCRIPTION_FALLBACK_TARGETED=PASS')
          PY

      - name: Commit source patch only
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git restore data/cache/taste_fit.entry_index.json data/production/pre_ai || true
          git add scripts/build_pre_ai_taste_projection.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "scripts/build_pre_ai_taste_projection.py"
          git commit -m "Fill missing taste descriptions deterministically"
          git push origin HEAD:main
