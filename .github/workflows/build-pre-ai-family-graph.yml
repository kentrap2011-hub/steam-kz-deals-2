name: Build pre-AI family graph

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build pre-AI content rules"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "config/offer_family_contract.json"
      - "data/production/pre_ai/store_snapshot.json"
      - "data/production/pre_ai/content_metadata.json"
      - "data/production/pre_ai/content_rules.json"
      - "scripts/build_pre_ai_family_graph.py"
      - ".github/workflows/build-pre-ai-family-graph.yml"

permissions:
  contents: write

concurrency:
  group: pre-ai-family-graph
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build purchase-family graph before AI
        run: python scripts/build_pre_ai_family_graph.py
      - name: Commit pre-AI family graph
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/production/pre_ai/family_graph.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh pre-AI family graph"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
