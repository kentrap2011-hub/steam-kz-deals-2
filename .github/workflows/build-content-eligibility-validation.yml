name: Build content eligibility validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - "config/content_eligibility_contract.json"
      - "data/production/mailing/**"
      - "data/cache/taste_fit.index.json"
      - "data/cache/taste_fit.checkpoint_validation.json"
      - "data/cache/content_metadata.json"
      - ".github/workflows/build-content-eligibility-validation.yml"

permissions:
  contents: write

concurrency:
  group: content-eligibility-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify all current taste includes for content eligibility
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from collections import Counter
          from pathlib import Path

          POLICY = Path('config/mailing_policy.json')
          CONTRACT = Path('config/content_eligibility_contract.json')
          MAILING = Path('data/production/mailing/index.json')
          TASTE = Path('data/cache/taste_fit.index.json')
          CHECKPOINT = Path('data/cache/taste_fit.checkpoint_validation.json')
          METADATA = Path('data/cache/content_metadata.json')
          OUT = Path('data/cache/content_eligibility.validation.json')

          def sha(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()

          def tree_sha(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()

          policy = json.loads(POLICY.read_text(encoding='utf-8'))
          contract = json.loads(CONTRACT.read_text(encoding='utf-8'))
          mailing = json.loads(MAILING.read_text(encoding='utf-8'))
          taste = json.loads(TASTE.read_text(encoding='utf-8'))
          checkpoint = json.loads(CHECKPOINT.read_text(encoding='utf-8'))
          metadata = json.loads(METADATA.read_text(encoding='utf-8'))

          if policy.get('status') != 'canonical':
              raise SystemExit('Policy is not canonical')
          if contract.get('contract') != 'CONTENT-ELIGIBILITY-V1':
              raise SystemExit('Unexpected content eligibility contract')
          if checkpoint.get('status') != 'complete' or checkpoint.get('checkpoint_complete') is not True:
              raise SystemExit('Mandatory taste checkpoint is not complete')

          current_mailing_tree = tree_sha('data/production/mailing')
          current_taste_index_sha = sha('data/cache/taste_fit.index.json')
          if metadata.get('mailing_tree_sha') != current_mailing_tree:
              raise SystemExit('Content metadata is stale versus current mailing tree')
          if metadata.get('taste_index_blob_sha') != current_taste_index_sha:
              raise SystemExit('Content metadata is stale versus current taste index')

          taste_entries = taste.get('entries')
          metadata_entries = metadata.get('entries')
          if not isinstance(taste_entries, dict) or not isinstance(metadata_entries, dict):
              raise SystemExit('Taste or metadata entries malformed')

          cols = mailing['columns']
          ci = {name:i for i,name in enumerate(cols)}
          feed = {}
          for n in range(1, int(mailing['chunk_count']) + 1):
              path = Path(mailing['chunk_pattern'].replace('NNN', f'{n:03d}'))
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  cells = line.split('\t')
                  if len(cells) != len(cols):
                      raise SystemExit(f'Column mismatch in {path}')
                  key = cells[ci['key']]
                  feed[key] = {
                      'key': key,
                      'appid': cells[ci['appid']],
                      'title': cells[ci['title']],
                      'feed_reasons': cells[ci['reasons']].split('|') if cells[ci['reasons']] else [],
                      'fit_tags': cells[ci['fit_tags']].split('|') if cells[ci['fit_tags']] else [],
                  }

          include_keys = {key for key,value in taste_entries.items() if isinstance(value,list) and len(value)==5 and value[2]=='INCLUDE'}
          include_appids = {
              feed[key]['appid'] for key in include_keys
              if key in feed and key.startswith('App_') and feed[key]['appid']
          }

          if metadata.get('required_include_count') != len(include_keys):
              raise SystemExit('Metadata required_include_count mismatch')
          if metadata.get('entry_count') != len(metadata_entries):
              raise SystemExit('Metadata entry_count mismatch')
          if set(metadata_entries) != include_keys:
              raise SystemExit('Metadata does not cover exactly the current taste includes')

          patterns = contract['obvious_non_game_title_patterns']
          obvious_extra_re = re.compile('|'.join(re.escape(p) for p in patterns), re.I)

          eligible = []
          excluded = []
          unresolved = []
          disposition_counts = Counter()

          for key in sorted(include_keys):
              row = feed.get(key)
              meta = metadata_entries.get(key)
              if row is None or meta is None:
                  unresolved.append({'key':key,'reason':'missing_feed_or_metadata'})
                  continue

              title = (meta.get('store_name') or row['title'] or '').strip()
              entity_kind = meta.get('entity_kind')
              app_type = meta.get('app_type')

              if obvious_extra_re.search(title):
                  excluded.append({
                      'key': key,
                      'appid': row['appid'],
                      'title': title,
                      'canonical_reason_code': 'not_a_game_or_not_relevant_game_content',
                      'disposition': 'obvious_non_game_addon'
                  })
                  disposition_counts['excluded_obvious_non_game_addon'] += 1
                  continue

              if entity_kind == 'sub':
                  package_apps = meta.get('package_apps') or []
                  package_appids = {
                      str(app.get('appid')) for app in package_apps
                      if isinstance(app, dict) and app.get('appid') is not None
                  }
                  representative_appid = str(row.get('appid') or '')
                  same_run_base = (
                      representative_appid in include_appids
                      or bool(package_appids & include_appids)
                  )
                  if same_run_base:
                      eligible.append({
                          'key': key,
                          'appid': row['appid'],
                          'title': title,
                          'disposition': 'purchase_variant_for_included_family',
                          'related_included_appids': sorted(package_appids & include_appids)
                      })
                      disposition_counts['eligible_purchase_variant'] += 1
                  else:
                      unresolved.append({
                          'key': key,
                          'appid': row['appid'],
                          'title': title,
                          'entity_kind': entity_kind,
                          'reason': 'package_without_same_run_taste_include_base',
                          'package_appids': sorted(package_appids)
                      })
                      disposition_counts['unresolved_package'] += 1
                  continue

              if entity_kind != 'app':
                  unresolved.append({
                      'key': key,
                      'appid': row['appid'],
                      'title': title,
                      'entity_kind': entity_kind,
                      'reason': 'unknown_entity_kind'
                  })
                  disposition_counts['unresolved_unknown_entity'] += 1
                  continue

              if app_type == 'game':
                  eligible.append({
                      'key': key,
                      'appid': row['appid'],
                      'title': title,
                      'disposition': 'game'
                  })
                  disposition_counts['eligible_game'] += 1
                  continue

              if app_type == 'dlc':
                  base_appid = str(meta.get('fullgame_appid') or '')
                  base_name = meta.get('fullgame_name')
                  if base_appid and base_appid in include_appids:
                      eligible.append({
                          'key': key,
                          'appid': row['appid'],
                          'title': title,
                          'disposition': 'addon_with_same_run_included_base',
                          'base_appid': base_appid,
                          'base_name': base_name
                      })
                      disposition_counts['eligible_addon_same_run_base'] += 1
                  else:
                      unresolved.append({
                          'key': key,
                          'appid': row['appid'],
                          'title': title,
                          'entity_kind': entity_kind,
                          'app_type': app_type,
                          'base_appid': base_appid or None,
                          'base_name': base_name,
                          'reason': 'dlc_base_not_included_needs_profile_support_check'
                      })
                      disposition_counts['unresolved_dlc_profile_support'] += 1
                  continue

              unresolved.append({
                  'key': key,
                  'appid': row['appid'],
                  'title': title,
                  'entity_kind': entity_kind,
                  'app_type': app_type,
                  'reason': 'unknown_or_unsupported_app_type'
              })
              disposition_counts['unresolved_app_type'] += 1

          processed = len(include_keys)
          classified = len(eligible) + len(excluded) + len(unresolved)
          if classified != processed:
              raise SystemExit(f'Internal classification coverage mismatch: {classified} != {processed}')

          valid_exclusion_codes = set(policy['personal_filter']['valid_exclusion_reason_codes'])
          invalid_exclusion_codes = sorted({
              item['canonical_reason_code'] for item in excluded
              if item['canonical_reason_code'] not in valid_exclusion_codes
          })

          complete = (
              classified == processed
              and len(unresolved) == 0
              and not invalid_exclusion_codes
          )

          result = {
              'schema_version': 1,
              'purpose': 'content_eligibility_validation',
              'status': 'complete' if complete else 'needs_profile_resolution',
              'bindings': {
                  'policy_blob_sha': sha('config/mailing_policy.json'),
                  'content_contract_blob_sha': sha('config/content_eligibility_contract.json'),
                  'mailing_tree_sha': current_mailing_tree,
                  'taste_index_blob_sha': current_taste_index_sha,
                  'checkpoint_validation_blob_sha': sha('data/cache/taste_fit.checkpoint_validation.json'),
                  'content_metadata_blob_sha': sha('data/cache/content_metadata.json'),
                  'profile_blob_sha': taste.get('profile_blob_sha'),
                  'taste_model_version': taste.get('taste_model_version')
              },
              'input_taste_include_count': processed,
              'eligible_count': len(eligible),
              'excluded_count': len(excluded),
              'unresolved_count': len(unresolved),
              'classified_count': classified,
              'complete_coverage': classified == processed,
              'invalid_exclusion_code_count': len(invalid_exclusion_codes),
              'disposition_counts': dict(sorted(disposition_counts.items())),
              'eligible': eligible,
              'excluded': excluded,
              'unresolved': unresolved,
          }

          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'status': result['status'],
              'input': processed,
              'eligible': len(eligible),
              'excluded': len(excluded),
              'unresolved': len(unresolved),
              'dispositions': result['disposition_counts']
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit validation artifact
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/content_eligibility.validation.json
          if git diff --cached --quiet; then
            echo "Content eligibility validation already current"
            exit 0
          fi
          git commit -m "Rebuild content eligibility validation"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
