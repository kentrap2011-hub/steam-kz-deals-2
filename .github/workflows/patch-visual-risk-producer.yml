name: One-shot visual risk producer upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-visual-risk-producer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade only the existing risk fallback block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_visual_feed_v2.py')
          text = path.read_text(encoding='utf-8')

          old = """    if not risks and any(k in text for k in ['craft', 'farming', 'management', 'production chains', 'survival simulation']):
              risks.append('Есть заметная доля менеджмента или сбора ресурсов; если рутина начнёт доминировать над новыми ситуациями, игра может утомить.')
          if not risks and ('sandbox' in text or ('open world' in text and not any(k in text for k in ['mystery', 'quest', 'mission', 'objective']))):
              risks.append('Есть риск недостатка направления: тебе открытый мир лучше заходит, когда в нём постоянно понятны причины что-то исследовать или делать.')
          if not risks and release_date:
              m = re.search(r'(19|20)\\d{2}', str(release_date))
              if m and int(m.group(0)) <= 2011:
                  risks.append('Возраст игры может ощущаться в управлении и интерфейсе сильнее, чем в современных проектах.')
          if not risks:
              risks.append('Явный конфликт с твоим профилем пока не подтверждён; этот риск нужно уточнить при более подробном разборе игры, а не выдумывать его.')
          return risks[:2]
          """
          old = old.replace('          ', '', 1)
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'

          new = """    if not risks and any(k in text for k in ['craft', 'crafting', 'farming', 'management', 'city builder', 'city-building', 'tycoon', 'production chains', 'survival simulation']):
              risks.append('Есть заметный слой менеджмента, ресурсов или повторяющихся хозяйственных действий; если рутина начнёт доминировать над новыми ситуациями, игра может утомить.')
          if not risks and any(k in text for k in ['real time strategy', 'real-time strategy', 'rts', 'grand strategy', '4x', 'strategy']):
              risks.append('Стратегический слой может требовать много планирования и микроконтроля; если темп станет слишком системным и однообразным, это может утомить сильнее, чем более непосредственный геймплей.')
          if not risks and any(k in text for k in ['turn-based', 'turn based']):
              risks.append('Пошаговый темп может ощущаться медленнее привычного тебе активного геймплея, особенно если похожие бои начнут повторяться.')
          if not risks and any(k in text for k in ['metroidvania', 'backtracking', 'backtrack']):
              risks.append('Структура предполагает возвращение в уже знакомые зоны после получения новых возможностей; если бэктрекинга окажется много, повторение может утомить.')
          if not risks and any(k in text for k in ['stealth']):
              risks.append('Стелс может превращаться в ожидание и повторные попытки после ошибки; это станет минусом, если повторов будет больше, чем новых ситуаций.')
          if not risks and any(k in text for k in ['platformer', 'platforming']):
              risks.append('Платформинг может потребовать повторных попыток на одних и тех же участках; это станет минусом, если повторы начнут перевешивать ощущение движения и прогресса.')
          if not risks and any(k in text for k in ['puzzle', 'puzzler']):
              risks.append('Головоломки могут заметно тормозить темп, если игра надолго оставляет без понятного следующего шага; ты хуже переносишь загадку, когда она превращается в потерянность.')
          if not risks and any(k in text for k in ['detective', 'investigation', 'mystery']):
              risks.append('Расследование может включать много разговоров и повторного обхода знакомых мест; если продвижение между важными открытиями станет редким, темп может просесть.')
          if not risks and ('sandbox' in text or 'open world' in text or 'exploration' in text):
              risks.append('Исследование может растянуться или потерять направление; тебе открытый мир лучше заходит, когда постоянно есть понятные причины идти в новую точку.')
          if not risks and release_date:
              m = re.search(r'(19|20)\\d{2}', str(release_date))
              if m and int(m.group(0)) <= 2011:
                  risks.append('Возраст игры может ощущаться в управлении и интерфейсе сильнее, чем в современных проектах.')
          if not risks:
              risks.append('По доступным подтверждённым данным конкретный персональный минус не выявлен; лучше оставить честную неопределённость, чем приписывать игре несуществующий недостаток.')
          return risks[:2]
          """
          new = new.replace('          ', '', 1)
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old risk fallback block, found={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('VISUAL_RISK_PRODUCER_PATCH=PASS')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/build_visual_feed_v2.py

      - name: Commit producer upgrade
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add scripts/build_visual_feed_v2.py
          git diff --cached --check
          git commit -m "Improve concrete visual risk derivation"
          git push origin HEAD:main
