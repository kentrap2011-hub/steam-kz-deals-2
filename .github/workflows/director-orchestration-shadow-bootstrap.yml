name: Director orchestration shadow bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/director-orchestration-shadow-bootstrap.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch shadow observer through workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/director-orchestration-shadow.yml/dispatches" \
            --data '{"ref":"main"}'
