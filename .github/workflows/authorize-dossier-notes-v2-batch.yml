name: Authorize one batch Dossier Notes V2 sandbox semantic pilot (manual only)
run-name: Authorize isolated Notes V2 batch ${{ inputs.trial_id }} marker ${{ inputs.marker_commit }}

# Not triggered by push, pull_request, schedule, or source PR CI.
# Must run from merged main, by authenticated first-attempt repository OWNER.
on:
  workflow_dispatch:
    inputs:
      trial_id:
        description: "GitHub-approved immutable Notes V2 batch identity"
        required: true
        type: string
      expected_main_sha:
        description: "Exact current main SHA; recheck before manual dispatch"
        required: true
        type: string
      marker_commit:
        description: "Exact marker HEAD of NEW batch sandbox, from freeze result"
        required: true
        type: string
      confirmation:
        description: "Explicit one-use owner confirmation: AUTHORIZE_DOSSIER_NOTES_V2_BATCH_ONCE:<trial_id>"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dossier-notes-v2-batch-frozen-authorization-only
  cancel-in-progress: false

jobs:
  issue-exact-batch-sandbox-only:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.actor_id == 315790060 && github.repository_owner_id == 315790060
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Freeze or authorize only the exact batch immutable GitHub source
        env:
          TRIAL_ID: ${{ inputs.trial_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          MARKER_COMMIT: ${{ inputs.marker_commit }}
          EXPLICIT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python scripts/dossier_notes_v2_batch_issuer.py authorize \
            --trial-id "$TRIAL_ID" \
            --expected-main-sha "$EXPECTED_MAIN_SHA" \
            --marker-commit "$MARKER_COMMIT" \
            --confirmation "$EXPLICIT_CONFIRMATION"
      - name: Assert no untracked local issuer residue
        run: test -z "$(git status --porcelain --untracked-files=all)"
