name: Worker append dossier persistence bridge completion marker

on:
  push:
    branches:
      - worker/taste-steam-review-dossier-persistence-bridge-01-report
    paths:
      - .github/workflows/_worker_append_dossier_persistence_bridge_current_task.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/taste-steam-review-dossier-persistence-bridge-01-report
          fetch-depth: 0
      - name: Append completed worker handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CURRENT_TASK.md')
          text = p.read_text(encoding='utf-8')
          marker = '### Завершено — Taste Steam review dossier persistence bridge 01'
          if marker not in text:
              block = '''\n\n### Завершено — Taste Steam review dossier persistence bridge 01\nСтатус: `complete_ready_for_user_run_now_validation`.\n- worker task: `WORKER_TASK_TASTE_STEAM_REVIEW_DOSSIER_PERSISTENCE_BRIDGE_01.md`;\n- submission transport: connected GitHub Contents create-file to `data/ai_inbox/taste_steam_review_dossiers/{snapshot_id}--{scope_sha256}.json`;\n- GitHub Actions owns validation, canonical dossier persistence, same-snapshot progress and completeness;\n- implementation PR #21, merge `8916348d651afbdeaa13ba71e517bd2a967ce777`;\n- focused validation `34804961025` / `103854918217`: success;\n- hosted synthetic 25-item create-file acceptance: `34805024999`, `34805127448`, `34805164824`, same snapshot `10→10→5→0`;\n- no production Run now and no real 591-item backlog processing;\n- no Taste Semantic Producer / `ingest-taste-batch.yml` scheduling, limit, queue or state changes;\n- durable report: `reviews/worker_reports/taste-steam-review-dossier-persistence-bridge-01.md`;\n- next boundary: Director reads durable report; then user manually presses Run now on existing Taste Steam Review Dossier once and validates.\n'''
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add CURRENT_TASK.md
          if ! git diff --cached --quiet; then
            git commit -m "Mark dossier persistence bridge complete"
            git push origin HEAD:worker/taste-steam-review-dossier-persistence-bridge-01-report
          fi
