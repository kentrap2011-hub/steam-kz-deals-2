name: Migrate still-current audited taste decisions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-audited-batch50-overlap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-audited-taste-overlap
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build inbox batch only from still-identical audited rows
        run: |
          python - <<'PY'
          import ast
          import json
          import subprocess
          from pathlib import Path

          AUDIT_COMMIT = '531eb6d3f6f760316544322df20e5a38bb395a22'
          WORKFLOW = '.github/workflows/diagnostic-ai-batch50-dry-run.yml'
          QUEUE = 'data/production/pre_ai/chatgpt_taste_queue.jsonl'
          PROJECTION = 'data/production/pre_ai/taste_projection.json'
          OUT = Path('data/ai_inbox/taste/audited_batch50_overlap_531eb6d.json')

          def git_show(path):
              return subprocess.check_output(['git', 'show', f'{AUDIT_COMMIT}:{path}'], text=True)

          audited_workflow = git_show(WORKFLOW)
          marker_start = '          D={'
          marker_end = '\n\n          keys='
          start = audited_workflow.index(marker_start) + len('          D=')
          end = audited_workflow.index(marker_end, start)
          decisions = ast.literal_eval(audited_workflow[start:end])

          old_queue = [json.loads(line) for line in git_show(QUEUE).splitlines() if line.strip()][:50]
          if set(decisions) != {row['taste_subject_key'] for row in old_queue}:
              raise SystemExit('Audited decision map no longer matches the exact audited 50-row queue')

          old_projection = json.loads(git_show(PROJECTION))
          current_projection = json.loads(Path(PROJECTION).read_text(encoding='utf-8'))
          binding_checks = [
              ('profile_blob_sha', old_projection['current_profile']['blob_sha'], current_projection['current_profile']['blob_sha']),
              ('taste_model_version', old_projection['current_binding']['taste_model_version'], current_projection['current_binding']['taste_model_version']),
              ('taste_semantics_sha256', old_projection['current_binding']['taste_semantics_sha256'], current_projection['current_binding']['taste_semantics_sha256']),
          ]
          mismatches = [name for name, old, new in binding_checks if old != new]
          if mismatches:
              raise SystemExit(f'Audited semantic binding changed; refusing migration: {mismatches}')

          current_queue = [json.loads(line) for line in Path(QUEUE).read_text(encoding='utf-8').splitlines() if line.strip()]
          current_by_key = {row['taste_subject_key']: row for row in current_queue}
          old_by_key = {row['taste_subject_key']: row for row in old_queue}

          results = []
          skipped_changed = []
          for key, old_row in old_by_key.items():
              row = current_by_key.get(key)
              if row is None:
                  continue
              if 'evaluate_taste_fit' not in (row.get('work_required') or []):
                  continue
              if row.get('taste_fingerprint') != old_row.get('taste_fingerprint') or row.get('candidate_context_sha256') != old_row.get('candidate_context_sha256'):
                  skipped_changed.append(key)
                  continue
              verdict, fit, reason, positive, negative = decisions[key]
              results.append({
                  'key': key,
                  'appid': row['appid'],
                  'taste_fingerprint': row['taste_fingerprint'],
                  'candidate_context_sha256': row['candidate_context_sha256'],
                  'verdict': verdict,
                  'fit_level': fit,
                  'reason_code': reason,
                  'positive_evidence': positive,
                  'negative_evidence': negative,
              })

          print(json.dumps({
              'audited_count': len(old_queue),
              'still_current_identical_count': len(results),
              'changed_context_skipped_count': len(skipped_changed),
              'changed_context_skipped': skipped_changed,
          }, ensure_ascii=False, indent=2))

          if not results:
              raise SystemExit('No still-current identical audited rows to migrate')

          bindings = {
              'profile_blob_sha': current_projection['current_profile']['blob_sha'],
              'taste_model_version': current_projection['current_binding']['taste_model_version'],
              'taste_semantics_sha256': current_projection['current_binding']['taste_semantics_sha256'],
              'source_mailing_updated_at_utc': current_projection['source_mailing_updated_at_utc'],
          }
          doc = {'schema_version': 1, 'bindings': bindings, 'results': results}
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate against current queue before publishing inbox
        run: python scripts/ingest_taste_results.py --input data/ai_inbox/taste/audited_batch50_overlap_531eb6d.json --dry-run

      - name: Commit inbox batch
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/ai_inbox/taste/audited_batch50_overlap_531eb6d.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No inbox change to publish"
            exit 0
          fi
          git commit -m "Queue still-current audited taste decisions"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
