name: TEMP validate Taste current-main canary implementation

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_taste_current_main_canary.py"
      - "tests/test_taste_current_main_canary.py"
      - ".github/workflows/taste-current-main-canary.yml"
      - ".github/workflows/taste-current-main-canary-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main read-only
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Establish exact current-main provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$HEAD_SHA" = "$MAIN_SHA" || { echo "HEAD is not current origin/main" >&2; exit 2; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo "checkout is dirty" >&2; exit 2; }
          echo "VALIDATION_MAIN_SHA=$HEAD_SHA"

      - name: Run focused canary tests
        run: python -m unittest tests.test_taste_current_main_canary -v

      - name: Preparation-only validation for Chernobylite AppID 1016800
        shell: bash
        run: |
          set -euo pipefail
          START="$(python - <<'PY'
          import time
          print(time.monotonic())
          PY
          )"
          python scripts/build_taste_current_main_canary.py \
            --appid 1016800 \
            --output-dir "$RUNNER_TEMP/taste-current-main-canary-validation"
          END="$(python - <<'PY'
          import time
          print(time.monotonic())
          PY
          )"
          python - "$START" "$END" <<'PY'
          import sys
          print(f"VALIDATION_WALL_SECONDS={float(sys.argv[2]) - float(sys.argv[1]):.3f}")
          PY

      - name: Prove no repository or production writes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo "repository mutated" >&2; exit 2; }

      - name: Upload temporary proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: taste-current-main-canary-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/taste-current-main-canary-validation/main_provenance.json
            ${{ runner.temp }}/taste-current-main-canary-validation/taste_projection.one.json
            ${{ runner.temp }}/taste-current-main-canary-validation/chatgpt_payload.one.json
            ${{ runner.temp }}/taste-current-main-canary-validation/chatgpt_taste_queue.one.jsonl
            ${{ runner.temp }}/taste-current-main-canary-validation/canary_proof.json
          if-no-files-found: error
          retention-days: 2
