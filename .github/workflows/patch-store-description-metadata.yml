name: One-shot Store description metadata patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-store-description-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch Store metadata source
        run: python scripts/patch_store_description_metadata_once.py
      - name: Build Store metadata
        run: python scripts/build_pre_ai_store_snapshot.py
      - name: Check measured description coverage
        run: >-
          python -c "import json; from pathlib import Path; d=json.loads(Path('data/production/pre_ai/content_metadata.json').read_text()); e=d['entries']; a=[x for x in e.values() if x.get('entity_kind')=='app']; s=[x for x in e.values() if x.get('entity_kind')=='sub']; ak=sum(bool(x.get('short_description')) for x in a); c=d['control_comparison']; print({'entries':len(e),'app_description_known':ak,'sub_description_known':sum(bool(x.get('short_description')) for x in s),'control_match':c.get('match_count'),'control_mismatch':c.get('mismatch_count')}); assert len(e)==657; assert ak==614; assert c.get('match_count')==91 and c.get('mismatch_count')==0; print('STORE_DESCRIPTION_METADATA_TARGETED=PASS')"
      - name: Commit source patch only
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git restore data/production/pre_ai || true
          git add scripts/build_pre_ai_store_snapshot.py
          git diff --cached --check
          git commit -m "Preserve Store short descriptions in pre-AI metadata"
          git push origin HEAD:main
