name: One-shot SteamDB automation diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-steamdb-access.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe SteamDB public page access
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, time
          targets=[
            ('App_1042490','https://steamdb.info/app/1042490/'),
            ('App_978300','https://steamdb.info/app/978300/'),
            ('Sub_648168','https://steamdb.info/sub/648168/'),
          ]
          out=[]
          for key,url in targets:
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml',
                  'Accept-Language':'en-US,en;q=0.9',
              })
              try:
                  t=time.monotonic()
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode('utf-8','replace')
                      out.append({'key':key,'status':r.status,'bytes':len(body),'elapsed':round(time.monotonic()-t,3),'has_lowest_recorded':'Lowest Recorded Price' in body,'has_kz':'Kazakhstan' in body or 'KZT' in body,'title':re.search(r'<title>(.*?)</title>',body,re.I|re.S).group(1)[:120] if re.search(r'<title>(.*?)</title>',body,re.I|re.S) else None})
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  out.append({'key':key,'status':e.code,'bytes':len(body),'error':'HTTPError','body_prefix':body[:160]})
              except Exception as e:
                  out.append({'key':key,'error':type(e).__name__+': '+str(e)})
          print('STEAMDB_ACCESS_DIAGNOSTIC='+json.dumps(out,ensure_ascii=False))
          PY
