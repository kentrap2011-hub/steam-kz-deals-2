name: Validate site publication resilience

on:
  pull_request:
    paths:
      - "config/site_publication_resilience_contract.json"
      - "config/execution_ownership_contract.json"
      - "config/progressive_personalization_contract.json"
      - "scripts/site_publication_resilience.py"
      - "scripts/isolate_site_publication_defects.py"
      - "scripts/build_site_status.py"
      - "scripts/test_site_publication_resilience.py"
      - "scripts/giveaway_visual_handoff.py"
      - "scripts/test_giveaway_visual_handoff.py"
      - "scripts/grounded_negative_visual.py"
      - "scripts/validate_card_explanations.py"
      - "scripts/validate_russian_descriptions.py"
      - "scripts/progressive_personalization.py"
      - "scripts/build_final_visual_payload.py"
      - "web/app.js"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - ".github/workflows/build-site-current-status.yml"
      - ".github/workflows/build-daily-visual-payload.yml"
      - ".github/workflows/deploy-visual.yml"
      - ".github/workflows/validate-site-publication-resilience.yml"
  push:
    branches: [main]
    paths:
      - "config/site_publication_resilience_contract.json"
      - "scripts/site_publication_resilience.py"
      - "scripts/isolate_site_publication_defects.py"
      - "scripts/build_site_status.py"
      - "scripts/test_site_publication_resilience.py"
      - "web/app.js"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - ".github/workflows/validate-site-publication-resilience.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile site publication runtime
        run: |
          python -m py_compile             scripts/site_publication_resilience.py             scripts/isolate_site_publication_defects.py             scripts/build_site_status.py

      - name: Validate publication resilience
        run: |
          set -euo pipefail
          python scripts/validate_execution_ownership.py
          python scripts/test_site_publication_resilience.py
          python scripts/test_giveaway_visual_handoff.py
          python scripts/test_progressive_personalization.py
          node web/progressive-personalization-ui.test.js

      - name: Validate current canonical status projection
        run: |
          set -euo pipefail
          python scripts/build_site_status.py
          python scripts/build_site_status.py --validate-current data/production/site/current_status.json
