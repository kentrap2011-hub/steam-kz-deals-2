name: One-shot exact game taste evidence diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-exact-game-taste-evidence.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure exact canonical-profile game evidence
        run: |
          python - <<'PY'
          import json
          import unicodedata
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          def norm(s):
              return unicodedata.normalize('NFKC', str(s)).casefold().strip()

          payload = json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text(encoding='utf-8'))
          old_cache = json.loads(Path('data/cache/taste_fit.json').read_text(encoding='utf-8'))['entries']

          req = urllib.request.Request(
              'https://raw.githubusercontent.com/kentrap2011-hub/stopgame-ratings-data/main/gaming_taste_live.json',
              headers={'User-Agent':'steam-kz-deals/1.0'},
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              profile = json.loads(resp.read().decode('utf-8'))

          cards = profile.get('stopgame_cards') or []
          by_title = defaultdict(list)
          for card in cards:
              by_title[norm(card.get('title',''))].append(card)
          duplicates = {k: [x.get('title') for x in v] for k,v in by_title.items() if len(v) > 1}

          queue = payload.get('ai_queue') or []
          exact = []
          for row in queue:
              subject = row['taste_subject']
              cards_here = by_title.get(norm(subject['title']), [])
              if len(cards_here) != 1:
                  continue
              card = cards_here[0]
              cached = old_cache.get(subject['key'])
              exact.append({
                  'key': subject['key'],
                  'title': subject['title'],
                  'rating': card.get('rating'),
                  'evidence_type': card.get('evidence_type'),
                  'discussion_confidence': card.get('discussion_confidence'),
                  'old_cache_verdict': None if cached is None else cached.get('verdict'),
                  'old_cache_fit': None if cached is None else cached.get('fit_level'),
                  'old_cache_reason': None if cached is None else cached.get('reason_code'),
              })

          rating_counts = Counter(str(x['rating']) for x in exact)
          cross = Counter(f"{x['rating']}->{x['old_cache_verdict']}:{x['old_cache_fit']}" for x in exact if x['old_cache_verdict'])
          no_old = [x for x in exact if not x['old_cache_verdict']]
          conflicts = defaultdict(set)
          for x in exact:
              if x['old_cache_verdict']:
                  conflicts[str(x['rating'])].add((x['old_cache_verdict'], x['old_cache_fit']))

          print(json.dumps({
              'ai_queue_count': len(queue),
              'profile_stopgame_card_count': len(cards),
              'duplicate_normalized_profile_titles_count': len(duplicates),
              'exact_title_match_count': len(exact),
              'exact_match_rating_counts': dict(sorted(rating_counts.items())),
              'exact_match_old_cache_cross_counts': dict(sorted(cross.items())),
              'ratings_with_multiple_old_outcomes': {
                  rating: sorted([f'{v}:{f}' for v,f in outcomes])
                  for rating,outcomes in conflicts.items() if len(outcomes) > 1
              },
              'exact_matches_without_old_cache_count': len(no_old),
              'exact_matches_without_old_cache': no_old[:30],
              'exact_matches': exact,
          }, ensure_ascii=False, indent=2))
          PY
