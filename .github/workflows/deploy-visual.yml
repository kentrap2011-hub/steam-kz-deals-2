name: Deploy visual mailing

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_visual_feed_v2.py'
      - 'data/production/pre_ai/chatgpt_purchase_context.jsonl'
      - 'data/production/pre_ai/store_snapshot.json'
      - 'data/production/pre_ai/family_graph.json'
      - 'data/production/pre_ai/history_snapshot.json'
      - 'data/production/pre_ai/chatgpt_payload.json'
      - 'data/cache/taste_fit.json'
      - '.github/workflows/deploy-visual.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current visual feed
        run: python scripts/build_visual_feed_v2.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
