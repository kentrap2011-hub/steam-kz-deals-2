name: Deploy visual mailing

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build daily visual payload"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/production/visual/current.json'
      - '.github/workflows/deploy-visual.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run UI regressions
        shell: bash
        run: |
          set -euo pipefail
          node web/image-swipe-sync.test.js
          node web/package-deal-ui.test.js

      - name: Stage precomputed visual payload
        shell: bash
        run: |
          set -euo pipefail
          test -s data/production/visual/current.json
          grep -q '"mode":"daily_precomputed_read_only_for_ui"' data/production/visual/current.json
          mkdir -p web/data
          cp data/production/visual/current.json web/data/current.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
