name: Deploy visual mailing

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build daily visual payload"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/production/visual/current.json'
      - 'scripts/russian_description_quality.py'
      - 'scripts/validate_russian_descriptions.py'
      - 'scripts/validate_giveaway_visual_payload.py'
      - 'scripts/visual_freshness_receipt.py'
      - 'scripts/test_visual_freshness_receipt.py'
      - '.github/workflows/deploy-visual.yml'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate visual freshness receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_visual_freshness_receipt.py

      - name: Download exact triggering build freshness receipt
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Classify canonical visual mutation
        id: visual_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "giveaway_only=false" >> "$GITHUB_OUTPUT"
          echo "commercial_only=false" >> "$GITHUB_OUTPUT"
          python - <<'PY' | tee /tmp/visual-scope.txt
          import copy
          import json
          import os
          import subprocess
          from pathlib import Path

          path = 'data/production/visual/current.json'
          visual_commit = subprocess.check_output(
              ['git', 'log', '-1', '--format=%H', '--', path],
              text=True,
          ).strip()
          if not visual_commit:
              raise SystemExit('missing visual payload commit')

          parent = subprocess.run(
              ['git', 'rev-parse', f'{visual_commit}^'],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
          )
          if parent.returncode != 0:
              print(f'VISUAL_DEPLOY_SCOPE=general visual_commit={visual_commit} reason=no_parent')
              raise SystemExit(0)

          try:
              before = json.loads(subprocess.check_output(
                  ['git', 'show', f'{visual_commit}^:{path}'],
                  text=True,
              ))
              after = json.loads(subprocess.check_output(
                  ['git', 'show', f'{visual_commit}:{path}'],
                  text=True,
              ))
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              print(f'VISUAL_DEPLOY_SCOPE=general visual_commit={visual_commit} reason=unreadable_diff')
              raise SystemExit(0)

          giveaway_contract = {
              'final_visual_producer_blob_sha',
              'giveaway_visual_handoff_blob_sha',
              'source_giveaway_snapshot_blob_sha',
              'giveaway_visual_schema_version',
          }

          def stable_without_giveaway(data):
              data = copy.deepcopy(data)
              data.pop('giveaways', None)
              contract = data.get('production_contract') or {}
              for key in giveaway_contract:
                  contract.pop(key, None)
              return data

          giveaway = after.get('giveaways')
          is_giveaway_only = (
              stable_without_giveaway(before) == stable_without_giveaway(after)
              and isinstance(giveaway, dict)
              and giveaway.get('schema_version') == 1
              and giveaway.get('source_contract') == 'CROSS-PLATFORM-GIVEAWAY-V1'
          )
          if is_giveaway_only:
              print(f'VISUAL_DEPLOY_SCOPE=giveaway_only visual_commit={visual_commit} non_giveaway_state_unchanged=true')
              raise SystemExit(0)

          # Commercial-only deploys may remove stale rows and rewrite deterministic
          # prices/offers/ranking, but they may not add unanalyzed rows, rewrite
          # player-facing semantics/descriptions, or touch the giveaway sibling.
          receipt = {}
          receipt_path = Path('/tmp/visual-freshness-artifact/visual-freshness-receipt.json')
          if os.environ.get('EVENT_NAME') == 'workflow_run' and receipt_path.exists():
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))

          produced = receipt.get('produced_visual') or {}
          receipt_is_commercial = (
              receipt.get('fresh_build') is True
              and receipt.get('freshness_scope') == 'commercial_only'
              and receipt.get('full_visual_freshness') is False
              and produced.get('commit_sha') == visual_commit
          )

          before_items = {str(item.get('id')): item for item in before.get('items') or []}
          after_items = {str(item.get('id')): item for item in after.get('items') or []}
          no_new_rows = set(after_items).issubset(before_items)

          protected_fields = (
              'fit', 'source_fit', 'taste_factors', 'why_fit', 'why_fit_status',
              'why_fit_provenance', 'risks', 'risk_codes', 'risk_status',
              'risk_provenance', 'risk_level', 'risk_penalty', 'direct_user_evidence',
              'taste_rank', 'play_role', 'start_priority', 'play_priority_context',
              'summary', 'description_status', 'description_source_locale',
              'description_source_quality', 'description_source_appid',
              'description_source_path', 'description_source_text',
          )
          semantics_unchanged = no_new_rows and all(
              all(after_item.get(key) == before_items[family_id].get(key) for key in protected_fields)
              for family_id, after_item in after_items.items()
          )

          before_contract = before.get('production_contract') or {}
          after_contract = after.get('production_contract') or {}
          giveaway_provenance_unchanged = all(
              before_contract.get(key) == after_contract.get(key)
              for key in (
                  'giveaway_visual_handoff_blob_sha',
                  'source_giveaway_snapshot_blob_sha',
                  'giveaway_visual_schema_version',
              )
          )
          giveaway_unchanged = before.get('giveaways') == after.get('giveaways') and giveaway_provenance_unchanged
          paid = after.get('paid_list_freshness') or {}
          commercial_marker = paid.get('status') == 'published' and paid.get('scope') == 'commercial_only'

          if receipt_is_commercial and commercial_marker and semantics_unchanged and giveaway_unchanged:
              print(
                  f'VISUAL_DEPLOY_SCOPE=commercial_only visual_commit={visual_commit} '
                  f'rows_before={len(before_items)} rows_after={len(after_items)} '
                  'semantic_and_description_fields_unchanged=true giveaway_unchanged=true'
              )
          else:
              print(
                  f'VISUAL_DEPLOY_SCOPE=general visual_commit={visual_commit} '
                  f'receipt_is_commercial={str(receipt_is_commercial).lower()} '
                  f'commercial_marker={str(commercial_marker).lower()} '
                  f'no_new_rows={str(no_new_rows).lower()} '
                  f'semantics_unchanged={str(semantics_unchanged).lower()} '
                  f'giveaway_unchanged={str(giveaway_unchanged).lower()}'
              )
          PY

          if grep -q 'VISUAL_DEPLOY_SCOPE=giveaway_only' /tmp/visual-scope.txt; then
            echo "giveaway_only=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'VISUAL_DEPLOY_SCOPE=commercial_only' /tmp/visual-scope.txt; then
            echo "commercial_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require meaningful Russian descriptions for general visual changes
        if: >
          steps.visual_scope.outputs.giveaway_only != 'true' &&
          steps.visual_scope.outputs.commercial_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_russian_descriptions.py data/production/visual/current.json

      - name: Accept unchanged paid payload for giveaway-only deploy
        if: steps.visual_scope.outputs.giveaway_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'PAID_VISUAL_ACCEPTANCE=reused_existing_canonical_payload structural_diff_proof=pass'

      - name: Accept preserved semantic payload for commercial-only deploy
        if: steps.visual_scope.outputs.commercial_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'COMMERCIAL_VISUAL_ACCEPTANCE=bounded_paid_refresh semantic_and_description_fields_unchanged=true giveaway_unchanged=true'

      - name: Validate giveaway visual payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_giveaway_visual_payload.py data/production/visual/current.json

      - name: Run UI regressions
        shell: bash
        run: |
          set -euo pipefail
          node web/image-swipe-sync.test.js
          node web/package-deal-ui.test.js
          node web/score-details-ui.test.js
          node web/giveaway-ui.test.js
          node web/paid-freshness-ui.test.js
          node scripts/test_feed_bootstrap_cache_identity.js

      - name: Stage precomputed visual payload
        shell: bash
        run: |
          set -euo pipefail
          test -s data/production/visual/current.json
          grep -q '"mode":"daily_precomputed_read_only_for_ui"' data/production/visual/current.json
          mkdir -p web/data
          cp data/production/visual/current.json web/data/current.json

      - name: Bind staged publication to triggering build freshness receipt
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RECEIPT=/tmp/visual-freshness-artifact/visual-freshness-receipt.json
            test -s "$RECEIPT"
            python scripts/visual_freshness_receipt.py verify-receipt \
              --receipt "$RECEIPT" \
              --expected-run-id "$TRIGGER_RUN_ID" \
              --staged-path web/data/current.json | tee /tmp/visual-freshness-verification.log
            classification=$(python -c "import json; from pathlib import Path; data=json.loads(Path('/tmp/visual-freshness-artifact/visual-freshness-receipt.json').read_text(encoding='utf-8')); print('fresh' if data.get('fresh_build') is True else 'degraded/no_fresh_build')")
          else
            classification='unbound/non_workflow_run'
            echo "VISUAL_FRESHNESS=$classification event=$EVENT_NAME"
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Expose publication freshness outcome
        env:
          CLASSIFICATION: ${{ steps.freshness.outputs.classification }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "VISUAL_PUBLICATION_OUTCOME=$CLASSIFICATION"
          {
            echo '## Visual publication freshness'
            echo "- classification: \`$CLASSIFICATION\`"
            if [ -n "${TRIGGER_RUN_ID:-}" ]; then
              echo "- triggering build run: \`$TRIGGER_RUN_ID\`"
            fi
            if [ "$CLASSIFICATION" = 'degraded/no_fresh_build' ]; then
              echo '- publication is explicitly degraded and is not a fresh-cycle success.'
            elif [ "$CLASSIFICATION" = 'unbound/non_workflow_run' ]; then
              echo '- publication was not triggered by a build receipt and is not classified as a fresh-cycle success.'
            else
              echo '- staged payload is exactly bound to the triggering fresh build receipt.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
