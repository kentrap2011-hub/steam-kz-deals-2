name: One-shot taste V3 cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-taste-v3-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taste-v3-cutover-once
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch canonical V3 bindings and validator
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          policy_path = Path('config/mailing_policy.json')
          entry_contract_path = Path('config/taste_cache_entry_contract.json')
          result_contract_path = Path('config/taste_result_contract.json')
          validator_path = Path('scripts/validate_mailing_policy.py')

          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          entry_contract = json.loads(entry_contract_path.read_text(encoding='utf-8'))
          result_contract = json.loads(result_contract_path.read_text(encoding='utf-8'))

          if policy.get('version') != '1.18':
              raise SystemExit(f"Unexpected mailing policy version before V3 cutover: {policy.get('version')!r}")
          structured = policy['personal_filter']['structured_taste_evaluation']
          taste_cache = policy['taste_cache']
          if structured.get('taste_model_version') != 'taste-v2':
              raise SystemExit('structured_taste_evaluation is not on taste-v2 before cutover')
          if taste_cache.get('taste_model_version') != 'taste-v2':
              raise SystemExit('taste_cache is not on taste-v2 before cutover')
          if result_contract.get('contract') != 'TASTE-SEMANTIC-RESULT-V3':
              raise SystemExit('Unexpected semantic result contract')
          if entry_contract.get('contract') != 'TASTE-CACHE-ENTRY-BINDING-V3':
              raise SystemExit('Unexpected cache entry contract')
          if 'taste_factor_semantics' in policy:
              raise SystemExit('taste_factor_semantics already exists; refusing ambiguous repeat cutover')

          policy['version'] = '1.19'
          structured['taste_model_version'] = 'taste-v3'
          taste_cache['taste_model_version'] = 'taste-v3'
          taste_cache['recovery_artifact']['purpose'] = (
              'recover final verdicts for the current taste model from an immediately prior interrupted run '
              'without repeating semantic evaluation'
          )
          policy['taste_factor_semantics'] = {
              'contract': result_contract['contract'],
              'normalized_factor_value_range': result_contract['normalized_factor_value_range'],
              'normalized_factor_ids': result_contract['normalized_factor_ids'],
              'factor_semantics': result_contract['factor_semantics'],
              'scoring_rules': result_contract['scoring_rules'],
          }

          fields = list(entry_contract['taste_semantics_policy_fields'])
          if 'taste_factor_semantics' in fields:
              raise SystemExit('taste_factor_semantics already bound into semantic digest')
          fields.append('taste_factor_semantics')
          entry_contract['taste_semantics_policy_fields'] = fields
          entry_contract['taste_semantics_digest']['migration_note'] = (
              'Taste V3 cutover completed: normalized factor semantics are part of the canonical semantic digest, '
              'so V2 bindings are stale and must be re-evaluated through the existing taste queue.'
          )

          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          entry_contract_path.write_text(json.dumps(entry_contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          digest_payload = {field: policy.get(field) for field in fields}
          raw = json.dumps(
              digest_payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8')
          digest = hashlib.sha256(raw).hexdigest()

          text = validator_path.read_text(encoding='utf-8')
          text, n = re.subn(
              r"EXPECTED_TASTE_SEMANTICS = '[0-9a-f]{64}'",
              f"EXPECTED_TASTE_SEMANTICS = '{digest}'",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not replace EXPECTED_TASTE_SEMANTICS exactly once')

          replacements = {
              "p.get('version') == '1.18'": "p.get('version') == '1.19'",
              "'taste_v2': st['taste_model_version'] == 'taste-v2'": "'taste_v3': st['taste_model_version'] == 'taste-v3'",
              "'cache_v2': tc['taste_model_version'] == 'taste-v2'": "'cache_v3': tc['taste_model_version'] == 'taste-v3'",
              "'cache_contract_v2': cache_contract.get('contract') == 'TASTE-CACHE-ENTRY-BINDING-V2'": "'cache_contract_v3': cache_contract.get('contract') == 'TASTE-CACHE-ENTRY-BINDING-V3'",
              "'never_rebind_old_entry_without_ai': mixed_generation.get('never_upgrade_an_old_entry_binding_without_a_new_ai_verdict') is True": "'never_rebind_old_entry_without_ai': mixed_generation.get('never_upgrade_an_old_entry_binding_or_add_factors_without_a_new_ai_verdict') is True",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one validator occurrence for {old!r}, found {count}')
              text = text.replace(old, new)

          anchor = "        'taste_semantics_stable': taste_semantics_digest(p) == EXPECTED_TASTE_SEMANTICS,\n"
          if text.count(anchor) != 1:
              raise SystemExit('Could not locate taste_semantics_stable validator anchor')
          extra = (
              anchor
              + "        'taste_factor_semantics_v3': (p.get('taste_factor_semantics') or {}).get('contract') == 'TASTE-SEMANTIC-RESULT-V3',\n"
              + "        'taste_factor_ids_bound': (p.get('taste_factor_semantics') or {}).get('normalized_factor_ids') == list(__import__('taste_cache_common').TASTE_FACTOR_IDS),\n"
          )
          text = text.replace(anchor, extra)
          validator_path.write_text(text, encoding='utf-8')

          print(json.dumps({
              'policy_version': policy['version'],
              'taste_model_version': structured['taste_model_version'],
              'semantic_digest': digest,
              'semantic_fields': fields,
          }, ensure_ascii=False, indent=2))
          print('TASTE_V3_CANONICAL_CUTOVER_PATCH=PASS')
          PY

      - name: Validate canonical contracts after cutover
        run: |
          python scripts/validate_taste_v3_contract.py
          python scripts/validate_mailing_policy.py

      - name: Rebuild existing pre-AI taste projection and queue
        run: |
          python scripts/build_pre_ai_taste_projection.py
          python scripts/build_pre_ai_chatgpt_payload.py

      - name: Verify V2 active scope became V3 semantic backlog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('config/mailing_policy.json').read_text(encoding='utf-8'))
          projection = json.loads(Path('data/production/pre_ai/taste_projection.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text(encoding='utf-8'))
          queue_path = Path('data/production/pre_ai/chatgpt_taste_queue.jsonl')
          rows = [json.loads(line) for line in queue_path.read_text(encoding='utf-8').splitlines() if line.strip()]

          if policy['personal_filter']['structured_taste_evaluation']['taste_model_version'] != 'taste-v3':
              raise SystemExit('Policy did not cut over to taste-v3')
          if policy['taste_cache']['taste_model_version'] != 'taste-v3':
              raise SystemExit('Cache binding did not cut over to taste-v3')
          if projection['current_binding']['taste_model_version'] != 'taste-v3':
              raise SystemExit('Taste projection is not bound to taste-v3')
          if payload['profile_binding']['taste_model_version'] != 'taste-v3':
              raise SystemExit('ChatGPT payload is not bound to taste-v3')
          if payload['ai_queue_count'] != len(rows):
              raise SystemExit(f"Queue count mismatch: payload={payload['ai_queue_count']} rows={len(rows)}")
          if projection.get('ai_required_count', 0) < 500 or len(rows) < 500:
              raise SystemExit(
                  f"Expected mass migration backlog after V3 cutover, projection={projection.get('ai_required_count')} queue={len(rows)}"
              )
          if projection.get('raw_cache_overlap_count', 0) < 500:
              raise SystemExit('Expected substantial V2 cache overlap to prove migration invalidation')
          if projection.get('raw_model_match_count') != 0:
              raise SystemExit(f"Expected V2 cache model bindings to be stale, model matches={projection.get('raw_model_match_count')}")
          missing_factor_work = [
              row['taste_subject_key'] for row in rows
              if 'evaluate_normalized_taste_factors' not in (row.get('work_required') or [])
          ]
          if missing_factor_work:
              raise SystemExit(f'Queue rows missing normalized-factor work: {missing_factor_work[:10]}')

          reasons = {}
          for row in rows:
              reason = row.get('ai_required_reason') or 'unknown'
              reasons[reason] = reasons.get(reason, 0) + 1

          print(json.dumps({
              'status': 'PASS',
              'projection_ai_required_count': projection.get('ai_required_count'),
              'queue_count': len(rows),
              'raw_cache_overlap_count': projection.get('raw_cache_overlap_count'),
              'raw_model_match_count': projection.get('raw_model_match_count'),
              'ready_without_ai_count': payload.get('ready_without_ai_count'),
              'deterministically_excluded_without_ai_count': payload.get('deterministically_excluded_without_ai_count'),
              'ai_required_reasons': reasons,
              'all_queue_rows_request_normalized_factors': True,
          }, ensure_ascii=False, indent=2))
          print('TASTE_V3_MIGRATION_QUEUE=PASS')
          PY

      - name: Commit cutover, migration queue and remove one-shot workflow
        run: |
          rm .github/workflows/patch-taste-v3-cutover.yml
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add config/mailing_policy.json config/taste_cache_entry_contract.json scripts/validate_mailing_policy.py
          git add -A data/production/pre_ai .github/workflows/patch-taste-v3-cutover.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Cut over taste evaluation to V3 factors"
          git push origin HEAD:main
