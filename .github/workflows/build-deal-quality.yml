name: Build deal quality and deterministic sort

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - "config/deal_quality_contract.json"
      - "data/cache/taste_fit.index.json"
      - "data/cache/taste_fit.ledger_validation.json"
      - "data/cache/taste_fit.checkpoint_validation.json"
      - "data/cache/offer_family.validation.json"
      - "data/cache/store_state.validation.json"
      - "data/cache/steamdb_cache.validation.json"
      - ".github/workflows/build-deal-quality.yml"

permissions:
  contents: write

concurrency:
  group: deal-quality-stage
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve fit-scaled price gate, history class and deterministic order
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          POLICY=Path('config/mailing_policy.json')
          CONTRACT=Path('config/deal_quality_contract.json')
          TASTE_INDEX=Path('data/cache/taste_fit.index.json')
          TASTE_LEDGER=Path('data/cache/taste_fit.ledger_validation.json')
          CHECKPOINT=Path('data/cache/taste_fit.checkpoint_validation.json')
          FAMILIES=Path('data/cache/offer_family.validation.json')
          STORE=Path('data/cache/store_state.validation.json')
          STEAMDB=Path('data/cache/steamdb_cache.validation.json')
          OUT=Path('data/cache/deal_quality.validation.json')

          def sha(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()

          def parse_dt(text):
              return datetime.fromisoformat(str(text).replace('Z','+00:00'))

          policy=json.loads(POLICY.read_text(encoding='utf-8'))
          contract=json.loads(CONTRACT.read_text(encoding='utf-8'))
          taste=json.loads(TASTE_INDEX.read_text(encoding='utf-8'))
          ledger=json.loads(TASTE_LEDGER.read_text(encoding='utf-8'))
          checkpoint=json.loads(CHECKPOINT.read_text(encoding='utf-8'))
          families=json.loads(FAMILIES.read_text(encoding='utf-8'))
          store=json.loads(STORE.read_text(encoding='utf-8'))
          steamdb=json.loads(STEAMDB.read_text(encoding='utf-8'))

          if policy.get('status')!='canonical': raise SystemExit('Policy not canonical')
          if float(policy['pricing']['target_rub']) != float(contract['authority']['requires_canonical_target_rub']):
              raise SystemExit('Deal contract base target disagrees with canonical policy')
          if contract.get('contract')!='DEAL-QUALITY-AND-SORT-V1': raise SystemExit('Unexpected deal contract')
          if ledger.get('status')!='complete' or not ledger.get('complete_ledger'): raise SystemExit('Taste ledger incomplete')
          if checkpoint.get('status')!='complete' or not checkpoint.get('checkpoint_complete'): raise SystemExit('Taste checkpoint incomplete')
          if families.get('status')!='complete' or not families.get('complete_coverage'): raise SystemExit('Offer families incomplete')
          if store.get('status')!='complete' or int(store.get('missing_count') or 0)!=0: raise SystemExit('Store state incomplete')
          if steamdb.get('status')!='complete' or not steamdb.get('complete_coverage'): raise SystemExit('SteamDB classification incomplete')
          if int(steamdb.get('true_lookup_miss_count') or 0)!=0: raise SystemExit('Stage 18 cannot run while SteamDB true misses remain')
          if int(steamdb.get('invalid_cache_entry_count') or 0)!=0: raise SystemExit('SteamDB classification has invalid entries')

          # Strict binding checks for prerequisite artifacts.
          policy_sha=sha('config/mailing_policy.json')
          taste_index_sha=sha('data/cache/taste_fit.index.json')
          ledger_sha=sha('data/cache/taste_fit.ledger_validation.json')
          family_sha=sha('data/cache/offer_family.validation.json')
          store_sha=sha('data/cache/store_state.validation.json')
          steamdb_sha=sha('data/cache/steamdb_cache.validation.json')
          if ledger['bindings'].get('policy_blob_sha') != policy_sha: raise SystemExit('Taste ledger stale versus policy')
          if ledger['bindings'].get('taste_index_blob_sha') != taste_index_sha: raise SystemExit('Taste ledger stale versus taste index')
          if checkpoint['bindings'].get('policy_blob_sha') != policy_sha: raise SystemExit('Taste checkpoint stale versus policy')
          if checkpoint['bindings'].get('ledger_validation_blob_sha') != ledger_sha: raise SystemExit('Taste checkpoint stale versus taste ledger')
          if families['bindings'].get('policy_blob_sha') != policy_sha: raise SystemExit('Offer families stale versus policy')
          if store['bindings'].get('policy_blob_sha') != policy_sha: raise SystemExit('Store validation stale versus policy')
          if store['bindings'].get('offer_family_blob_sha') != family_sha: raise SystemExit('Store validation stale versus families')
          if steamdb['bindings'].get('policy_blob_sha') != policy_sha: raise SystemExit('SteamDB classification stale versus policy')
          if steamdb['bindings'].get('store_state_validation_blob_sha') != store_sha: raise SystemExit('SteamDB classification stale versus store')
          if steamdb['bindings'].get('offer_family_blob_sha') != family_sha: raise SystemExit('SteamDB classification stale versus families')

          # One FX lookup for the whole stage. Never silently use a guessed rate.
          fx_url=contract['fx']['source_url']
          req=urllib.request.Request(fx_url,headers={'User-Agent':'steam-kz-deals/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=15) as resp:
              fx=json.loads(resp.read().decode('utf-8'))
          if fx.get('result')!='success' or fx.get('base_code')!='RUB': raise SystemExit('FX provider returned invalid result')
          rate=float((fx.get('rates') or {}).get('KZT') or 0)
          if not math.isfinite(rate) or rate<=0: raise SystemExit('Invalid RUB/KZT rate')
          fx_time=datetime.fromtimestamp(int(fx['time_last_update_unix']),tz=timezone.utc)
          age_hours=(datetime.now(timezone.utc)-fx_time).total_seconds()/3600
          if age_hours < -1 or age_hours > float(contract['fx']['max_rate_age_hours']):
              raise SystemExit(f'FX rate stale: {age_hours:.2f}h')

          taste_entries=taste.get('entries') or {}
          if int(taste.get('index_entry_count') or -1)!=len(taste_entries): raise SystemExit('Taste compact index entry count mismatch')
          fit_rank={'strong':0,'moderate':1}

          store_by_key={x['primary_key']:x for x in store['current_state']}
          if len(store_by_key)!=int(store.get('primary_count') or -1): raise SystemExit('Store primary count mismatch')

          history={}
          for x in steamdb.get('confirmed_min_hits') or []:
              history[x['key']]={'status':'confirmed_min','historical_min_kzt':float(x['historical_min_kzt'])}
          for x in steamdb.get('previously_free_hits') or []:
              history[x['key']]={'status':'previously_free','historical_min_kzt':0.0}
          for x in steamdb.get('negative_cache_hits') or []:
              history[x['key']]={'status':'unavailable_exact_history','historical_min_kzt':None}
          if len(history)!=int(steamdb.get('primary_count') or -1): raise SystemExit('SteamDB primary coverage map mismatch')

          def family_fit(fam):
              keys=[]
              for k in [fam.get('primary_key'), *(fam.get('all_member_keys') or [])]:
                  if k and k not in keys: keys.append(k)
              levels=[]
              for k in keys:
                  e=taste_entries.get(k)
                  if e and e.get('verdict')=='INCLUDE' and e.get('fit_level') in fit_rank:
                      levels.append(e['fit_level'])
              if not levels:
                  raise SystemExit(f'No final included taste fit for family {fam.get("family_id")}')
              return min(levels,key=lambda x:fit_rank[x])

          def history_quality(current_kzt,h):
              status=h['status']
              if status=='previously_free': return 'previously_free',None
              if status=='unavailable_exact_history': return 'unverified',None
              hist=float(h['historical_min_kzt'])
              if hist<=0: raise SystemExit('Nonpositive paid historical minimum')
              delta=current_kzt/hist-1.0
              if current_kzt<=hist: return 'record',delta
              if delta<=0.10+1e-12: return 'near_record',delta
              if delta<=0.25+1e-12: return 'good_vs_history',delta
              return 'well_above_history',delta

          def price_gate(fit,price_rub,quality):
              if price_rub<=500+1e-12:
                  return True,500,'base_target'
              if fit=='strong':
                  if price_rub>750+1e-12:
                      return False,750,'strong_absolute_ceiling'
                  if price_rub<=650+1e-12:
                      ok=quality in {'record','near_record','good_vs_history'}
                      return ok,650,'strong_standard_overage_requires_good_history'
                  ok=quality in {'record','near_record'}
                  return ok,750,'strong_high_overage_requires_record_or_near_record'
              if fit=='moderate':
                  if price_rub>550+1e-12:
                      return False,550,'moderate_absolute_ceiling'
                  ok=quality in {'record','near_record'}
                  return ok,550,'moderate_overage_requires_record_or_near_record'
              return False,500,'unsupported_or_below_moderate_fit'

          decision_by_quality={
              'record':'БРАТЬ СЕЙЧАС',
              'near_record':'БРАТЬ СЕЙЧАС',
              'good_vs_history':'МОЖНО БРАТЬ',
              'previously_free':'МОЖНО БРАТЬ',
              'unverified':'МОЖНО БРАТЬ',
              'well_above_history':'ЛУЧШЕ ЖДАТЬ'
          }
          decision_rank={x:i for i,x in enumerate(contract['sorting']['purchase_decision_order'])}
          quality_rank={x:i for i,x in enumerate(contract['sorting']['price_quality_order'])}

          rows=[]; excluded=[]
          seen_primary=set()
          for fam in families['families']:
              primary=fam['primary_key']
              if primary in seen_primary: raise SystemExit(f'Duplicate primary family key: {primary}')
              seen_primary.add(primary)
              st=store_by_key.get(primary)
              h=history.get(primary)
              if st is None or h is None: raise SystemExit(f'Missing stage prerequisite row for {primary}')
              fit=family_fit(fam)
              current_kzt=float(st['final_kzt'])
              current_rub=current_kzt/rate
              quality,delta=history_quality(current_kzt,h)
              allowed,ceiling_rub,gate_reason=price_gate(fit,current_rub,quality)
              common={
                  'family_id':fam['family_id'],
                  'primary_key':primary,
                  'title':st['title'],
                  'fit_level':fit,
                  'discount_percent':st.get('discount_percent'),
                  'current_kzt':current_kzt,
                  'current_price_rub_unrounded':current_rub,
                  'current_price_rub_display':int(round(current_rub)),
                  'history_quality':quality,
                  'historical_min_kzt':h['historical_min_kzt'],
                  'delta_vs_paid_historical_minimum':delta,
                  'active_price_ceiling_rub':ceiling_rub,
                  'price_gate_reason':gate_reason
              }
              if not allowed:
                  common.update({
                      'final_disposition':'EXCLUDE',
                      'exclusion_reason_code':'price_clearly_unreasonable_after_soft_target_evaluation'
                  })
                  excluded.append(common)
                  continue
              decision=decision_by_quality[quality]
              common.update({
                  'final_disposition':'INCLUDE',
                  'purchase_decision':decision,
                  'best_variant_value_score':0
              })
              rows.append(common)

          if len(seen_primary)!=int(families.get('primary_count') or -1): raise SystemExit('Family primary coverage mismatch')
          if len(rows)+len(excluded)!=len(seen_primary): raise SystemExit('Deal disposition coverage mismatch')

          rows.sort(key=lambda x:(
              decision_rank[x['purchase_decision']],
              fit_rank[x['fit_level']],
              quality_rank[x['history_quality']],
              -int(x['best_variant_value_score']),
              -(int(x['discount_percent']) if x['discount_percent'] is not None else -1),
              x['current_price_rub_unrounded'],
              x['title'].casefold(),
              x['primary_key']
          ))

          # Prove sorted order by rebuilding the key sequence.
          sorted_again=sorted(rows,key=lambda x:(
              decision_rank[x['purchase_decision']],fit_rank[x['fit_level']],quality_rank[x['history_quality']],
              -int(x['best_variant_value_score']),-(int(x['discount_percent']) if x['discount_percent'] is not None else -1),
              x['current_price_rub_unrounded'],x['title'].casefold(),x['primary_key']))
          if [x['primary_key'] for x in rows] != [x['primary_key'] for x in sorted_again]: raise SystemExit('Non-deterministic sort')

          out={
              'schema_version':1,
              'purpose':'deal_quality_and_deterministic_sort_validation',
              'status':'complete',
              'bindings':{
                  'policy_blob_sha':policy_sha,
                  'deal_quality_contract_blob_sha':sha('config/deal_quality_contract.json'),
                  'taste_index_blob_sha':taste_index_sha,
                  'taste_ledger_blob_sha':ledger_sha,
                  'taste_checkpoint_blob_sha':sha('data/cache/taste_fit.checkpoint_validation.json'),
                  'offer_family_blob_sha':family_sha,
                  'store_state_blob_sha':store_sha,
                  'steamdb_cache_classification_blob_sha':steamdb_sha
              },
              'fx':{
                  'provider':fx_url,
                  'base':'RUB','quote':'KZT','kzt_per_rub':rate,
                  'provider_updated_at_utc':fx_time.isoformat(),
                  'rate_age_hours':age_hours,
                  'external_calls':1
              },
              'input_primary_count':len(seen_primary),
              'recommendation_count':len(rows),
              'price_excluded_count':len(excluded),
              'classified_count':len(rows)+len(excluded),
              'complete_coverage':True,
              'decision_counts':{d:sum(1 for x in rows if x['purchase_decision']==d) for d in decision_rank},
              'history_quality_counts':{q:sum(1 for x in rows if x['history_quality']==q) for q in quality_rank},
              'fit_counts':{f:sum(1 for x in rows if x['fit_level']==f) for f in fit_rank},
              'price_exclusion_reason_count':sum(1 for x in excluded if x['exclusion_reason_code']=='price_clearly_unreasonable_after_soft_target_evaluation'),
              'sorted_recommendations':rows,
              'price_exclusions':excluded
          }
          OUT.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'status':out['status'],'input_primary_count':out['input_primary_count'],
              'recommendation_count':out['recommendation_count'],'price_excluded_count':out['price_excluded_count'],
              'decision_counts':out['decision_counts'],'fit_counts':out['fit_counts'],
              'fx_kzt_per_rub':rate,'fx_age_hours':round(age_hours,2)
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit stage-18 validation artifact
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/cache/deal_quality.validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build deterministic deal quality ledger"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
