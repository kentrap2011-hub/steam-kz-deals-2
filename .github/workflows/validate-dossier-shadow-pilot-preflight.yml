name: Validate Dossier shadow pilot preflight (PR only)

on:
  pull_request:
    paths:
      - "scripts/dossier_shadow_pilot_preflight.py"
      - "scripts/test_dossier_shadow_pilot_preflight.py"
      - "scripts/dossier_two_stage_shadow_quality.py"
      - "scripts/dossier_two_stage_final_acceptance.py"
      - ".github/workflows/validate-dossier-shadow-pilot-preflight.yml"
      - "reviews/worker_reports/dossier-shadow-pilot-preflight-01.md"

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install existing strict-V2 test dependency
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Compile isolated preflight and regression
        run: python -m py_compile scripts/dossier_shadow_pilot_preflight.py scripts/test_dossier_shadow_pilot_preflight.py
      - name: Existing final writer, shadow quality and new historical proof
        run: |
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_final_acceptance.py' -v
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_shadow_quality.py' -v
          python -m unittest discover -s scripts -p 'test_dossier_shadow_pilot_preflight.py' -v
