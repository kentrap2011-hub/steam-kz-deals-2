name: Build daily visual payload

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build pre-AI deterministic payload"
      - "Ingest context-bound taste batch"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "scripts/build_final_visual_payload.py"
      - "scripts/build_daily_visual_payload.py"
      - "scripts/build_visual_feed_v2.py"
      - "scripts/card_explanation_policy.py"
      - "scripts/test_card_explanation_policy.py"
      - "scripts/validate_card_explanations.py"
      - "scripts/giveaway_visual_handoff.py"
      - "scripts/test_giveaway_visual_handoff.py"
      - "scripts/validate_giveaway_visual_payload.py"
      - "scripts/duration_enrichment.py"
      - "scripts/test_duration_enrichment.py"
      - "scripts/validate_duration_enrichment_contract.py"
      - "scripts/russian_description_quality.py"
      - "scripts/test_russian_description_quality.py"
      - "scripts/validate_russian_descriptions.py"
      - "scripts/apply_fixed_package_purchase_options.py"
      - "scripts/refresh_visual_commercial_fields.py"
      - "scripts/test_commercial_refresh.py"
      - "scripts/test_fixed_package_purchase_options.py"
      - "scripts/normalize_visual_media_urls.py"
      - "scripts/achievement_quality.py"
      - "scripts/refine_visual_ranking.py"
      - "scripts/priority_ranking.py"
      - "scripts/validate_priority_ranking.py"
      - "scripts/validate_taste_v3_contract.py"
      - "scripts/ingest_taste_results.py"
      - "scripts/taste_cache_common.py"
      - "scripts/build_ranking_lookup.py"
      - "scripts/visual_freshness_receipt.py"
      - "scripts/test_visual_freshness_receipt.py"
      - "config/duration_enrichment_contract.json"
      - "config/final_ranking_policy.json"
      - "config/fixed_package_purchase_option_contract.json"
      - "config/purchase_equivalence_overrides.json"
      - "config/taste_result_contract.json"
      - "config/taste_cache_entry_contract.json"
      - "data/cache/duration_estimates.json"
      - "data/production/giveaways/v1/current.json"
      - "web/app.js"
      - "web/giveaway-ui.js"
      - "web/giveaway-ui.test.js"
      - "web/giveaway-ui.css"
      - "web/package-deal-ui.js"
      - "web/index.html"
      - ".github/workflows/build-daily-visual-payload.yml"

permissions:
  contents: write

concurrency:
  group: daily-visual-payload
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      giveaway_only: ${{ steps.classify.outputs.giveaway_only }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify bounded giveaway-only refresh
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "giveaway_only=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "push" ] || [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > /tmp/visual-changed.txt
          cat /tmp/visual-changed.txt

          allowed='^(scripts/build_final_visual_payload\.py|scripts/giveaway_visual_handoff\.py|scripts/test_giveaway_visual_handoff\.py|scripts/validate_giveaway_visual_payload\.py|web/giveaway-ui\.js|web/giveaway-ui\.test\.js|web/giveaway-ui\.css|web/app\.js|web/index\.html|\.github/workflows/build-daily-visual-payload\.yml)$'
          if grep -Ev "$allowed" /tmp/visual-changed.txt | grep -q .; then
            exit 0
          fi
          if git diff "$BEFORE_SHA" "$HEAD_SHA" -- $(cat /tmp/visual-changed.txt) | grep -qi 'giveaway'; then
            echo "giveaway_only=true" >> "$GITHUB_OUTPUT"
            echo "VISUAL_SCOPE=giveaway_only"
          fi

  giveaway_refresh:
    needs: scope
    if: needs.scope.outputs.giveaway_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended source cycle for freshness receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Validate giveaway visual handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_giveaway_visual_handoff.py

      - name: Record accepted paid payload fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/paid-items-before.sha256
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          raw = json.dumps(data.get('items') or [], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(raw).hexdigest())
          PY
          echo "PAID_ITEMS_BEFORE=$(cat /tmp/paid-items-before.sha256)"

      - name: Refresh only canonical giveaway visual sibling
        env:
          GIVEAWAY_VISUAL_REFRESH_ONLY: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_final_visual_payload.py | tee /tmp/giveaway-visual-refresh.log
          grep -q 'VISUAL_GIVEAWAY_REFRESH=BUILT' /tmp/giveaway-visual-refresh.log

      - name: Validate generated giveaway visual field
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_giveaway_visual_payload.py data/production/visual/current.json

      - name: Prove paid payload remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/paid-items-after.sha256
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          raw = json.dumps(data.get('items') or [], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(raw).hexdigest())
          PY
          echo "PAID_ITEMS_AFTER=$(cat /tmp/paid-items-after.sha256)"
          test "$(cat /tmp/paid-items-before.sha256)" = "$(cat /tmp/paid-items-after.sha256)"

      - name: Prove mutation is giveaway sibling plus provenance only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          path = 'data/production/visual/current.json'
          before = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True))
          after = json.loads(Path(path).read_text(encoding='utf-8'))
          allowed_contract = {
              'final_visual_producer_blob_sha',
              'giveaway_visual_handoff_blob_sha',
              'source_giveaway_snapshot_blob_sha',
              'giveaway_visual_schema_version',
          }

          def stable_without_giveaway(data):
              data = copy.deepcopy(data)
              data.pop('giveaways', None)
              contract = data.get('production_contract') or {}
              for key in allowed_contract:
                  contract.pop(key, None)
              return data

          if stable_without_giveaway(before) != stable_without_giveaway(after):
              raise SystemExit('giveaway-only refresh changed non-giveaway production state')
          print('GIVEAWAY_AUXILIARY_DIFF=PASS non_giveaway_state_unchanged=true')
          PY

      - name: Commit canonical giveaway visual sibling
        id: persist_giveaway
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/production/visual/current.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No giveaway visual change"
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh giveaway visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Create degraded freshness receipt for giveaway-only invocation
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PERSISTED: ${{ steps.persist_giveaway.outputs.persisted }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/visual-freshness-intent.json ]; then
            python scripts/visual_freshness_receipt.py capture-intent \
              --output /tmp/visual-freshness-intent.json
          fi
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported false \
            --persisted "$PERSISTED" \
            --history-ready false \
            --reason giveaway_only_refresh

      - name: Upload visual freshness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30

  no_build_receipt:
    needs: scope
    if: >
      needs.scope.outputs.giveaway_only != 'true' &&
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion != 'success' ||
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended source cycle for skipped build receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Create degraded freshness receipt for ineligible upstream run
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported false \
            --persisted false \
            --history-ready false \
            --reason upstream_prerequisite_not_ready

      - name: Upload visual freshness receipt
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: scope
    if: >
      needs.scope.outputs.giveaway_only != 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended source cycle for freshness receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Validate visual freshness receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_visual_freshness_receipt.py

      - name: Validate normalized taste factor contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_taste_v3_contract.py

      - name: Validate canonical priority ranking contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_priority_ranking.py

      - name: Validate canonical duration enrichment contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_duration_enrichment_contract.py
          python scripts/test_duration_enrichment.py

      - name: Validate card explanation policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_card_explanation_policy.py

      - name: Validate giveaway visual handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_giveaway_visual_handoff.py

      - name: Check IGDB duration provisioning and connectivity
        id: duration_connectivity
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          production_enabled=$(python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('config/duration_enrichment_contract.json').read_text(encoding='utf-8'))
          print('true' if (contract.get('provisioning_gates') or {}).get('production_collection_enabled') else 'false')
          PY
          )
          echo "production_enabled=$production_enabled" >> "$GITHUB_OUTPUT"

          if [ -z "${IGDB_CLIENT_ID:-}" ] || [ -z "${IGDB_CLIENT_SECRET:-}" ]; then
            echo "DURATION_IGDB_PROVISIONING=missing_credentials expected_secrets=IGDB_CLIENT_ID,IGDB_CLIENT_SECRET"
            echo "status=missing_credentials" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$production_enabled" = "true" ]; then
            echo "DURATION_IGDB_PROVISIONING=credentials_present production_collection_enabled=true"
            echo "status=ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/duration_enrichment.py --connectivity-only | tee /tmp/duration-connectivity.log
          grep -q 'DURATION_IGDB_CONNECTIVITY=PASS' /tmp/duration-connectivity.log
          echo "status=connectivity_pass" >> "$GITHUB_OUTPUT"

      - name: Validate fresh commercial refresh and fixed package ranking value
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_commercial_refresh.py
          python scripts/test_fixed_package_purchase_options.py

      - name: Validate Russian description quality rules
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_russian_description_quality.py

      - name: Require complete history classification coverage before replacing daily visual
        id: history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/production/pre_ai/history_snapshot.json')
          if not path.exists():
              print('HISTORY_READY=false reason=missing_snapshot')
              with open('/tmp/history-ready', 'w', encoding='utf-8') as fh:
                  fh.write('false\n')
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding='utf-8'))
          counts = data.get('cache_status_counts') or {}
          missing = int(counts.get('missing') or 0)
          ready = data.get('status') == 'complete' and data.get('complete_coverage') is True
          print(
              f'HISTORY_READY={str(ready).lower()} '
              f'missing_as_unverified={missing} complete_coverage={data.get("complete_coverage")} '
              f'primary_count={data.get("primary_count")}'
          )
          with open('/tmp/history-ready', 'w', encoding='utf-8') as fh:
              fh.write(('true' if ready else 'false') + '\n')
          PY
          echo "ready=$(cat /tmp/history-ready)" >> "$GITHUB_OUTPUT"

      - name: Refresh missing or stale IGDB duration cache
        id: duration
        if: >
          steps.history.outputs.ready == 'true' &&
          steps.duration_connectivity.outputs.production_enabled == 'true' &&
          steps.duration_connectivity.outputs.status != 'missing_credentials'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/duration_enrichment.py | tee /tmp/duration-enrichment.log
          if grep -q 'DURATION_CACHE_CHANGED=true' /tmp/duration-enrichment.log; then
            echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and refresh canonical visual payload once
        id: build
        if: steps.history.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export FORCE_VISUAL_BUILD=1
          python scripts/build_final_visual_payload.py | tee /tmp/visual-build.log
          python scripts/normalize_visual_media_urls.py | tee /tmp/media-refresh.log
          if grep -q 'VISUAL_FINAL_BUILD=BUILT' /tmp/visual-build.log || \
             grep -Eq 'VISUAL_MEDIA_ITEMS_CHANGED=[1-9][0-9]*' /tmp/media-refresh.log; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated card explanations
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_card_explanations.py data/production/visual/current.json 30

      - name: Validate generated giveaway visual field
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_giveaway_visual_payload.py data/production/visual/current.json

      - name: Require meaningful Russian descriptions before canonical commit
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_russian_descriptions.py data/production/visual/current.json

      - name: Build ranking review export
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('data/production/visual/current.json')
          out = Path('data/production/visual/ranking_review.jsonl')
          data = json.loads(src.read_text(encoding='utf-8'))

          rows = []
          package_drivers = []
          package_visible = []
          for game in sorted(data.get('items') or [], key=lambda g: int(g.get('priority_rank') or 999999)):
              practical = game.get('practical') or {}
              direct = game.get('direct_user_evidence') or {}
              score = game.get('score_breakdown') or {}
              package_route = score.get('package_route') or {}
              package = game.get('better_purchase_option') or {}
              row = {
                  'rank': game.get('priority_rank'),
                  'taste_rank': game.get('taste_rank'),
                  'id': game.get('id'),
                  'title': game.get('title'),
                  'sale_expiry_urgency': game.get('sale_expiry_urgency'),
                  'sale_expiry_urgency_rank': game.get('sale_expiry_urgency_rank'),
                  'source_fit': game.get('source_fit'),
                  'fit': game.get('fit'),
                  'fit_adjustment_reason': game.get('fit_adjustment_reason'),
                  'taste_confidence': game.get('taste_confidence'),
                  'direct_user_rating': direct.get('rating'),
                  'direct_user_evidence_level': direct.get('level'),
                  'decision': game.get('decision'),
                  'priority_bucket': game.get('priority_bucket'),
                  'practical_or_personal_risk_rank': game.get('practical_or_personal_risk_rank'),
                  'priority_factors': game.get('priority_factors') or [],
                  'priority_vs_next': game.get('priority_vs_next'),
                  'strengths': game.get('why_fit') or [],
                  'gameplay_points': game.get('gameplay_points') or [],
                  'weaknesses_risks': game.get('risks') or [],
                  'risk_codes': game.get('risk_codes') or [],
                  'risk_level': game.get('risk_level'),
                  'risk_status': game.get('risk_status'),
                  'risk_penalty': game.get('risk_penalty'),
                  'windows_status': practical.get('windows_status'),
                  'legacy_windows_requirement_label': practical.get('legacy_windows_requirement_label'),
                  'modern_windows_friction': practical.get('modern_windows_friction'),
                  'steam_achievements': practical.get('steam_achievements'),
                  'achievement_total': practical.get('achievement_total'),
                  'achievement_quality': practical.get('achievement_quality'),
                  'achievement_quality_evidence': practical.get('achievement_quality_evidence'),
                  'estimated_duration_hours': game.get('estimated_duration_hours'),
                  'duration_estimate_source': game.get('duration_estimate_source'),
                  'duration_estimate_provenance': game.get('duration_estimate_provenance'),
                  'duration_preference_band': game.get('duration_preference_band'),
                  'wishlist': bool(game.get('wishlist')),
                  'current_price_rub': game.get('current_price_rub'),
                  'original_price_rub': game.get('original_price_rub'),
                  'discount_percent': game.get('discount_percent'),
                  'historical_minimum_rub': game.get('historical_minimum_rub'),
                  'history_quality': game.get('history_quality'),
                  'previously_free': bool(game.get('previously_free')),
                  'sale_end_utc': game.get('sale_end_utc'),
                  'purchase_route': score.get('purchase_route'),
                  'standalone_purchase_score': score.get('standalone_purchase_score'),
                  'fixed_package_purchase_score': score.get('fixed_package_purchase_score'),
                  'package_score_delta_vs_standalone': score.get('package_score_delta_vs_standalone'),
                  'package_value_points': game.get('package_value_points'),
                  'package_route_status': package_route.get('status'),
                  'package_route_eligible_for_score': package_route.get('eligible_for_score'),
                  'package_key': package.get('package_key'),
                  'package_title': package.get('package_title'),
                  'package_price_rub': package.get('package_price_rub'),
                  'package_price_per_visible_game_rub': package.get('package_price_per_visible_game_rub'),
                  'package_covered_visible_game_count': package.get('covered_visible_game_count'),
                  'package_standalone_total_rub': package.get('standalone_total_rub'),
                  'package_savings_rub': package.get('package_savings_rub'),
                  'package_savings_percent_vs_standalone': package.get('package_savings_percent_vs_standalone'),
                  'package_strict_current_price_savings': package.get('package_strict_current_price_savings'),
                  'package_price_delta_vs_standalone_rub': package.get('package_price_delta_vs_standalone_rub'),
                  'package_uses_verified_purchase_equivalence': package.get('package_uses_verified_purchase_equivalence'),
                  'package_coverage_evidence': package.get('coverage_evidence') or [],
                  'better_purchase_option': game.get('better_purchase_option'),
                  'summary': game.get('summary'),
                  'steam_web_url': game.get('web_url'),
              }
              rows.append(json.dumps(row, ensure_ascii=False, separators=(',', ':')))
              if package:
                  package_visible.append(row)
              if score.get('purchase_route') == 'fixed_package':
                  package_drivers.append(row)

          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'RANKING_REVIEW_ROWS={len(rows)}')
          print(f'PACKAGE_VISIBLE_CARDS={len(package_visible)}')
          print(f'PACKAGE_RANKING_DRIVERS={len(package_drivers)}')
          for row in package_drivers[:5]:
              print(
                  'PACKAGE_RANKING_EXAMPLE '
                  f"rank={row.get('rank')} title={row.get('title')!r} "
                  f"package={row.get('package_title')!r} price_rub={row.get('package_price_rub')} "
                  f"games={row.get('package_covered_visible_game_count')} "
                  f"standalone_score={row.get('standalone_purchase_score')} "
                  f"package_score={row.get('fixed_package_purchase_score')} "
                  f"delta={row.get('package_score_delta_vs_standalone')}"
              )
          PY

      - name: Build bounded ranking lookup
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ranking_lookup.py

      - name: Commit canonical duration cache, payload and review export
        id: persist
        if: steps.build.outputs.built == 'true' || steps.duration.outputs.cache_changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add -A data/cache/duration_estimates.json data/production/visual/current.json data/production/visual/ranking_review.jsonl data/production/visual/ranking_lookup
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No duration cache, visual payload or review changes"
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh daily visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Create durable visual freshness receipt
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_REPORTED: ${{ steps.build.outputs.built }}
          PERSISTED: ${{ steps.persist.outputs.persisted }}
          HISTORY_READY: ${{ steps.history.outputs.ready }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/visual-freshness-intent.json ]; then
            python scripts/visual_freshness_receipt.py capture-intent \
              --output /tmp/visual-freshness-intent.json
          fi
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported "$BUILD_REPORTED" \
            --persisted "$PERSISTED" \
            --history-ready "$HISTORY_READY"

      - name: Upload visual freshness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30
