name: Build daily visual payload

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build pre-AI deterministic payload"
      - "Ingest context-bound taste batch"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "scripts/build_final_visual_payload.py"
      - "scripts/build_daily_visual_payload.py"
      - "scripts/build_visual_feed_v2.py"
      - "scripts/apply_fixed_package_purchase_options.py"
      - "scripts/test_fixed_package_purchase_options.py"
      - "scripts/normalize_visual_media_urls.py"
      - "scripts/achievement_quality.py"
      - "scripts/refine_visual_ranking.py"
      - "scripts/priority_ranking.py"
      - "scripts/validate_priority_ranking.py"
      - "scripts/validate_taste_v3_contract.py"
      - "scripts/ingest_taste_results.py"
      - "scripts/taste_cache_common.py"
      - "scripts/build_ranking_lookup.py"
      - "config/final_ranking_policy.json"
      - "config/fixed_package_purchase_option_contract.json"
      - "config/taste_result_contract.json"
      - "config/taste_cache_entry_contract.json"
      - "web/app.js"
      - ".github/workflows/build-daily-visual-payload.yml"

permissions:
  contents: write

concurrency:
  group: daily-visual-payload
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate normalized taste factor contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_taste_v3_contract.py

      - name: Validate canonical priority ranking contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_priority_ranking.py

      - name: Validate fixed package discovery, UI, and ranking value
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_fixed_package_purchase_options.py

      - name: Require complete history classification coverage before replacing daily visual
        id: history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/production/pre_ai/history_snapshot.json')
          if not path.exists():
              print('HISTORY_READY=false reason=missing_snapshot')
              with open('/tmp/history-ready', 'w', encoding='utf-8') as fh:
                  fh.write('false\n')
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding='utf-8'))
          counts = data.get('cache_status_counts') or {}
          missing = int(counts.get('missing') or 0)
          # Missing persistent SteamDB history is already classified by the history
          # snapshot as history_quality=unverified. It is secondary evidence, not a
          # reason to block an otherwise complete candidate snapshot.
          ready = data.get('status') == 'complete' and data.get('complete_coverage') is True
          print(
              f'HISTORY_READY={str(ready).lower()} '
              f'missing_as_unverified={missing} complete_coverage={data.get("complete_coverage")} '
              f'primary_count={data.get("primary_count")}'
          )
          with open('/tmp/history-ready', 'w', encoding='utf-8') as fh:
              fh.write(('true' if ready else 'false') + '\n')
          PY
          echo "ready=$(cat /tmp/history-ready)" >> "$GITHUB_OUTPUT"

      - name: Build and refresh canonical visual payload once
        id: build
        if: steps.history.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The unified producer performs semantic/practical refinement and fixed-package
          # purchase-option enrichment before assigning priority_rank exactly once from
          # config/final_ranking_policy.json.
          export FORCE_VISUAL_BUILD=1
          python scripts/build_final_visual_payload.py | tee /tmp/visual-build.log
          # StoreBrowse can return stale screenshot metadata for storefront aliases
          # (for example App_901735 resolving assets through app 40960). Refresh those
          # aliases from Steam appdetails before deciding whether there is anything to commit.
          python scripts/normalize_visual_media_urls.py | tee /tmp/media-refresh.log
          if grep -q 'VISUAL_FINAL_BUILD=BUILT' /tmp/visual-build.log || \
             grep -Eq 'VISUAL_MEDIA_ITEMS_CHANGED=[1-9][0-9]*' /tmp/media-refresh.log; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ranking review export
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('data/production/visual/current.json')
          out = Path('data/production/visual/ranking_review.jsonl')
          data = json.loads(src.read_text(encoding='utf-8'))

          rows = []
          package_drivers = []
          package_visible = []
          for game in sorted(data.get('items') or [], key=lambda g: int(g.get('priority_rank') or 999999)):
              practical = game.get('practical') or {}
              direct = game.get('direct_user_evidence') or {}
              score = game.get('score_breakdown') or {}
              package_route = score.get('package_route') or {}
              package = game.get('better_purchase_option') or {}
              row = {
                  'rank': game.get('priority_rank'),
                  'taste_rank': game.get('taste_rank'),
                  'id': game.get('id'),
                  'title': game.get('title'),
                  'sale_expiry_urgency': game.get('sale_expiry_urgency'),
                  'sale_expiry_urgency_rank': game.get('sale_expiry_urgency_rank'),
                  'source_fit': game.get('source_fit'),
                  'fit': game.get('fit'),
                  'fit_adjustment_reason': game.get('fit_adjustment_reason'),
                  'taste_confidence': game.get('taste_confidence'),
                  'direct_user_rating': direct.get('rating'),
                  'direct_user_evidence_level': direct.get('level'),
                  'decision': game.get('decision'),
                  'priority_bucket': game.get('priority_bucket'),
                  'practical_or_personal_risk_rank': game.get('practical_or_personal_risk_rank'),
                  'priority_factors': game.get('priority_factors') or [],
                  'priority_vs_next': game.get('priority_vs_next'),
                  'strengths': game.get('why_fit') or [],
                  'gameplay_points': game.get('gameplay_points') or [],
                  'weaknesses_risks': game.get('risks') or [],
                  'risk_codes': game.get('risk_codes') or [],
                  'risk_level': game.get('risk_level'),
                  'risk_status': game.get('risk_status'),
                  'risk_penalty': game.get('risk_penalty'),
                  'windows_status': practical.get('windows_status'),
                  'legacy_windows_requirement_label': practical.get('legacy_windows_requirement_label'),
                  'modern_windows_friction': practical.get('modern_windows_friction'),
                  'steam_achievements': practical.get('steam_achievements'),
                  'achievement_total': practical.get('achievement_total'),
                  'achievement_quality': practical.get('achievement_quality'),
                  'achievement_quality_evidence': practical.get('achievement_quality_evidence'),
                  'estimated_duration_hours': game.get('estimated_duration_hours'),
                  'duration_preference_band': game.get('duration_preference_band'),
                  'wishlist': bool(game.get('wishlist')),
                  'current_price_rub': game.get('current_price_rub'),
                  'original_price_rub': game.get('original_price_rub'),
                  'discount_percent': game.get('discount_percent'),
                  'historical_minimum_rub': game.get('historical_minimum_rub'),
                  'history_quality': game.get('history_quality'),
                  'previously_free': bool(game.get('previously_free')),
                  'sale_end_utc': game.get('sale_end_utc'),
                  'purchase_route': score.get('purchase_route'),
                  'standalone_purchase_score': score.get('standalone_purchase_score'),
                  'fixed_package_purchase_score': score.get('fixed_package_purchase_score'),
                  'package_score_delta_vs_standalone': score.get('package_score_delta_vs_standalone'),
                  'package_value_points': game.get('package_value_points'),
                  'package_route_status': package_route.get('status'),
                  'package_route_eligible_for_score': package_route.get('eligible_for_score'),
                  'package_key': package.get('package_key'),
                  'package_title': package.get('package_title'),
                  'package_price_rub': package.get('package_price_rub'),
                  'package_price_per_visible_game_rub': package.get('package_price_per_visible_game_rub'),
                  'package_covered_visible_game_count': package.get('covered_visible_game_count'),
                  'package_standalone_total_rub': package.get('standalone_total_rub'),
                  'package_savings_rub': package.get('savings_rub'),
                  'package_savings_percent_vs_standalone': package.get('savings_percent_vs_standalone'),
                  'better_purchase_option': game.get('better_purchase_option'),
                  'summary': game.get('summary'),
                  'steam_web_url': game.get('web_url'),
              }
              rows.append(json.dumps(row, ensure_ascii=False, separators=(',', ':')))
              if package:
                  package_visible.append(row)
              if score.get('purchase_route') == 'fixed_package':
                  package_drivers.append(row)

          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'RANKING_REVIEW_ROWS={len(rows)}')
          print(f'PACKAGE_VISIBLE_CARDS={len(package_visible)}')
          print(f'PACKAGE_RANKING_DRIVERS={len(package_drivers)}')
          for row in package_drivers[:5]:
              print(
                  'PACKAGE_RANKING_EXAMPLE '
                  f"rank={row.get('rank')} title={row.get('title')!r} "
                  f"package={row.get('package_title')!r} price_rub={row.get('package_price_rub')} "
                  f"games={row.get('package_covered_visible_game_count')} "
                  f"standalone_score={row.get('standalone_purchase_score')} "
                  f"package_score={row.get('fixed_package_purchase_score')} "
                  f"delta={row.get('package_score_delta_vs_standalone')}"
              )
          PY

      - name: Build bounded ranking lookup
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ranking_lookup.py

      - name: Commit canonical payload and review export
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add -A data/production/visual/current.json data/production/visual/ranking_review.jsonl data/production/visual/ranking_lookup
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No visual payload or review changes"
            exit 0
          fi
          git commit -m "Refresh daily visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
