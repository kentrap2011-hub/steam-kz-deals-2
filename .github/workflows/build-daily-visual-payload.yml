name: Build daily visual payload

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build pre-AI deterministic payload"
      - "Ingest context-bound taste batch"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "scripts/build_daily_visual_payload.py"
      - "scripts/build_visual_feed_v2.py"
      - "scripts/achievement_quality.py"
      - "scripts/refine_visual_ranking.py"
      - ".github/workflows/build-daily-visual-payload.yml"

permissions:
  contents: write

concurrency:
  group: daily-visual-payload
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical visual payload when production is ready
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            export FORCE_VISUAL_BUILD=1
          fi
          python scripts/build_daily_visual_payload.py | tee /tmp/visual-build.log
          if grep -q 'VISUAL_DAILY_BUILD=BUILT' /tmp/visual-build.log; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # One-time recovery guard for the payload that was refined after the
      # next nightly source had already started but before its AI queue closed.
      # Remove this step after the safe snapshot has been restored once.
      - name: Restore last safe visual snapshot if current payload was cross-mixed
        id: repair
        if: steps.build.outputs.built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/repair-decision
          import json
          from pathlib import Path

          current = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text(encoding='utf-8'))
          contract = current.get('production_contract') or {}
          mixed = bool(
              contract.get('ranking_refiner_blob_sha')
              and int(payload.get('ai_queue_count') or 0) > 0
              and current.get('source_mailing_updated_at_utc') != payload.get('source_mailing_updated_at_utc')
          )
          print('true' if mixed else 'false')
          PY
          repair="$(cat /tmp/repair-decision)"
          echo "repaired=$repair" >> "$GITHUB_OUTPUT"
          if [[ "$repair" == "true" ]]; then
            git show ec3e5cc730f5b2481cadac7fa3b4c6f7f179151e:data/production/visual/current.json > data/production/visual/current.json
            git show ec3e5cc730f5b2481cadac7fa3b4c6f7f179151e:data/production/visual/ranking_review.jsonl > data/production/visual/ranking_review.jsonl
            echo "Restored last safe completed visual snapshot"
          else
            echo "No cross-mixed visual payload detected"
          fi

      - name: Refine personal risks and ranking
        if: steps.build.outputs.built == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refine_visual_ranking.py

      - name: Build ranking review export
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('data/production/visual/current.json')
          out = Path('data/production/visual/ranking_review.jsonl')
          data = json.loads(src.read_text(encoding='utf-8'))

          rows = []
          for game in sorted(data.get('items') or [], key=lambda g: int(g.get('priority_rank') or 999999)):
              practical = game.get('practical') or {}
              direct = game.get('direct_user_evidence') or {}
              row = {
                  'rank': game.get('priority_rank'),
                  'taste_rank': game.get('taste_rank'),
                  'id': game.get('id'),
                  'title': game.get('title'),
                  'source_fit': game.get('source_fit'),
                  'fit': game.get('fit'),
                  'fit_adjustment_reason': game.get('fit_adjustment_reason'),
                  'taste_confidence': game.get('taste_confidence'),
                  'direct_user_rating': direct.get('rating'),
                  'direct_user_evidence_level': direct.get('level'),
                  'decision': game.get('decision'),
                  'priority_bucket': game.get('priority_bucket'),
                  'strengths': game.get('why_fit') or [],
                  'gameplay_points': game.get('gameplay_points') or [],
                  'weaknesses_risks': game.get('risks') or [],
                  'risk_codes': game.get('risk_codes') or [],
                  'risk_level': game.get('risk_level'),
                  'risk_penalty': game.get('risk_penalty'),
                  'windows_status': practical.get('windows_status'),
                  'legacy_windows_requirement_label': practical.get('legacy_windows_requirement_label'),
                  'modern_windows_friction': practical.get('modern_windows_friction'),
                  'steam_achievements': practical.get('steam_achievements'),
                  'achievement_total': practical.get('achievement_total'),
                  'achievement_quality': practical.get('achievement_quality'),
                  'achievement_quality_evidence': practical.get('achievement_quality_evidence'),
                  'estimated_duration_hours': game.get('estimated_duration_hours'),
                  'duration_preference_band': game.get('duration_preference_band'),
                  'wishlist': bool(game.get('wishlist')),
                  'current_price_rub': game.get('current_price_rub'),
                  'original_price_rub': game.get('original_price_rub'),
                  'discount_percent': game.get('discount_percent'),
                  'historical_minimum_rub': game.get('historical_minimum_rub'),
                  'history_quality': game.get('history_quality'),
                  'previously_free': bool(game.get('previously_free')),
                  'sale_end_utc': game.get('sale_end_utc'),
                  'summary': game.get('summary'),
                  'steam_web_url': game.get('web_url'),
              }
              rows.append(json.dumps(row, ensure_ascii=False, separators=(',', ':')))

          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'RANKING_REVIEW_ROWS={len(rows)}')
          PY

      - name: Commit canonical payload and review export
        if: steps.build.outputs.built == 'true' || steps.repair.outputs.repaired == 'true'
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/production/visual/current.json data/production/visual/ranking_review.jsonl
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No visual payload or review changes"
            exit 0
          fi
          git commit -m "Refresh daily visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1