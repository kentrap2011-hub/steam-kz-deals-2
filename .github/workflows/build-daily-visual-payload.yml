name: Build daily visual payload

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build pre-AI deterministic payload"
      - "Ingest context-bound taste batch"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "scripts/build_daily_visual_payload.py"
      - "scripts/build_visual_feed_v2.py"
      - ".github/workflows/build-daily-visual-payload.yml"

permissions:
  contents: write

concurrency:
  group: daily-visual-payload
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical visual payload when production is ready
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            export FORCE_VISUAL_BUILD=1
          fi
          python scripts/build_daily_visual_payload.py | tee /tmp/visual-build.log
          if grep -q 'VISUAL_DAILY_BUILD=BUILT' /tmp/visual-build.log; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit canonical ready payload
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/production/visual/current.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No visual payload changes"
            exit 0
          fi
          git commit -m "Refresh daily visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
