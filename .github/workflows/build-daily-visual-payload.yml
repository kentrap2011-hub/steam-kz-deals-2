name: Build daily visual payload

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build pre-AI deterministic payload"
      - "Ingest context-bound taste batch"
      - "Ingest Progressive PASS 1 item"
      - "Ingest Progressive PASS 2 item"
      - "Ingest Steam review dossier checkpoint"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "scripts/build_final_visual_payload.py"
      - "scripts/progressive_personalization.py"
      - "scripts/progressive_pass1.py"
      - "scripts/progressive_pass2.py"
      - "scripts/test_progressive_pass1.py"
      - "scripts/test_progressive_pass2.py"
      - "scripts/test_progressive_personalization.py"
      - "scripts/test_deep_first_final_score_order.py"
      - "scripts/test_progressive_unresolved_row_preservation.py"
      - "scripts/progressive_visual_activation_routing.py"
      - "scripts/test_progressive_visual_activation_routing.py"
      - "scripts/build_daily_visual_payload.py"
      - "scripts/build_visual_feed_v2.py"
      - "scripts/card_explanation_policy.py"
      - "scripts/test_card_explanation_policy.py"
      - "scripts/validate_card_explanations.py"
      - "scripts/giveaway_visual_handoff.py"
      - "scripts/test_giveaway_visual_handoff.py"
      - "scripts/validate_giveaway_visual_payload.py"
      - "scripts/duration_enrichment.py"
      - "scripts/test_duration_enrichment.py"
      - "scripts/validate_duration_enrichment_contract.py"
      - "scripts/russian_description_quality.py"
      - "scripts/test_russian_description_quality.py"
      - "scripts/validate_russian_descriptions.py"
      - "scripts/test_russian_translation_publication_statistics.py"
      - "scripts/build_russian_description_translation_queue.py"
      - "scripts/ingest_russian_description_translations.py"
      - "config/russian_description_translation_contract.json"
      - "config/russian_description_translation_result_contract.json"
      - "config/russian_description_manual_semantic_worker_prompt.md"
      - "config/execution_ownership_contract.json"
      - "config/progressive_personalization_contract.json"
      - "scripts/test_russian_description_manual_semantic_worker.py"
      - "scripts/apply_fixed_package_purchase_options.py"
      - "scripts/refresh_visual_commercial_fields.py"
      - "scripts/test_commercial_refresh.py"
      - "scripts/test_fixed_package_purchase_options.py"
      - "scripts/normalize_visual_media_urls.py"
      - "scripts/grounded_negative_visual.py"
      - "scripts/achievement_quality.py"
      - "scripts/refine_visual_ranking.py"
      - "scripts/priority_ranking.py"
      - "scripts/validate_priority_ranking.py"
      - "scripts/validate_taste_v3_contract.py"
      - "scripts/ingest_taste_results.py"
      - "scripts/taste_cache_common.py"
      - "scripts/build_ranking_lookup.py"
      - "scripts/visual_freshness_receipt.py"
      - "scripts/test_visual_freshness_receipt.py"
      - "scripts/visual_material_freshness_guard.py"
      - "scripts/test_visual_material_freshness_guard.py"
      - "scripts/build_ranking_review.py"
      - "config/duration_enrichment_contract.json"
      - "config/final_ranking_policy.json"
      - "config/progressive_personalization_contract.json"
      - "config/progressive_pass1_contract.json"
      - "config/progressive_pass2_contract.json"
      - "data/cache/progressive_pass1_state.json"
      - "data/cache/progressive_pass2_state.json"
      - "config/fixed_package_purchase_option_contract.json"
      - "config/purchase_equivalence_overrides.json"
      - "config/taste_result_contract.json"
      - "config/taste_cache_entry_contract.json"
      - "data/cache/duration_estimates.json"
      - "data/production/giveaways/v1/current.json"
      - "web/app.js"
      - "web/progressive-personalization-ui.js"
      - "web/progressive-personalization-ui.test.js"
      - "web/giveaway-ui.js"
      - "web/giveaway-ui.test.js"
      - "web/giveaway-ui.css"
      - "web/package-deal-ui.js"
      - "web/paid-freshness-ui.js"
      - "web/paid-freshness-ui.test.js"
      - "web/index.html"
      - ".github/workflows/build-daily-visual-payload.yml"

permissions:
  contents: write

concurrency:
  group: daily-visual-payload
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      giveaway_only: ${{ steps.classify.outputs.giveaway_only }}
      commercial_only: ${{ steps.classify.outputs.commercial_only }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate progressive activation routing
        run: python scripts/test_progressive_visual_activation_routing.py

      - name: Classify bounded visual refresh scopes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          giveaway_needed=false

          # Giveaway freshness remains its own bounded sibling. Do not require the
          # triggering commit itself to be giveaway-only because source snapshots
          # can be produced inside mixed production commits.
          source_giveaway_blob=$(git rev-parse HEAD:data/production/giveaways/v1/current.json)
          visual_giveaway_blob=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          print((data.get('production_contract') or {}).get('source_giveaway_snapshot_blob_sha') or '')
          PY
          )
          if [ -n "$source_giveaway_blob" ] && [ "$source_giveaway_blob" != "$visual_giveaway_blob" ]; then
            giveaway_needed=true
            echo "VISUAL_SCOPE giveaway_only=true reason=source_provenance_mismatch source_blob=$source_giveaway_blob visual_source_blob=${visual_giveaway_blob:-missing}"
          fi

          # Commercial freshness is intentionally independent of ChatGPT semantic
          # completeness. Only deterministic commercial source state participates
          # in this decision; a payload-only semantic rewrite must not steal a full
          # semantic build from the existing fail-closed path.
          commercial_needed=$(python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def blob(path):
              return subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()

          try:
              payload = read('data/production/pre_ai/chatgpt_payload.json')
              store = read('data/production/pre_ai/store_snapshot.json')
              family = read('data/production/pre_ai/family_graph.json')
              visual = read('data/production/visual/current.json')
          except Exception:
              print('false')
              raise SystemExit(0)

          source = payload.get('source_mailing_updated_at_utc')
          bound = bool(
              source
              and store.get('status') == 'complete'
              and family.get('status') == 'complete'
              and store.get('discovery_source_updated_at_utc') == source
              and family.get('source_updated_at_utc') == source
          )
          if not bound:
              print('false')
              raise SystemExit(0)

          contract = visual.get('production_contract') or {}
          paid = visual.get('paid_list_freshness') or {}
          expected = {
              'commercial_source_store_snapshot_blob_sha': blob('data/production/pre_ai/store_snapshot.json'),
              'commercial_source_family_graph_blob_sha': blob('data/production/pre_ai/family_graph.json'),
              'commercial_source_history_snapshot_blob_sha': blob('data/production/pre_ai/history_snapshot.json'),
          }
          stale = (
              visual.get('commercial_source_mailing_updated_at_utc') != source
              or paid.get('status') != 'published'
              or paid.get('source_mailing_updated_at_utc') != source
              or any(contract.get(key) != value for key, value in expected.items())
          )
          if stale:
              print(
                  'COMMERCIAL_SCOPE_REASON '
                  f'source={source} visual_source={visual.get("commercial_source_mailing_updated_at_utc")} '
                  f'paid_source={paid.get("source_mailing_updated_at_utc")}',
                  file=__import__('sys').stderr,
              )
          print('true' if stale else 'false')
          PY
          )

          # Progressive Phase A is a full visual build, not a bounded commercial
          # refresh. If the current deterministic candidate projection is not yet
          # represented by the canonical visual provenance/state, force the full path.
          progressive_needed=$(python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          try:
              payload = read('data/production/pre_ai/chatgpt_payload.json')
              visual = read('data/production/visual/current.json')
              progressive_path = Path('data/production/pre_ai/progressive_candidate_context.jsonl')
              progressive_blob = subprocess.check_output(
                  ['git','rev-parse','HEAD:data/production/pre_ai/progressive_candidate_context.jsonl'],
                  text=True,
              ).strip()
              progressive_lines = sum(1 for line in progressive_path.read_text(encoding='utf-8').splitlines() if line.strip())
          except Exception:
              print('false')
              raise SystemExit(0)

          expected = int(payload.get('progressive_candidate_count') or 0)
          contract = visual.get('production_contract') or {}
          progressive = visual.get('progressive_personalization') or {}
          processing = visual.get('processing_status') or {}
          represented = bool(
              expected == progressive_lines
              and contract.get('source_progressive_candidate_context_blob_sha') == progressive_blob
              and progressive.get('contract') == 'PROGRESSIVE-PERSONALIZED-DEALS-V1'
              and progressive.get('phase') == 'phase_a'
              and processing.get('contract') == 'PROGRESSIVE-PERSONALIZED-DEALS-V1'
              and int(processing.get('total_current_candidates') or -1) <= expected
          )
          print('false' if represented else 'true')
          PY
          )
          if [ "$progressive_needed" = "true" ]; then
            commercial_needed=false
            echo "VISUAL_SCOPE full_progressive=true reason=progressive_projection_not_yet_published"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > /tmp/visual-changed.txt
            cat /tmp/visual-changed.txt

            # Preserve the legacy bounded giveaway maintenance fallback.
            giveaway_allowed='^(scripts/build_final_visual_payload\.py|scripts/giveaway_visual_handoff\.py|scripts/test_giveaway_visual_handoff\.py|scripts/validate_giveaway_visual_payload\.py|data/production/giveaways/v1/current\.json|web/giveaway-ui\.js|web/giveaway-ui\.test\.js|web/giveaway-ui\.css|web/app\.js|web/index\.html|\.github/workflows/build-daily-visual-payload\.yml)$'
            if ! grep -Ev "$giveaway_allowed" /tmp/visual-changed.txt | grep -q .; then
              if git diff "$BEFORE_SHA" "$HEAD_SHA" -- $(cat /tmp/visual-changed.txt) | grep -qi 'giveaway'; then
                giveaway_needed=true
              fi
            fi

            # Code-only changes to this bounded commercial handoff should validate
            # through commercial_only rather than accidentally entering the full
            # semantic build. This never applies to arbitrary Taste/semantic files.
            commercial_allowed='^(scripts/build_final_visual_payload\.py|scripts/refresh_visual_commercial_fields\.py|scripts/test_commercial_refresh\.py|scripts/test_fixed_package_purchase_options\.py|scripts/visual_freshness_receipt\.py|scripts/test_visual_freshness_receipt\.py|web/paid-freshness-ui\.js|web/paid-freshness-ui\.test\.js|web/index\.html|\.github/workflows/build-daily-visual-payload\.yml)$'
            if ! grep -Ev "$commercial_allowed" /tmp/visual-changed.txt | grep -q .; then
              if git diff "$BEFORE_SHA" "$HEAD_SHA" -- $(cat /tmp/visual-changed.txt) | grep -Eqi 'commercial|paid[_ -]?freshness'; then
                commercial_needed=true
                echo "VISUAL_SCOPE commercial_only=true reason=bounded_commercial_implementation_push"
              fi
            fi
          fi

          full_progressive_required=$(python scripts/progressive_visual_activation_routing.py)
          if [ "$full_progressive_required" = "true" ]; then
            # A stale/missing/incompatible progressive visual must be rebuilt as a
            # whole. Full build already refreshes giveaway and commercial fields,
            # so bounded refresh scopes must not pre-empt it.
            giveaway_needed=false
            commercial_needed=false
            echo "VISUAL_SCOPE full_progressive_build=true reason=progressive_visual_incompatible"
          fi

          echo "giveaway_only=$giveaway_needed" >> "$GITHUB_OUTPUT"
          echo "commercial_only=$commercial_needed" >> "$GITHUB_OUTPUT"
          echo "VISUAL_SCOPE giveaway_only=$giveaway_needed commercial_only=$commercial_needed"

  giveaway_refresh:
    needs: scope
    if: >
      needs.scope.outputs.giveaway_only == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended source cycle for freshness receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Validate giveaway visual handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_giveaway_visual_handoff.py

      - name: Record accepted paid payload fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/paid-items-before.sha256
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          raw = json.dumps(data.get('items') or [], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(raw).hexdigest())
          PY
          echo "PAID_ITEMS_BEFORE=$(cat /tmp/paid-items-before.sha256)"

      - name: Refresh only canonical giveaway visual sibling
        env:
          GIVEAWAY_VISUAL_REFRESH_ONLY: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_final_visual_payload.py | tee /tmp/giveaway-visual-refresh.log
          grep -q 'VISUAL_GIVEAWAY_REFRESH=BUILT' /tmp/giveaway-visual-refresh.log

      - name: Validate generated giveaway visual field
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_giveaway_visual_payload.py data/production/visual/current.json

      - name: Prove paid payload remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/paid-items-after.sha256
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          raw = json.dumps(data.get('items') or [], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(raw).hexdigest())
          PY
          echo "PAID_ITEMS_AFTER=$(cat /tmp/paid-items-after.sha256)"
          test "$(cat /tmp/paid-items-before.sha256)" = "$(cat /tmp/paid-items-after.sha256)"

      - name: Prove mutation is giveaway sibling plus provenance only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          path = 'data/production/visual/current.json'
          before = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True))
          after = json.loads(Path(path).read_text(encoding='utf-8'))
          allowed_contract = {
              'final_visual_producer_blob_sha',
              'giveaway_visual_handoff_blob_sha',
              'source_giveaway_snapshot_blob_sha',
              'giveaway_visual_schema_version',
          }

          def stable_without_giveaway(data):
              data = copy.deepcopy(data)
              data.pop('giveaways', None)
              contract = data.get('production_contract') or {}
              for key in allowed_contract:
                  contract.pop(key, None)
              return data

          if stable_without_giveaway(before) != stable_without_giveaway(after):
              raise SystemExit('giveaway-only refresh changed non-giveaway production state')
          print('GIVEAWAY_AUXILIARY_DIFF=PASS non_giveaway_state_unchanged=true')
          PY

      - name: Commit canonical giveaway visual sibling
        id: persist_giveaway
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/production/visual/current.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No giveaway visual change"
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh giveaway visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Create degraded freshness receipt for giveaway-only invocation
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PERSISTED: ${{ steps.persist_giveaway.outputs.persisted }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/visual-freshness-intent.json ]; then
            python scripts/visual_freshness_receipt.py capture-intent \
              --output /tmp/visual-freshness-intent.json
          fi
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported false \
            --persisted "$PERSISTED" \
            --history-ready false \
            --reason giveaway_only_refresh

      - name: Upload visual freshness receipt
        if: always() && needs.scope.outputs.commercial_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30

  commercial_refresh:
    needs: [scope, giveaway_refresh]
    if: >
      always() &&
      needs.scope.outputs.commercial_only == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')) &&
      (needs.giveaway_refresh.result == 'success' || needs.giveaway_refresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended commercial source for freshness receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Validate bounded commercial refresh contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_commercial_refresh.py
          python scripts/test_fixed_package_purchase_options.py
          python scripts/test_visual_freshness_receipt.py
          python scripts/test_visual_material_freshness_guard.py
          node web/paid-freshness-ui.test.js

      - name: Record giveaway sibling fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/giveaway-before.sha256
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          contract = data.get('production_contract') or {}
          bounded = {
              'giveaways': data.get('giveaways') or {},
              'provenance': {
                  key: contract.get(key)
                  for key in (
                      'giveaway_visual_handoff_blob_sha',
                      'source_giveaway_snapshot_blob_sha',
                      'giveaway_visual_schema_version',
                  )
              },
          }
          raw = json.dumps(bounded, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(raw).hexdigest())
          PY
          echo "GIVEAWAY_BEFORE=$(cat /tmp/giveaway-before.sha256)"

      - name: Refresh only canonical paid commercial state
        env:
          COMMERCIAL_VISUAL_REFRESH_ONLY: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_final_visual_payload.py | tee /tmp/commercial-visual-refresh.log
          grep -q 'VISUAL_COMMERCIAL_REFRESH=BUILT' /tmp/commercial-visual-refresh.log

      - name: Validate commercial publication freshness and stale-row removal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def blob(path):
              return subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()

          payload = read('data/production/pre_ai/chatgpt_payload.json')
          store = read('data/production/pre_ai/store_snapshot.json')
          family = read('data/production/pre_ai/family_graph.json')
          visual = read('data/production/visual/current.json')
          contract = visual.get('production_contract') or {}
          paid = visual.get('paid_list_freshness') or {}
          refresh = visual.get('commercial_refresh') or {}

          source = payload.get('source_mailing_updated_at_utc')
          assert source, 'missing commercial source timestamp'
          assert store.get('status') == 'complete'
          assert family.get('status') == 'complete'
          assert store.get('discovery_source_updated_at_utc') == source
          assert family.get('source_updated_at_utc') == source
          assert visual.get('commercial_source_mailing_updated_at_utc') == source
          assert paid.get('status') == 'published'
          assert paid.get('scope') == 'commercial_only'
          assert paid.get('source_mailing_updated_at_utc') == source
          assert paid.get('store_observed_at_utc') == store.get('observed_at_utc')
          assert refresh.get('taste_recalculated') is False
          assert refresh.get('semantic_fields_rewritten') is False

          bindings = {
              'payload_blob_sha': ('data/production/pre_ai/chatgpt_payload.json', 'commercial_source_payload_blob_sha'),
              'store_snapshot_blob_sha': ('data/production/pre_ai/store_snapshot.json', 'commercial_source_store_snapshot_blob_sha'),
              'family_graph_blob_sha': ('data/production/pre_ai/family_graph.json', 'commercial_source_family_graph_blob_sha'),
              'history_snapshot_blob_sha': ('data/production/pre_ai/history_snapshot.json', 'commercial_source_history_snapshot_blob_sha'),
              'helper_blob_sha': ('scripts/refresh_visual_commercial_fields.py', 'commercial_refresh_helper_blob_sha'),
          }
          for paid_key, (path, contract_key) in bindings.items():
              expected = blob(path)
              assert contract.get(contract_key) == expected, (contract_key, contract.get(contract_key), expected)
              assert paid.get(paid_key) == expected, (paid_key, paid.get(paid_key), expected)

          items = visual.get('items') or []
          ids = [str(item.get('id')) for item in items]
          assert len(ids) == len(set(ids)), 'duplicate visible family rows after commercial refresh'

          now = datetime.now(timezone.utc)
          expired = []
          for item in items:
              value = item.get('sale_end_utc')
              if not value:
                  continue
              try:
                  end = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
              except ValueError:
                  raise AssertionError(f'invalid sale_end_utc: {item.get("id")}={value}')
              if end <= now:
                  expired.append((item.get('id'), item.get('title'), value))
          assert not expired, f'expired sale rows remain visible: {expired[:10]}'

          print(
              'COMMERCIAL_PUBLICATION_VALIDATION=PASS '
              f'source={source} items={len(items)} '
              f'removed_stale={refresh.get("removed_stale_family_count")} '
              f'prices_changed={refresh.get("price_changed_item_count")} '
              f'offers_changed={refresh.get("offer_set_changed_item_count")}'
          )
          PY

      - name: Prove giveaway sibling remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/giveaway-after.sha256
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('data/production/visual/current.json').read_text(encoding='utf-8'))
          contract = data.get('production_contract') or {}
          bounded = {
              'giveaways': data.get('giveaways') or {},
              'provenance': {
                  key: contract.get(key)
                  for key in (
                      'giveaway_visual_handoff_blob_sha',
                      'source_giveaway_snapshot_blob_sha',
                      'giveaway_visual_schema_version',
                  )
              },
          }
          raw = json.dumps(bounded, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(raw).hexdigest())
          PY
          echo "GIVEAWAY_AFTER=$(cat /tmp/giveaway-after.sha256)"
          test "$(cat /tmp/giveaway-before.sha256)" = "$(cat /tmp/giveaway-after.sha256)"

      - name: Commit canonical commercial visual refresh
        id: persist_commercial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add data/production/visual/current.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No commercial visual change"
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh commercial visual payload"

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Create scoped commercial freshness receipt
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PERSISTED: ${{ steps.persist_commercial.outputs.persisted }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/visual-freshness-intent.json ]; then
            python scripts/visual_freshness_receipt.py capture-intent \
              --output /tmp/visual-freshness-intent.json
          fi
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported false \
            --persisted "$PERSISTED" \
            --history-ready false \
            --reason commercial_only_refresh

      - name: Upload visual freshness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30

  no_build_receipt:
    needs: scope
    if: >
      needs.scope.outputs.giveaway_only != 'true' &&
      needs.scope.outputs.commercial_only != 'true' &&
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion != 'success' ||
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended source cycle for skipped build receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Create degraded freshness receipt for ineligible upstream run
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported false \
            --persisted false \
            --history-ready false \
            --reason upstream_prerequisite_not_ready

      - name: Upload visual freshness receipt
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: scope
    if: >
      needs.scope.outputs.giveaway_only != 'true' &&
      needs.scope.outputs.commercial_only != 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture intended source cycle for freshness receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json

      - name: Validate visual freshness receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_visual_freshness_receipt.py
          python scripts/test_visual_material_freshness_guard.py

      - name: Validate normalized taste factor contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_taste_v3_contract.py

      - name: Validate canonical priority ranking contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_priority_ranking.py
          python scripts/test_deep_first_final_score_order.py
          python scripts/test_progressive_personalization.py
          python scripts/test_progressive_pass1.py
          python scripts/test_progressive_unresolved_row_preservation.py
          node web/progressive-personalization-ui.test.js

      - name: Validate canonical duration enrichment contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_duration_enrichment_contract.py
          python scripts/test_duration_enrichment.py

      - name: Validate card explanation policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_card_explanation_policy.py

      - name: Validate giveaway visual handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_giveaway_visual_handoff.py

      - name: Check IGDB duration provisioning and connectivity
        id: duration_connectivity
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          production_enabled=$(python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('config/duration_enrichment_contract.json').read_text(encoding='utf-8'))
          print('true' if (contract.get('provisioning_gates') or {}).get('production_collection_enabled') else 'false')
          PY
          )
          echo "production_enabled=$production_enabled" >> "$GITHUB_OUTPUT"

          if [ -z "${IGDB_CLIENT_ID:-}" ] || [ -z "${IGDB_CLIENT_SECRET:-}" ]; then
            echo "DURATION_IGDB_PROVISIONING=missing_credentials expected_secrets=IGDB_CLIENT_ID,IGDB_CLIENT_SECRET"
            echo "status=missing_credentials" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$production_enabled" = "true" ]; then
            echo "DURATION_IGDB_PROVISIONING=credentials_present production_collection_enabled=true"
            echo "status=ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/duration_enrichment.py --connectivity-only | tee /tmp/duration-connectivity.log
          grep -q 'DURATION_IGDB_CONNECTIVITY=PASS' /tmp/duration-connectivity.log
          echo "status=connectivity_pass" >> "$GITHUB_OUTPUT"

      - name: Validate fresh commercial refresh and fixed package ranking value
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_commercial_refresh.py
          python scripts/test_fixed_package_purchase_options.py

      - name: Validate Russian description quality and publication observability
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_execution_ownership.py
          python scripts/validate_russian_description_translation_contract.py
          python scripts/test_russian_description_quality.py
          python scripts/test_russian_description_translation_runtime.py
          python scripts/test_russian_description_manual_semantic_worker.py
          python scripts/test_russian_translation_publication_statistics.py

      - name: Require complete history classification coverage before replacing daily visual
        id: history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/production/pre_ai/history_snapshot.json')
          if not path.exists():
              print('HISTORY_READY=false reason=missing_snapshot')
              with open('/tmp/history-ready', 'w', encoding='utf-8') as fh:
                  fh.write('false\n')
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding='utf-8'))
          counts = data.get('cache_status_counts') or {}
          missing = int(counts.get('missing') or 0)
          ready = data.get('status') == 'complete' and data.get('complete_coverage') is True
          print(
              f'HISTORY_READY={str(ready).lower()} '
              f'missing_as_unverified={missing} complete_coverage={data.get("complete_coverage")} '
              f'primary_count={data.get("primary_count")}'
          )
          with open('/tmp/history-ready', 'w', encoding='utf-8') as fh:
              fh.write(('true' if ready else 'false') + '\n')
          PY
          echo "ready=$(cat /tmp/history-ready)" >> "$GITHUB_OUTPUT"

      - name: Refresh missing or stale IGDB duration cache
        id: duration
        if: >
          steps.history.outputs.ready == 'true' &&
          steps.duration_connectivity.outputs.production_enabled == 'true' &&
          steps.duration_connectivity.outputs.status != 'missing_credentials'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/duration_enrichment.py | tee /tmp/duration-enrichment.log
          if grep -q 'DURATION_CACHE_CHANGED=true' /tmp/duration-enrichment.log; then
            echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture exact full visual material state
        if: steps.history.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_freshness_receipt.py capture-intent \
            --output /tmp/visual-freshness-intent.json
          python scripts/visual_material_freshness_guard.py capture \
            --output /tmp/full-visual-material-state.json

      - name: Build and refresh canonical visual payload once
        id: build
        if: steps.history.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export FORCE_VISUAL_BUILD=1
          python scripts/build_final_visual_payload.py | tee /tmp/visual-build.log
          python scripts/normalize_visual_media_urls.py | tee /tmp/media-refresh.log
          if grep -q 'VISUAL_FINAL_BUILD=BUILT' /tmp/visual-build.log || \
             grep -Eq 'VISUAL_MEDIA_ITEMS_CHANGED=[1-9][0-9]*' /tmp/media-refresh.log; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated card explanations
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_card_explanations.py data/production/visual/current.json 30

      - name: Validate generated giveaway visual field
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_giveaway_visual_payload.py data/production/visual/current.json

      - name: Record Russian description publication diagnostic
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_russian_descriptions.py data/production/visual/current.json --allow-untranslated

      - name: Validate exact full visual material binding
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/visual_material_freshness_guard.py validate-visual \
            --state /tmp/full-visual-material-state.json \
            --visual data/production/visual/current.json

      - name: Build ranking review export
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ranking_review.py

      - name: Build bounded ranking lookup
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ranking_lookup.py

      - name: Commit canonical duration cache, payload and review export
        id: persist
        if: steps.build.outputs.built == 'true' || steps.duration.outputs.cache_changed == 'true'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          DURATION_PRODUCTION_ENABLED: ${{ steps.duration_connectivity.outputs.production_enabled }}
          DURATION_CONNECTIVITY_STATUS: ${{ steps.duration_connectivity.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          echo "reason=" >> "$GITHUB_OUTPUT"

          stage_visual_outputs() {
            git add -A \
              data/cache/duration_estimates.json \
              data/production/visual/current.json \
              data/production/visual/ranking_review.jsonl \
              data/production/visual/ranking_lookup
            git diff --cached --check
          }

          capture_exact_material_state() {
            python scripts/visual_freshness_receipt.py capture-intent \
              --output /tmp/visual-freshness-intent.json
            python scripts/visual_material_freshness_guard.py capture \
              --output /tmp/full-visual-material-state.json
          }

          validate_exact_visual_binding() {
            python scripts/visual_material_freshness_guard.py validate-visual \
              --state /tmp/full-visual-material-state.json \
              --visual data/production/visual/current.json
          }

          rebuild_full_visual_from_fresh_main() {
            echo "MATERIAL_DRIFT_REBUILD=true"
            git reset --hard origin/main
            git clean -ffd

            if [ "${DURATION_PRODUCTION_ENABLED:-false}" = "true" ] && \
               [ "${DURATION_CONNECTIVITY_STATUS:-}" != "missing_credentials" ]; then
              python scripts/duration_enrichment.py | tee /tmp/duration-enrichment-rebuild.log
            fi

            capture_exact_material_state
            export FORCE_VISUAL_BUILD=1
            python scripts/build_final_visual_payload.py | tee /tmp/visual-build-rebuild.log
            python scripts/normalize_visual_media_urls.py | tee /tmp/media-refresh-rebuild.log
            python scripts/validate_card_explanations.py data/production/visual/current.json 30
            python scripts/validate_giveaway_visual_payload.py data/production/visual/current.json
            python scripts/validate_russian_descriptions.py data/production/visual/current.json --allow-untranslated
            python scripts/build_ranking_review.py
            python scripts/build_ranking_lookup.py
            validate_exact_visual_binding
            stage_visual_outputs
          }

          validate_exact_visual_binding
          stage_visual_outputs
          if git diff --cached --quiet; then
            echo "No duration cache, visual payload or review changes"
            python scripts/visual_material_freshness_guard.py verify-ref \
              --state /tmp/full-visual-material-state.json --ref HEAD
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Refresh daily visual payload"
          rebuilt_after_material_drift=false

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              python scripts/visual_material_freshness_guard.py verify-ref \
                --state /tmp/full-visual-material-state.json --ref HEAD
              echo "reason=" >> "$GITHUB_OUTPUT"
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git fetch origin main:refs/remotes/origin/main
            set +e
            python scripts/visual_material_freshness_guard.py compare-parent \
              --state /tmp/full-visual-material-state.json \
              --candidate-ref origin/main
            drift_rc=$?
            set -e

            if [ "$drift_rc" -eq 42 ]; then
              if [ "$rebuilt_after_material_drift" = "true" ]; then
                echo "reason=material_source_drift_after_rebuild" >> "$GITHUB_OUTPUT"
                echo "VISUAL_PERSISTENCE_ABORTED=material_source_drift_after_rebuild"
                exit 1
              fi

              rebuilt_after_material_drift=true
              echo "reason=material_source_drift_rebuild_failed" >> "$GITHUB_OUTPUT"
              rebuild_full_visual_from_fresh_main

              if git diff --cached --quiet; then
                python scripts/visual_material_freshness_guard.py verify-ref \
                  --state /tmp/full-visual-material-state.json --ref HEAD
                echo "reason=" >> "$GITHUB_OUTPUT"
                echo "persisted=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              git commit -m "Refresh daily visual payload after material drift"
              echo "reason=" >> "$GITHUB_OUTPUT"
              continue
            fi

            if [ "$drift_rc" -ne 0 ]; then
              echo "reason=material_source_comparison_failed" >> "$GITHUB_OUTPUT"
              exit "$drift_rc"
            fi

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "reason=canonical_rebase_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            validate_exact_visual_binding
            sleep $((attempt * 3))
          done

          echo "reason=canonical_persistence_failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Create durable visual freshness receipt
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_REPORTED: ${{ steps.build.outputs.built }}
          PERSISTED: ${{ steps.persist.outputs.persisted }}
          HISTORY_READY: ${{ steps.history.outputs.ready }}
          PERSIST_REASON: ${{ steps.persist.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/visual-freshness-intent.json ]; then
            python scripts/visual_freshness_receipt.py capture-intent \
              --output /tmp/visual-freshness-intent.json
          fi
          python scripts/visual_freshness_receipt.py create-receipt \
            --intent /tmp/visual-freshness-intent.json \
            --output /tmp/visual-freshness-receipt.json \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-head-sha "$UPSTREAM_HEAD_SHA" \
            --build-reported "$BUILD_REPORTED" \
            --persisted "$PERSISTED" \
            --history-ready "$HISTORY_READY" \
            --reason "$PERSIST_REASON"

      - name: Upload visual freshness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-freshness-receipt
          path: /tmp/visual-freshness-receipt.json
          if-no-files-found: error
          retention-days: 30
