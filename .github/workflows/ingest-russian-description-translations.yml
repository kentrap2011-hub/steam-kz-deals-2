name: Ingest Russian description translations

on:
  push:
    branches: [main]
    paths:
      - "data/ai_inbox/russian_descriptions/*.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-russian-description-translations
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical translation contracts
        run: |
          set -euo pipefail
          python scripts/validate_execution_ownership.py
          python scripts/validate_russian_description_translation_contract.py

      - name: Run translation runtime regressions
        run: |
          set -euo pipefail
          python scripts/test_russian_description_translation_runtime.py
          python -m py_compile \
            scripts/russian_description_translation_runtime.py \
            scripts/build_russian_description_translation_queue.py \
            scripts/ingest_russian_description_translations.py

      - name: Validate and ingest current submissions
        id: ingest
        run: |
          set -euo pipefail
          python scripts/ingest_russian_description_translations.py --github-output "$GITHUB_OUTPUT"

      - name: Commit canonical cache and refreshed scope
        if: steps.ingest.outputs.submission_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            data/cache/russian_description_translations.json \
            data/production/pre_ai/chatgpt_ru_description_queue.jsonl \
            data/production/pre_ai/chatgpt_ru_description_status.json \
            data/production/pre_ai/chatgpt_payload.json \
            data/ai_inbox/russian_descriptions || true
          if git diff --cached --quiet; then
            echo "No canonical translation state changes"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Ingest Russian description translations"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Rebuild visual payload after accepted translations
        if: steps.ingest.outputs.accepted_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-daily-visual-payload.yml --ref main
