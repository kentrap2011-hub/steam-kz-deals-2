name: Apply final ranking patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_final_ranking_patch.py"
      - ".github/workflows/apply-final-ranking-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply_final_ranking_patch.py
      - name: Validate policy and deal boundaries
        run: |
          python scripts/validate_mailing_policy.py
          python scripts/build_pre_ai_deal_scenarios.py
          # Boundary validation regenerates this production artifact only for the test.
          # The normal pre-AI workflow will rebuild and commit it after the logic patch lands.
          git restore data/production/pre_ai/deal_scenarios.json
      - name: Commit patched ranking logic
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add \
            PROJECT_RULES.md \
            config/mailing_policy.json \
            config/deal_quality_contract.json \
            config/daily_execution_contract.json \
            scripts/build_pre_ai_deal_scenarios.py \
            scripts/build_pre_ai_chatgpt_payload.py \
            scripts/validate_mailing_policy.py
          if git diff --cached --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git commit -m "Implement qualitative 60-40 final ranking"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
