name: Apply final ranking patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply_final_ranking_patch.py
      - name: Validate policy and deal boundaries
        run: |
          python scripts/validate_mailing_policy.py
          python scripts/build_pre_ai_deal_scenarios.py
          git restore data/production/pre_ai/deal_scenarios.json
      - name: Commit patched ranking logic
        run: |
          echo "One-shot patch is already applied; this workflow is retained only until cleanup."
