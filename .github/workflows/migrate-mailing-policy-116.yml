name: Migrate mailing policy 1.16
# trigger taste/deal semantic separation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-mailing-policy-116.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Separate deal rules from taste semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pth = Path('config/mailing_policy.json')
          p = json.loads(pth.read_text(encoding='utf-8'))
          p['version'] = '1.16'

          p['taste_deal_separation'] = {
              'required': True,
              'taste_verdict_is_price_blind': True,
              'forbidden_as_positive_taste_evidence': [
                  'discount_percent',
                  'final_kzt',
                  'global_review_positive',
                  'global_review_count',
                  'russian_review_positive',
                  'russian_review_count',
                  'exceptional_discount',
                  'very_high_rating',
                  'mainstream_quality',
                  'popular_quality',
                  'cheap_quality',
                  'steamdb_history',
                  'historical_minimum',
                  'sale_end_date',
              ],
              'recall_only_feed_flags': [
                  'strong_fit',
                  'strong_niche_fit',
                  'recent_fit',
                  'high_confidence_adjacent',
              ],
              'recall_flags_can_trigger_audit_but_are_not_taste_evidence': True,
              'core_fit_count_is_recall_context_not_positive_taste_evidence': True,
              'deal_quality_can_never_raise_taste_fit': True,
              'deal_quality_evaluated_only_after_final_taste_and_family_resolution': True,
          }

          pf = p['personal_filter']
          pf.pop('deal_discount_cannot_upgrade_below_moderate_taste', None)
          pf['valid_exclusion_reason_codes'] = [
              code for code in pf['valid_exclusion_reason_codes']
              if code != 'symbolic_discount_not_worth_mailing_attention'
          ]

          p['deal_selection'] = {
              'status': 'canonical',
              'taste_is_primary_eligibility_filter': True,
              'minimum_taste_fit': 'moderate',
              'discount_can_never_raise_taste_fit': True,
              'below_moderate_taste_cannot_be_rescued_by_discount': True,
              'symbolic_discount_max_percent_inclusive': 5,
              'symbolic_discount_is_early_commercial_exclusion': True,
              'normal_target_rub': 500,
              'strong_standard_overage_ceiling_rub': 650,
              'strong_absolute_ceiling_rub': 750,
              'moderate_absolute_ceiling_rub': 550,
              'exceptional_discount_min_percent_for_high_overage': 75,
              'high_overage_requires_strong_taste': True,
              'price_above_750_excluded_regardless_of_taste_or_discount': True,
              'conceptual_weight_taste': 0.6,
              'conceptual_weight_deal': 0.4,
              'weak_non_symbolic_deal_within_budget_may_remain_low_priority_or_wait': True,
              'commercial_rules_are_excluded_from_taste_cache_semantics': True,
          }

          pth.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Prove original taste semantics restored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.taste_cache_common import taste_semantics_digest

          p = json.loads(Path('config/mailing_policy.json').read_text(encoding='utf-8'))
          digest = taste_semantics_digest(p)
          assert p['version'] == '1.16'
          assert digest == '28177637756ffc4cf51ea8cb7a37b6e3d1173dd11f852deb56966d29261ec13b', digest
          assert p['deal_selection']['strong_absolute_ceiling_rub'] == 750
          assert p['deal_selection']['commercial_rules_are_excluded_from_taste_cache_semantics'] is True
          print('TASTE_SEMANTICS_RESTORED=' + digest)
          PY
      - name: Commit
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git add config/mailing_policy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate deal policy from taste cache semantics"
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          git push origin HEAD:main
