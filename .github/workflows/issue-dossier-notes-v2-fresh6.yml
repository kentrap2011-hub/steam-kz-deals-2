name: Issue one exact fresh6 Dossier Notes V2 frozen sandbox (manual only)

# Not triggered by push, pull_request, schedule, or source PR CI.
# Must run from merged main, by authenticated first-attempt repository OWNER.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact current main SHA; recheck before manual dispatch"
        required: true
        type: string
      confirmation:
        description: "Explicit one-use owner confirmation: FREEZE_DOSSIER_NOTES_V2_FRESH6_ONCE"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dossier-notes-v2-fresh6-frozen-issuer-only
  cancel-in-progress: false

jobs:
  issue-exact-six-sandbox-only:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.actor_id == 315790060 && github.repository_owner_id == 315790060
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Freeze or authorize only the exact six-item immutable GitHub source
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPLICIT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python scripts/dossier_notes_v2_fresh6_issuer.py freeze \
            --expected-main-sha "$EXPECTED_MAIN_SHA" \
            --confirmation "$EXPLICIT_CONFIRMATION"
      - name: Assert no untracked local issuer residue
        run: test -z "$(git status --porcelain --untracked-files=all)"
