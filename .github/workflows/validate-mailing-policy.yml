name: Validate mailing policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - ".github/workflows/validate-mailing-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate locked invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("config/mailing_policy.json").read_text(encoding="utf-8"))
          floor = p["personal_filter"]["deterministic_compound_floor"]
          zero = p["pricing"]["historical_zero_handling"]
          hist = p["external_cache"]["steamdb_history"]
          reg = p["external_cache"]["lookup_registry"]

          checks = {
              "contract": p.get("contract") == "GAME-DEALS-MAILING",
              "canonical": p.get("status") == "canonical",
              "policy_before_ingest": p["policy_loading"]["do_not_start_ingest_before_canonical_policy_loaded"] is True,
              "full_snapshot": p["delivery"]["mode"] == "full_daily_snapshot",
              "not_delta": p["delivery"]["delta_only"] is False,
              "no_topn": p["delivery"]["fixed_top_n"] is None,
              "completed_not_excluded": p["delivery"]["completed_games_auto_excluded"] is False,
              "wishlist_not_discovery": p["taste_profile"]["wishlist_is_discovery_source"] is False,
              "production_primary": p["paid_discovery"]["production_feed_is_primary_discovery_source"] is True,
              "steamdb_not_discovery": p["paid_discovery"]["steamdb_for_discovery"] is False,
              "read_all_chunks": p["paid_discovery"]["read_all_chunks"] is True,
              "qa_fail_closed": p["ingest_qa"]["fail_closed"] is True,
              "coverage": p["ingest_qa"]["minimum_coverage_ratio"] >= 0.99,
              "row_count": p["ingest_qa"]["require_actual_data_rows_equals_item_count"] is True,
              "moderate": p["personal_filter"]["minimum_interest_threshold"] == "moderate",
              "strong_fit_not_verdict": p["personal_filter"]["strong_fit_is_not_final_taste_verdict"] is True,
              "floor_enabled": floor["enabled"] is True,
              "floor_core2": floor["minimum_core_fit_count"] >= 2,
              "floor_recall": set(floor["requires_any_recall_signal"]) == {"strong_fit", "strong_niche_fit"},
              "floor_support": "exceptional_discount" in floor["requires_any_supporting_signal"],
              "floor_negative_block": floor["blocked_by_direct_strong_negative_user_evidence"] is True,
              "floor_result": floor["result"] == "at_least_moderate_fit",
              "targeted_audit": p["false_negative_audit"]["mode"] == "targeted_local_conflict_audit",
              "audit_no_external": p["false_negative_audit"]["external_lookups_during_audit"] is False,
              "floor_audited": "candidate_meets_deterministic_compound_floor_but_first_pass_excluded_it" in p["false_negative_audit"]["audit_when"],
              "no_whitelist": p["false_negative_audit"]["no_candidate_name_whitelists"] is True,
              "family_resolution": p["offer_family_resolution"]["required"] is True,
              "best_variant": p["offer_family_resolution"]["primary_row_must_use_best_purchase_variant"] is True,
              "soft500": p["pricing"]["target_rub"] == 500 and p["pricing"]["target_is_hard_cap"] is False,
              "rub": p["pricing"]["user_visible_currency"] == "RUB",
              "zero_free_history": zero["zero_is_free_promo_history_not_paid_minimum"] is True,
              "zero_no_delta": zero["do_not_use_zero_to_compute_paid_price_delta"] is True,
              "zero_no_wait": zero["do_not_force_wait_because_game_was_once_free"] is True,
              "store_conditional": p["verification"]["steam_store_live_check_mode"] == "conditional_only",
              "sale_end_optional": p["verification"]["sale_end_date_is_optional"] is True,
              "cache_enabled": p["external_cache"]["enabled"] is True,
              "history_kzt": hist["currency"] == "KZT",
              "zero_cache_valid": "previously free" in hist["zero_min_entry_rule"],
              "lookup_registry": reg["required"] is True,
              "lookup_no_repeat": reg["never_repeat_same_key_in_run"] is True,
              "sorting": p["sorting"]["required"] is True,
              "not_feed_order": p["sorting"]["do_not_preserve_feed_or_processing_order"] is True,
              "silent_exclusions": p["output_visibility"]["silent_exclusions"] is True,
              "one_upcoming": p["upcoming"]["max_items"] == 1,
              "no_speed_loss": p["runtime_optimization"]["do_not_trade_completeness_for_speed"] is True,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Mailing policy invariant failure: " + ", ".join(failed))
          print(f"OK: {len(checks)} locked mailing invariants validated")
          PY
