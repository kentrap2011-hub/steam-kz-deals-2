name: Validate mailing policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - "config/taste_cache_entry_contract.json"
      - "scripts/taste_cache_common.py"
      - "scripts/validate_mailing_policy.py"
      - ".github/workflows/validate-mailing-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate locked invariants
        run: python scripts/validate_mailing_policy.py
