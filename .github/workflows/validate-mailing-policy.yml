name: Validate mailing policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - ".github/workflows/validate-mailing-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate locked invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("config/mailing_policy.json").read_text(encoding="utf-8"))

          checks = {
              "contract": p.get("contract") == "GAME-DEALS-MAILING",
              "canonical": p.get("status") == "canonical",
              "github_policy_primary": p["policy_loading"]["primary_method"] == "github_connector_or_github_contents",
              "policy_before_ingest": p["policy_loading"]["do_not_start_ingest_before_canonical_policy_loaded"] is True,
              "full_daily_snapshot": p["delivery"]["mode"] == "full_daily_snapshot",
              "not_delta": p["delivery"]["delta_only"] is False,
              "repeat_active": p["delivery"]["repeat_still_active_relevant_deals_each_day"] is True,
              "no_fixed_top_n": p["delivery"]["fixed_top_n"] is None,
              "completed_not_excluded": p["delivery"]["completed_games_auto_excluded"] is False,
              "wishlist_not_discovery": p["taste_profile"]["wishlist_is_discovery_source"] is False,
              "production_primary": p["paid_discovery"]["production_feed_is_primary_discovery_source"] is True,
              "steamdb_not_discovery": p["paid_discovery"]["steamdb_for_discovery"] is False,
              "all_chunks": p["paid_discovery"]["read_all_chunks"] is True,
              "qa_fail_closed": p["ingest_qa"]["fail_closed"] is True,
              "coverage": p["ingest_qa"]["minimum_coverage_ratio"] >= 0.99,
              "freshness": p["ingest_qa"]["maximum_snapshot_age_hours"] <= 18,
              "row_count_check": p["ingest_qa"]["require_actual_data_rows_equals_item_count"] is True,
              "feed_signals_not_auto_include": p["personal_filter"]["feed_signals_never_auto_include"] is True,
              "mixed_evidence_rule": bool(p["personal_filter"].get("mixed_evidence_rule")),
              "sparse_metadata_rule": bool(p["personal_filter"].get("sparse_metadata_rule")),
              "targeted_local_audit": p["false_negative_audit"]["mode"] == "targeted_local_conflict_audit",
              "audit_no_external": p["false_negative_audit"]["external_lookups_during_audit"] is False,
              "no_name_whitelists": p["false_negative_audit"]["no_candidate_name_whitelists"] is True,
              "family_resolution": p["offer_family_resolution"]["required"] is True,
              "compare_all_variants": p["offer_family_resolution"]["compare_all_local_variants_in_an_included_family"] is True,
              "one_row_per_family": p["offer_family_resolution"]["one_primary_output_row_per_purchase_family"] is True,
              "best_variant_primary": p["offer_family_resolution"]["primary_row_must_use_best_purchase_variant"] is True,
              "soft_500": p["pricing"]["target_rub"] == 500 and p["pricing"]["target_is_hard_cap"] is False,
              "rub_only": p["pricing"]["user_visible_currency"] == "RUB" and p["pricing"]["show_foreign_currency_to_user"] is False,
              "fresh_feed_current_state": p["verification"]["production_snapshot_satisfies_current_state_when_qa_passes"] is True,
              "store_conditional_only": p["verification"]["steam_store_live_check_mode"] == "conditional_only",
              "no_store_repeat": p["verification"]["do_not_query_store_only_to_repeat_price_or_discount_already_in_fresh_production_snapshot"] is True,
              "sale_end_optional": p["verification"]["sale_end_date_is_optional"] is True,
              "steamdb_history_only": p["verification"]["steamdb_usage"] == "history_only_after_personal_selection",
              "cache_enabled": p["external_cache"]["enabled"] is True,
              "cache_not_discovery": p["external_cache"]["cache_is_never_discovery_source"] is True,
              "cache_once": p["external_cache"]["load_each_cache_at_most_once_per_run"] is True,
              "store_cache_path": p["external_cache"]["store_state"]["path"] == "data/cache/store_state.json",
              "store_cache_not_required": p["external_cache"]["store_state"]["required_for_mailing"] is False,
              "steamdb_cache_path": p["external_cache"]["steamdb_history"]["path"] == "data/cache/steamdb_history.json",
              "steamdb_cache_persistent": p["external_cache"]["steamdb_history"]["persistent_outside_production_directory"] is True,
              "steamdb_cache_kzt": p["external_cache"]["steamdb_history"]["currency"] == "KZT",
              "steamdb_cache_exact_key": "exact Steam entity key" in p["external_cache"]["steamdb_history"]["keying"],
              "single_cache_write": "exactly one GitHub file write" in p["external_cache"]["steamdb_history"]["write_back"],
              "cache_write_warning_only": p["external_cache"]["steamdb_history"]["write_failure_does_not_invalidate_mailing"] is True,
              "no_guessed_minima": p["external_cache"]["steamdb_history"]["do_not_store_inferred_or_guessed_minima"] is True,
              "no_per_candidate_store": "do not check every final INCLUDE" in p["runtime_optimization"]["stage_d"],
              "steamdb_cache_first": "persistent SteamDB KZ history cache first" in p["runtime_optimization"]["stage_e"],
              "single_cache_write_stage": "at most one GitHub write" in p["runtime_optimization"]["stage_g"],
              "sorting_required": p["sorting"]["required"] is True,
              "not_feed_order": p["sorting"]["do_not_preserve_feed_or_processing_order"] is True,
              "upcoming_one": p["upcoming"]["max_items"] == 1,
              "silent_exclusions": p["output_visibility"]["silent_exclusions"] is True,
              "no_candidate_progress_names": p["output_visibility"]["do_not_emit_candidate_names_in_progress_messages_before_final_verification"] is True,
              "no_speed_loss": p["runtime_optimization"]["do_not_trade_completeness_for_speed"] is True,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Mailing policy invariant failure: " + ", ".join(failed))

          print(f"OK: {len(checks)} locked mailing invariants validated")
          PY
