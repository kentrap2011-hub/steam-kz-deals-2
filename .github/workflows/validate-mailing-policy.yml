name: Validate mailing policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/mailing_policy.json"
      - ".github/workflows/validate-mailing-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate locked invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("config/mailing_policy.json").read_text(encoding="utf-8"))

          checks = {
              "contract": policy.get("contract") == "GAME-DEALS-MAILING",
              "canonical": policy.get("status") == "canonical",
              "github_policy_primary": policy["policy_loading"]["primary_method"] == "github_connector_or_github_contents",
              "web_cache_not_authoritative": policy["policy_loading"]["web_cached_copy_is_not_authoritative"] is True,
              "policy_before_ingest": policy["policy_loading"]["do_not_start_ingest_before_canonical_policy_loaded"] is True,
              "full_daily_snapshot": policy["delivery"]["mode"] == "full_daily_snapshot",
              "not_delta": policy["delivery"]["delta_only"] is False,
              "repeat_active": policy["delivery"]["repeat_still_active_relevant_deals_each_day"] is True,
              "no_fixed_top_n": policy["delivery"]["fixed_top_n"] is None,
              "completed_not_excluded": policy["delivery"]["completed_games_auto_excluded"] is False,
              "wishlist_not_discovery": policy["taste_profile"]["wishlist_is_discovery_source"] is False,
              "production_primary": policy["paid_discovery"]["production_feed_is_primary_discovery_source"] is True,
              "steamdb_not_discovery": policy["paid_discovery"]["steamdb_for_discovery"] is False,
              "all_chunks": policy["paid_discovery"]["read_all_chunks"] is True,
              "optimized_not_new_discovery": policy["paid_discovery"]["optimized_view_is_not_a_new_discovery_source"] is True,
              "safe_source_fallback": policy["paid_discovery"]["safe_fallback_to_source_shortlist"] is True,
              "qa_fail_closed": policy["ingest_qa"]["fail_closed"] is True,
              "coverage": policy["ingest_qa"]["minimum_coverage_ratio"] >= 0.99,
              "freshness": policy["ingest_qa"]["maximum_snapshot_age_hours"] <= 18,
              "chunk_count_check": policy["ingest_qa"]["require_actual_chunk_count_equals_index_chunk_count"] is True,
              "row_count_check": policy["ingest_qa"]["require_actual_data_rows_equals_item_count"] is True,
              "optimized_row_match": policy["ingest_qa"]["optimized_view_must_match_source_item_count"] is True,
              "optimized_age_match": policy["ingest_qa"]["optimized_view_must_match_source_updated_at"] is True,
              "no_partial_on_failure": policy["ingest_qa"]["on_source_failure"] == "do_not_generate_any_mailing",
              "moderate_threshold": policy["personal_filter"]["minimum_interest_threshold"] == "moderate",
              "feed_signals_not_auto_include": policy["personal_filter"]["feed_signals_never_auto_include"] is True,
              "strong_fit_not_verdict": policy["personal_filter"]["strong_fit_is_not_final_taste_verdict"] is True,
              "analogical_fit": policy["personal_filter"]["allow_analogical_fit_from_profile"] is True,
              "no_exact_match_requirement": policy["personal_filter"]["do_not_require_exact_title_or_exact_tag_match"] is True,
              "unknown_not_auto_include": policy["personal_filter"]["unknown_is_not_automatic_include"] is True,
              "specific_exclusion_reason": policy["personal_filter"]["exclusion_requires_specific_reason"] is True,
              "ledger_required": policy["decision_ledger"]["required"] is True,
              "ledger_covers_all": policy["decision_ledger"]["require_included_plus_excluded_equals_processed_candidates"] is True,
              "targeted_local_audit": policy["false_negative_audit"]["mode"] == "targeted_local_conflict_audit",
              "audit_no_external": policy["false_negative_audit"]["external_lookups_during_audit"] is False,
              "no_mass_reaudit": policy["false_negative_audit"]["do_not_reaudit_nearly_all_excludes"] is True,
              "no_name_whitelists": policy["false_negative_audit"]["no_candidate_name_whitelists"] is True,
              "no_control_names": policy["false_negative_audit"]["no_control_game_names_in_policy"] is True,
              "family_resolution": policy["offer_family_resolution"]["required"] is True,
              "soft_500": policy["pricing"]["target_rub"] == 500 and policy["pricing"]["target_is_hard_cap"] is False,
              "rub_only": policy["pricing"]["user_visible_currency"] == "RUB" and policy["pricing"]["show_foreign_currency_to_user"] is False,
              "steamdb_history_only": policy["verification"]["steamdb_usage"] == "history_only_after_personal_selection",
              "fit_before_external": policy["verification"]["taste_fit_must_be_final_before_external_checks"] is True,
              "cache_not_discovery": policy["external_cache"]["cache_is_never_discovery_source"] is True,
              "compact_chunks": policy["runtime_optimization"]["mailing_chunk_target_size"] >= 100,
              "no_speed_loss": policy["runtime_optimization"]["do_not_trade_completeness_for_speed"] is True,
              "silent_rejected_freebies": policy["freebies"]["silently_omit_rejected_freebies"] is True,
              "upcoming_one": policy["upcoming"]["max_items"] == 1 and policy["upcoming"]["selection"] == "nearest_relevant_event_only",
              "silent_exclusions": policy["output_visibility"]["silent_exclusions"] is True,
              "no_rejected_explanations": policy["output_visibility"]["do_not_explain_why_rejected_games_or_freebies_were_omitted"] is True,
              "freebies_after_ingest": policy["freebies"]["only_after_successful_main_ingest"] is True,
              "upcoming_after_ingest": policy["upcoming"]["only_after_successful_main_ingest"] is True,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Mailing policy invariant failure: " + ", ".join(failed))

          print(f"OK: {len(checks)} locked mailing invariants validated")
          PY
