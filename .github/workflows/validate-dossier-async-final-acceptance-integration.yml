name: Validate inactive Dossier final GitHub acceptance integration

on:
  pull_request:
    paths:
      - "scripts/dossier_two_stage_final_acceptance.py"
      - "scripts/test_dossier_two_stage_final_acceptance.py"
      - "config/dossier_two_stage_final_acceptance_bridge_contract.json"
      - "scripts/dossier_two_stage_async_buffer.py"
      - "scripts/dossier_two_stage_staging.py"
      - "scripts/taste_steam_review_dossier_buffered.py"
      - ".github/workflows/validate-dossier-async-final-acceptance-integration.yml"

permissions:
  contents: read

jobs:
  offline-final-group-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only PR source for isolated tests
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict schema validator
        run: python -m pip install "jsonschema>=4.21,<5"
      - name: Compile inactive bridge and fixture regressions
        run: python -m py_compile scripts/dossier_two_stage_final_acceptance.py scripts/test_dossier_two_stage_final_acceptance.py
      - name: Disposable Git original-group handoff, canonical writer and adversarial regressions
        run: python -m unittest discover -s scripts -p 'test_dossier_two_stage_final_acceptance.py' -v
      - name: Earlier independent eventual chain regression (known Research year XFAIL is blocker)
        run: python -m unittest discover -s scripts -p 'test_dossier_two_stage_eventual_chain_qa.py' -v
      - name: Existing async and one-stage deterministic semantics
        run: |
          python -m unittest discover -s scripts -p 'test_dossier_two_stage_async_buffer.py' -v
          python -m unittest discover -s scripts -p 'test_taste_steam_review_dossier_buffered_submission.py' -v
