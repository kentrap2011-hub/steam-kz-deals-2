name: One-shot context-bound Call of the Sea taste persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/persist-call-of-the-sea-context-taste.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact context-bound ingest input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          TARGET = 'App_1042490'
          EXPECTED_CONTEXT = 'e8bf2cef4e4b24b583016b2594a4961f2e275edf56e8b847210a65692998b74f'
          queue = [json.loads(line) for line in Path('data/production/pre_ai/chatgpt_taste_queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          rows = {row['taste_subject_key']: row for row in queue}
          row = rows.get(TARGET)
          if row is None:
              raise SystemExit('Call of the Sea is not in the current taste queue')
          if row.get('candidate_context_sha256') != EXPECTED_CONTEXT:
              raise SystemExit('Call of the Sea candidate context changed before persistence')
          description = row.get('short_description') or ''
          required_fragments = ['search for her missing husband', 'adventure puzzle game', 'mystery']
          if not all(fragment.casefold() in description.casefold() for fragment in required_fragments):
              raise SystemExit('Call of the Sea description no longer supports the evaluated evidence')

          projection = json.loads(Path('data/production/pre_ai/taste_projection.json').read_text(encoding='utf-8'))
          deals = json.loads(Path('data/production/pre_ai/deal_scenarios.json').read_text(encoding='utf-8'))
          deal = deals['entries'].get(TARGET)
          if deal is None:
              raise SystemExit('Call of the Sea deal scenario missing')
          if deal['decision_if_moderate']['final_disposition'] != 'INCLUDE':
              raise SystemExit('Call of the Sea moderate deal scenario is not INCLUDE')

          overlay = json.loads(Path('data/cache/taste_fit.entry_overlay.json').read_text(encoding='utf-8'))
          if overlay.get('entry_count') != 1:
              raise SystemExit(f"Unexpected overlay baseline count: {overlay.get('entry_count')}")
          if TARGET in (overlay.get('entries') or {}):
              raise SystemExit('Call of the Sea already exists in overlay before targeted persistence')

          bindings = {
              'profile_blob_sha': projection['current_profile']['blob_sha'],
              'taste_model_version': projection['current_binding']['taste_model_version'],
              'taste_semantics_sha256': projection['current_binding']['taste_semantics_sha256'],
              'source_mailing_updated_at_utc': projection['source_mailing_updated_at_utc'],
          }
          doc = {
              'schema_version': 1,
              'bindings': bindings,
              'results': [{
                  'key': TARGET,
                  'appid': row['appid'],
                  'taste_fingerprint': row['taste_fingerprint'],
                  'candidate_context_sha256': row['candidate_context_sha256'],
                  'verdict': 'INCLUDE',
                  'fit_level': 'moderate',
                  'reason_code': 'include_moderate',
                  'positive_evidence': [
                      'The prepared Steam context explicitly describes an adventure puzzle game with a concrete search objective; this matches the canonical profile signal that puzzles work best when they are embedded inside an adventure rather than forming an isolated repetitive puzzle loop.',
                      'The prepared Steam context explicitly centers uncovering forbidden secrets and a mystery while the goal remains finding the missing husband; this matches the canonical profile preference for mystery and discoverable secrets without being left unclear about the immediate objective.'
                  ],
                  'negative_evidence': []
              }],
          }
          Path('/tmp/call_of_the_sea_taste.json').write_text(json.dumps(doc, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({
              'target': TARGET,
              'candidate_context_sha256': row['candidate_context_sha256'],
              'moderate_deal_disposition': deal['decision_if_moderate']['final_disposition'],
              'baseline_ai_queue_count': len(queue),
              'baseline_overlay_count': overlay['entry_count'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist through canonical ingest
        run: python scripts/ingest_taste_results.py --input /tmp/call_of_the_sea_taste.json

      - name: Rebuild targeted downstream consumers
        run: |
          python scripts/build_taste_cache_index.py
          python scripts/build_pre_ai_taste_projection.py
          python scripts/build_pre_ai_chatgpt_payload.py

      - name: Prove exactly one context-bound cache hit and queue reduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          TARGET = 'App_1042490'
          EXPECTED_CONTEXT = 'e8bf2cef4e4b24b583016b2594a4961f2e275edf56e8b847210a65692998b74f'
          overlay = json.loads(Path('data/cache/taste_fit.entry_overlay.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/cache/taste_fit.entry_index.json').read_text(encoding='utf-8'))
          projection = json.loads(Path('data/production/pre_ai/taste_projection.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/production/pre_ai/chatgpt_payload.json').read_text(encoding='utf-8'))
          queue = [json.loads(line) for line in Path('data/production/pre_ai/chatgpt_taste_queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]

          target = overlay['entries'].get(TARGET)
          checks = {
              'overlay_1_to_2': overlay.get('entry_count') == 2 and len(overlay.get('entries') or {}) == 2,
              'target_persisted': target is not None,
              'target_context_exact': target is not None and target.get('candidate_context_sha256') == EXPECTED_CONTEXT,
              'target_moderate_include': target is not None and target.get('verdict') == 'INCLUDE' and target.get('fit_level') == 'moderate' and target.get('reason_code') == 'include_moderate',
              'two_positive_evidence': target is not None and len(target.get('positive_evidence') or []) == 2,
              'index_one_context_bound': index.get('candidate_context_bound_count') == 1,
              'projection_one_safe_hit': projection.get('safe_cache_hit_count') == 1,
              'projection_618_ai_required': projection.get('ai_required_count') == 618,
              'target_is_cache_hit': projection['entries'][TARGET].get('status') == 'cache_hit',
              'queue_557_to_556': manifest.get('ai_queue_count') == 556 and len(queue) == 556,
              'ready_0_to_1': manifest.get('ready_without_ai_count') == 1,
              'excludes_unchanged': manifest.get('deterministically_excluded_without_ai_count') == 62,
              'sale_end_unchanged': manifest.get('mandatory_sale_end_coverage') == 1.0,
              'target_removed_from_ai_queue': TARGET not in {row['taste_subject_key'] for row in queue},
          }
          failed = [name for name, ok in checks.items() if not ok]
          print(json.dumps({
              'checks': checks,
              'safe_cache_hit_count': projection.get('safe_cache_hit_count'),
              'ai_required_count': projection.get('ai_required_count'),
              'ai_queue_count': manifest.get('ai_queue_count'),
              'ready_without_ai_count': manifest.get('ready_without_ai_count'),
              'deterministically_excluded_without_ai_count': manifest.get('deterministically_excluded_without_ai_count'),
          }, ensure_ascii=False, indent=2))
          if failed:
              raise SystemExit(f'Targeted context-bound persistence proof failed: {failed}')
          print('CALL_OF_THE_SEA_CONTEXT_PERSISTENCE_TARGETED=PASS')
          PY

      - name: Commit overlay only
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"
          git restore data/cache/taste_fit.entry_index.json data/production/pre_ai || true
          git add data/cache/taste_fit.entry_overlay.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "data/cache/taste_fit.entry_overlay.json"
          git commit -m "Persist context-bound Call of the Sea taste verdict"
          git push origin HEAD:main
